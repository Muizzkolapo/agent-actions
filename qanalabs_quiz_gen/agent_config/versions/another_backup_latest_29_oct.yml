################################################################################
# QanaLabs Quiz Generation Workflow
################################################################################
# Description: Educational quiz generation workflow with fact extraction,
#              clustering, validation, and distractor generation
# Version: 2.0.0
#
# Workflow Phases:
#   1. Fact Extraction & Validation
#   2. Summary Generation & Code Cleanup
#   3. Question Generation & Validation
#   4. Explanation & Distractor Generation
#   5. Quiz Validation
#
# See workflow plan at bottom of file for execution order
################################################################################

name: qanalabs_quiz_gen
description: "Educational quiz generation workflow with fact extraction, clustering, validation, and distractor generation"
version: "2.0.0"

# Global defaults applied to all actions unless overridden
defaults:
  json_mode: true
  granularity: Record
  run_mode: online
  is_operational: true
  prompt_debug: false
  few_shot: 0



actions:
  # ============================================================================
  # PHASE 1: FACT EXTRACTION & VALIDATION
  # ============================================================================

  - name: fact_extractor
    intent: "Extract candidate facts from educational content"
    model_vendor: openai
    model_name: gpt-4o-mini
    api_key: OPENAI_API_KEY
    schema: candidate_facts_list
    drops: [id, url, topic]  # overrides defaults - unique drops for this action
    observe: [id, url, topic,page_content,platform_name,exam_name,bloom_details] 
    prompt: $qanalabs_quiz_gen.Fact_extraction

  - name: flatten_the_facts
    kind: tool
    impl: flatten_quotes
    intent: "Group extracted facts into logical clusters"
    observe: [topic, summary,page_content]  # only unique additions
    drops: [id, url, topic,page_content]  # overrides defaults - unique drops for this action
    guard: 
      condition:  'candidate_facts_list != []'  # overrides default guard
      on_false: "filter"  # Options: "skip" | "filter"

  - name: cluster_list
    kind: tool
    impl: run_dedup
    intent: "Group extracted facts into logical clusters"
    observe: [topic, summary]  # only unique additions
    granularity: file

  - name: group_by_similarity
    kind: tool
    impl: group_by_similarity
    intent: "Group extracted facts into logical clusters"
    granularity: file

  - name: Cluster_Validation_Agent
    intent: "Validate and regroup facts based on semantic_unique_id to ensure semantically identical facts are clustered together"
    model_vendor: openai
    model_name: gpt-4o-mini
    api_key: OPENAI_API_KEY
    schema: cluster_validation
    drops: [id, url, topic]  # overrides defaults - unique drops for this action
    observe: [grouped_facts, page_content, semantic_unique_id, topic, platform_name, exam_name, bloom_details, num_similar_facts, similarity_group_id]  # only unique additions
    prompt: $qanalabs_quiz_gen.Cluster_Validation_Agent
    granularity: record
    prompt_debug: True
    guard:
      condition:  'num_similar_facts != 1'  # overrides default guard
      on_false: "skip"  # Options: "skip" | "filter"


  - name: flatten_clusters
    kind: tool
    impl: flatten_clusters
    intent: "Group extracted facts into logical clusters"
    observe: [topic, summary,page_content]  # only unique additions
    granularity: record
    guard: 
      condition:  'should_keep_cluster == false'  # overrides default guard
      on_false: "skip"  # Options: "skip" | "filter"

  - name: classify_feynman
    intent: "Classify quiz type using Feynman technique principles"
    schema: {quiz_type: string, rationale: string}
    drops: [id, url, page_content, bloom_details]  # overrides defaults
    observe: [summary, question, options, answer_explanation, answer, excerpt, options_answer, question_type, target_word_counts, correct_answer_words,similarity_group_id,grouped_facts,page_content]  # only unique additions
    few_shot: 6
    model_vendor: openai
    model_name: gpt-4o-mini
    api_key: OPENAI_API_KEY
    prompt: $feynman.classifer_feynman
    guard: 'questionable != "Low Value"'
    prompt_debug: False


  # ============================================================================
  # PHASE 2: SUMMARY GENERATION & CODE CLEANUP
  # ============================================================================

  - name: generate_summary
    intent: "Generate quiz-type specific summaries synthesizing multiple flagged items with appropriate technical details and code snippets"
    schema: {
      summary_title: string,
      summary_content: string,
      key_concepts: array,
      technical_details: string,
      code_snippets: array,
      learning_objectives: array
    }
    observe: [quiz_type, rationale, grouped_facts,similarity_group_id, id, page_content, bloom_details, questionable, url, platform_name, exam_name]
    drops: [id, questionable, url]  # Drop from context
    prompt: $qanalabs_quiz_gen.Summary_Generator
    model_vendor: openai
    model_name: gpt-5-mini
    api_key: OPENAI_API_KEY
    prompt_debug: True


  # ============================================================================
  # QUALITY SCORING & FILTERING
  # ============================================================================
  # Rule-based scoring (0-100) followed by LLM review for borderline cases

  - name: score_summary_quality
    kind: tool
    impl: score_summary_quality
    intent: "Score summary quality based on Azure DS Associate exam syllabus alignment"
    observe: [summary_content, summary_title, key_concepts, technical_details, code_snippets, learning_objectives, technical_level, grouped_facts, quiz_type]

  - name: review_borderline_summaries
    model_vendor: openai
    model_name: gpt-4o-mini
    api_key: OPENAI_API_KEY
    intent: "LLM review for borderline quality summaries (scores 40-60)"
    schema: borderline_summary_review
    observe: [quality_score, quality_tier, summary_content, summary_title, key_concepts, technical_details, code_snippets, platform_name, exam_name]
    prompt: $qanalabs_quiz_gen.Review_Borderline_Summary
    prompt_debug: True
    guard:
      condition: 'quality_tier == "borderline"'
      on_false: "skip"

  - name: filter_low_quality_summaries
    kind: tool
    impl: apply_quality_filter
    intent: "Filter out low-quality summaries (keep only score >= 50 or LLM-approved borderline)"
    observe: [quality_score, quality_tier, final_decision, summary_content, summary_title]

  - name: review_code_snippets
    model_vendor: openai
    model_name: gpt-4o-mini
    api_key: OPENAI_API_KEY
    intent: "Review code snippets and filter out non-code documentation"
    schema: {"code_snippets": "array", "removed_snippets": "array", "removal_reasoning": "string"}
    prompt: $qanalabs_quiz_gen.Review_Code_Snippets
    prompt_debug: True
    observe: [id, bloom_details, questionable, url, learning_objectives, key_concepts, technical_details, quiz_type, rationale, fact_explanation, fact, quote, platform_name, exam_name, summary_content, summary_title, page_content]
    drops: [id, bloom_details, questionable, url, learning_objectives, key_concepts, technical_details, quiz_type, rationale, fact_explanation, fact, quote, platform_name, exam_name, summary_content, summary_title, summary_content_valid, summary_content_reasoning, summary_content_response_confidence_level, technical_level, page_content]  
    guard:
      condition: 'code_snippets != []'
      on_false: "skip" 


  - name: fix_code_snippets
    kind: tool
    impl: fix_code_snippets
    intent: "Fix double-escaped code snippets in content.code_snippets field"
    granularity: Record
    observe: [id, bloom_details, questionable, url, learning_objectives, key_concepts, technical_details, quiz_type, rationale, fact_explanation, fact, quote, platform_name, exam_name, summary_content, summary_title, code_snippets, page_content]
    drops: [id, bloom_details, questionable, url, learning_objectives, key_concepts, technical_details, quiz_type, rationale, fact_explanation, fact, quote, platform_name, exam_name, summary_content, summary_title, summary_content_valid, summary_content_reasoning, summary_content_response_confidence_level, technical_level, page_content]  



  # ============================================================================
  # PHASE 3: QUESTION GENERATION & VALIDATION
  # ============================================================================

  - name: generate_scenarios
    intent: "Generate quiz scenarios based on classified facts and learning objectives"
    model_vendor: openai
    model_name: gpt-4o-mini
    api_key: OPENAI_API_KEY
    schema: ScenarioGenerator_schema
    observe: [id, bloom_details, questionable, url, learning_objectives, key_concepts, technical_details, quiz_type, rationale, fact_explanation, fact, quote, platform_name, exam_name, summary_content, summary_title, code_snippets, page_content]
    drops: [rationale, bloom_details, page_content,code_snippets,final_decision,syllabus_areas,syllabus_area,reasoning,confidence,quality_score,quality_tier,filter_decision]
    prompt: $feynman.ScenarioGenerator_prompt
    prompt_debug: true

  - name: fix_options_format
    kind: tool
    impl: fix_options_formatting
    intent: "Convert options field from JSON string to array format"
    granularity: Record
    observe: [options, question, answer, answer_explanation]



  - name: flatten_questions
    kind: tool
    impl: flatten_questions
    intent: "Flatten nested question structures for processing"
    granularity: Record


  # ============================================================================
  # PHASE 4: EXPLANATION & DISTRACTOR GENERATION
  # ============================================================================

  - name: generate_feynman_explanation
    intent: "Generate Feynman-style explanations for why the quiz answer is correct"
    schema: {
      question_explanation: string,
      answer_reasoning: string,
      key_concept_analogy: string,
      memorable_takeaway: string
    }
    api_key: CLAUDE_API_KEY
    model_vendor: "anthropic"
    model_name: "claude-3-5-haiku-20241022"
    observe: [question, options, answer, answer_explanation, quiz_type, learning_objectives, summary_content, summary_title, fact_explanation, key_concepts, technical_details, platform_name, exam_name, code_snippets]
    drops: [id, bloom_details, questionable, url, platform_name, exam_name, quiz_type, rationale, page_content] 
    prompt: $qanalabs_quiz_gen.Feynman_Explanation_Generator
    prompt_debug: true

  - name: suggest_distractor_counts
    kind: tool
    impl: suggest_word_counts
    intent: "Suggest word counts for answer distractors"
    observe: [question, options, answer, answer_explanation, quiz_type, learning_objectives, summary_content, summary_title, fact_explanation, key_concepts, technical_details, platform_name, exam_name, code_snippets, candidate_facts_list, why_questionable, grouped_facts,similarity_group_id, question_explanation, key_concept_analogy, memorable_takeaway, answer_reasoning, question_type, url]

  - name: add_answer_text
    kind: tool
    impl: add_answer_text
    granularity: Record
    intent: "Add structured answer text to questions"
    observe: [candidate_facts_list, why_questionable, grouped_facts,similarity_group_id, summary_title, summary_content, key_concepts, learning_objectives, technical_details, code_snippets, question_explanation, key_concept_analogy, memorable_takeaway, answer_reasoning, question, options, answer, answer_explanation, quiz_type, fact_explanation, platform_name, exam_name, question_type, url]  # Enhanced with summary outputs

  # ============================================================================
  # SEQUENTIAL DISTRACTOR GENERATION (replaces parallel loop)
  # ============================================================================
  # Each distractor sees previous ones to ensure variety and avoid duplicates

  - name: generate_distractor_1
    intent: "Generate first distractor - focus on wrong technology/service"
    model_vendor: openai
    model_name: gpt-5-mini
    api_key: OPENAI_API_KEY
    schema:
      distractor_1: string
      explanation_why_it_is_incorrect_1: string
      thinking_process_1: string
    observe: [summary, question, answer_explanation, answer, excerpt, options_answer, question_type, target_word_counts, correct_answer_words, answer_text, grouped_facts,similarity_group_id, quiz_type, summary_title, summary_content, key_concepts, learning_objectives, technical_details, code_snippets, question_explanation, key_concept_analogy, memorable_takeaway, answer_reasoning, questionable, url]  # Enhanced with learning objectives
    drops: [id, url, page_content, bloom_details, fact, quote, technical_level, key_concepts, questionable, fact_explanation]   
    prompt: $qanalabs_quiz_gen.Generate_Distractor_1
    prompt_debug: true

  - name: generate_distractor_2
    intent: "Generate second distractor - focus on wrong approach/concept - MUST differ from distractor_1"
    model_vendor: openai
    model_name: gpt-5-mini
    api_key: OPENAI_API_KEY
    schema:
      distractor_2: string
      explanation_why_it_is_incorrect_2: string
      thinking_process_2: string
    observe: [summary, question, answer_explanation, answer, excerpt, options_answer, question_type, target_word_counts, correct_answer_words, answer_text, grouped_facts,similarity_group_id, quiz_type, summary_title, summary_content, key_concepts, learning_objectives, technical_details, code_snippets, question_explanation, key_concept_analogy, memorable_takeaway, answer_reasoning, questionabl, distractor_1, explanation_why_it_is_incorrect_1, thinking_process_1, url]  # Enhanced with learning objectives
    drops: [id, url, page_content, bloom_details, fact, quote, technical_level, key_concepts, questionable, fact_explanation]   
    prompt: $qanalabs_quiz_gen.Generate_Distractor_2
    prompt_debug: true

  - name: generate_distractor_3
    intent: "Generate third distractor - focus on edge case/misconception - MUST differ from both previous"
    model_vendor: openai
    model_name: gpt-5-mini
    api_key: OPENAI_API_KEY
    schema:
      distractor_3: string
      explanation_why_it_is_incorrect_3: string
      thinking_process_3: string
    observe: [summary, question, answer_explanation, answer, excerpt, options_answer, question_type, target_word_counts, correct_answer_words, answer_text, grouped_facts,similarity_group_id, quiz_type, summary_title, summary_content, key_concepts, learning_objectives, technical_details, code_snippets, question_explanation, key_concept_analogy, memorable_takeaway, answer_reasoning, questionabl, distractor_1, explanation_why_it_is_incorrect_1, thinking_process_1, distractor_2, explanation_why_it_is_incorrect_2, thinking_process_2, url]  # Enhanced with learning objectives
    drops: [id, url, page_content, bloom_details, fact, quote, technical_level, key_concepts, questionable, fact_explanation]   
    prompt: $qanalabs_quiz_gen.Generate_Distractor_3
    prompt_debug: true

  - name: reconstruct_options
    kind: tool
    impl: apply_edited_distractors
    intent: "Reconstruct final answer options from correct answer and distractors"
    observe: [target_word_counts,summary_title, summary_content, key_concepts, learning_objectives, technical_details, code_snippets,question_explanation,key_concept_analogy,memorable_takeaway,answer_reasoning, url]
    granularity: Record
    #guard: 'questionable != "Low Value"'



  # ============================================================================
  # PHASE 5: FINAL PROCESSING
  # ============================================================================

  - name: OptionsCombiner
    kind: tool
    impl: merge_correct_answer_with_distractors
    intent: "Create the quiz structure"
    granularity: Record

  - name: format_quiz_text
    kind: tool
    impl: format_quiz_object
    intent: "Format the quiz"
    granularity: Record




################################################################################
# WORKFLOW EXECUTION PLAN
################################################################################
# This defines the order of action execution and their dependencies.
# Actions flow from top to bottom, with <- indicating dependencies.
################################################################################

plan:
  # ============================================================================
  # PHASE 1: FACT EXTRACTION & VALIDATION
  # ============================================================================
  # Extract atomic facts from documentation and validate their questionability

  - fact_extractor                          # Extract candidate facts from content
  - flatten_the_facts <- fact_extractor    # Flatten nested fact structures
  - cluster_list <- flatten_the_facts
  - group_by_similarity <- cluster_list
  - Cluster_Validation_Agent <- group_by_similarity
  - flatten_clusters <- Cluster_Validation_Agent
  - classify_feynman <- flatten_clusters

  # ============================================================================
  # PHASE 2: SUMMARY GENERATION & CODE CLEANUP
  # ============================================================================
  # Generate summaries and clean up code snippets before question generation

  - generate_summary <- classify_feynman           # Create quiz-type specific summaries
  - score_summary_quality <- generate_summary  # Score based on exam syllabus (0-100)
  - review_borderline_summaries <- score_summary_quality  # LLM review for scores 40-60
  - filter_low_quality_summaries <- review_borderline_summaries  # Keep only high-quality (score >=60 or LLM-approved)
  - review_code_snippets <- filter_low_quality_summaries     # Clean code snippets
  - fix_code_snippets <- review_code_snippets      # Fix formatting issues

  # ============================================================================
  # PHASE 3: QUESTION GENERATION & VALIDATION
  # ============================================================================
  # Generate quiz questions and validate their quality

  - generate_scenarios <- fix_code_snippets        # Create quiz scenarios
  - fix_options_format <- generate_scenarios       # Format answer options
  - flatten_questions <- fix_options_format        # Flatten question structures
  # ============================================================================
  # PHASE 4: EXPLANATION & DISTRACTOR GENERATION
  # ============================================================================
  # Generate explanations and wrong answer options

  # - generate_feynman_explanation <- flatten_questions  # Create learning explanations
  # - suggest_distractor_counts <- generate_feynman_explanation     # Calculate word counts
  # - add_answer_text <- suggest_distractor_counts                  # Structure answer text
  # - generate_distractor_1 <- add_answer_text                      # First wrong answer
  # - generate_distractor_2 <- generate_distractor_1                # Second wrong answer
  # - generate_distractor_3 <- generate_distractor_2                # Third wrong answer
  # - reconstruct_options <- generate_distractor_3                  # Combine all options
  # - review_quiz_ui <- reconstruct_options                         # Filter UI-based questions

  # ============================================================================
  # PHASE 5: FINAL PROCESSING
  # ============================================================================
  # Final quiz assembly and formatting

  # - OptionsCombiner <- reconstruct_options              # Merge answers with distractors
  # - format_quiz_text <- OptionsCombiner            # Final formatting
