# ============================================================================
# QUALITY GUIDELINES
# ============================================================================
# Things our explanation cannot include:
# 1. Referencing fact_explanation directly
# 2. Making answer_explanation too long (e.g., "it would work in another situation")

# ============================================================================
# KNOWN ISSUES TO ADDRESS
# ============================================================================
# 1. Some questions have scenario in imaginario field, not in actual question field
#    → Leads to incomplete questions
# 2. Option length not aligning with count and recommended word counts
#    → Need better word count validation
# 3. Cannot mention "Option A" etc in explanations
#    → Options are randomized, letter references become incorrect
# 4. Loops like OptionsCombiner have some issues
#    → Needs investigation