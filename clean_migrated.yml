name: qanalabs-quiz-gen
description: 'Migrated workflow: qanalabs-quiz-gen'
version: 2.0.0
defaults:
  vendor: openai
  model: gpt-5-mini
  json_mode: true
  granularity: record
  run_mode: online
actions:
- name: extract_facts
  intent: Identify candidate facts from source content
  kind: llm
  model: gpt-4.1-mini
  reads:
  - platform_name
  - page_content
  - exam_name
  - url
  - id
  - bloom_details
  writes:
  - candidate_facts_list
  drops:
  - id
  - url
  - topic
  observe:
  - platform_name
  - page_content
  - exam_name
  - url
  - id
  - bloom_details
  granularity: record
  prompt: $qanalabs-quiz-gen.Fact_extraction
- name: cluster_list
  intent: Custom transformation tool
  kind: tool
  impl: qanalabs-quiz-gen.final_clustering.cluster_list
  reads:
  - id
  - url
  - topic
  - summary
  - page_content
  - bloom_details
  - platform_name
  - exam_name
  writes:
  - clusters
  drops: []
  observe: []
  granularity: record
- name: combine_by_cluster_and_id
  intent: Custom transformation tool
  kind: tool
  impl: qanalabs-quiz-gen.combine_records_to_items.combine_records_to_items
  reads: []
  writes:
  - clusters
  drops: []
  observe: []
  granularity: file
- name: validate_clusters
  intent: Execute Cluster_Validation_Agent processing
  kind: llm
  reads:
  - platform_name
  - page_content
  - exam_name
  - url
  - id
  - bloom_details
  - flagged_items
  writes:
  - cluster_validation
  - clusters
  drops: []
  observe:
  - platform_name
  - page_content
  - exam_name
  - url
  - id
  - bloom_details
  - flagged_items
  granularity: record
  prompt: $qanalabs-quiz-gen.Cluster_Validation_Agent
- name: create_new_clusters
  intent: Custom transformation tool
  kind: tool
  impl: qanalabs-quiz-gen.combine_records_to_items.create_new_clusters
  reads: []
  writes:
  - clusters
  drops: []
  observe: []
  granularity: record
- name: explain_facts
  intent: Generate explanations for extracted facts
  kind: llm
  reads:
  - questionable
  - platform_name
  - page_content
  - fact
  - exam_name
  - url
  - id
  - technical_level
  - candidate_facts_list
  - bloom_details
  - flagged_items
  - why_questionable
  - quote
  writes:
  - fact_explanation
  - candidate_facts_list
  drops: []
  observe:
  - questionable
  - platform_name
  - page_content
  - fact
  - exam_name
  - url
  - id
  - technical_level
  - candidate_facts_list
  - bloom_details
  - flagged_items
  - why_questionable
  - quote
  granularity: record
  prompt: $qanalabs-quiz-gen.Fact_Explanation_Agent_new
- name: classify_feynman
  intent: Classify quiz type using Feynman technique
  kind: llm
  reads:
  - correct_answer_words
  - questionable
  - question
  - fact
  - quote
  - url
  - needs_rewrite
  - target_word_counts
  - platform_name
  - exam_name
  - options
  - summary
  - rewrite_instruction
  - answer
  - question_type
  - excerpt
  - id
  - flagged_items
  - answer_explanation
  - technical_level
  - fact_explanation
  - options_answer
  writes:
  - rationale
  - quiz_type
  drops:
  - page_content
  - url
  - id
  - bloom_details
  - flagged_items
  observe:
  - correct_answer_words
  - questionable
  - question
  - fact
  - quote
  - url
  - needs_rewrite
  - target_word_counts
  - platform_name
  - exam_name
  - options
  - summary
  - rewrite_instruction
  - answer
  - question_type
  - excerpt
  - id
  - flagged_items
  - answer_explanation
  - technical_level
  - fact_explanation
  - options_answer
  granularity: record
  guard: questionable != "Low Value"
  few_shot: 6
  prompt: $feynman.classifer_feynman
- name: scenario_generator
  intent: Execute ScenarioGenerator processing
  kind: llm
  model: gpt-5
  reads:
  - questionable
  - platform_name
  - fact
  - exam_name
  - url
  - id
  - technical_level
  - candidate_facts_list
  - fact_explanation
  - flagged_items
  - why_questionable
  - quote
  writes:
  - scenario
  - question_type
  - question
  - scenariogenerator
  - options_answer
  drops:
  - page_content
  - url
  - id
  - bloom_details
  - flagged_items
  observe:
  - questionable
  - platform_name
  - fact
  - exam_name
  - url
  - id
  - technical_level
  - candidate_facts_list
  - fact_explanation
  - flagged_items
  - why_questionable
  - quote
  granularity: record
  prompt: $feynman.application_prompt
plan:
- extract_facts
- cluster_list <- fact_extractor
- combine_by_cluster_and_id <- cluster_list
- validate_clusters <- combine_by_cluster_and_id
- create_new_clusters <- Cluster_Validation_Agent
- explain_facts <- create_new_clusters
- classify_feynman <- fact_explanations
- scenario_generator <- classifer_feynman
