version: '3'

vars:
  PACKAGE: agent_actions
  DIST_DIR: dist
  BUILD_DIR: build

tasks:
  # Development tasks
  dev:
    desc: Install package in development mode with all dev dependencies
    cmds:
      - uv sync --dev

  dev:install:
    desc: Install editable package to dev_env with dev dependencies
    cmds:
      - /Users/muizz/Documents/codeshop/virtual_env/dev_env/bin/pip install -e ".[dev]"
      - echo "Package installed in editable mode to dev_env"

  # Production tasks
  prod:
    desc: Install production dependencies only
    cmds:
      - uv sync --no-dev --active

  prod:install:
    desc: Install package to prod_env (non-editable, production mode)
    cmds:
      - echo "Uninstalling any existing editable install from prod_env..."
      - /Users/muizz/Documents/codeshop/virtual_env/prod_env/bin/pip uninstall -y agent-actions || echo "No existing install found"
      - echo "Installing package in non-editable mode to prod_env..."
      - /Users/muizz/Documents/codeshop/virtual_env/prod_env/bin/pip install .
      - echo "Package installed to prod_env (non-editable)"
      - /Users/muizz/Documents/codeshop/virtual_env/prod_env/bin/pip show agent-actions

  # Build tasks
  build:
    desc: Build the package distribution
    deps: [clean]
    cmds:
      - uv build

  build:legacy:
    desc: Build and install using setup.py (legacy method)
    cmds:
      - python3 setup.py sdist bdist_wheel
      - pip3 install dist/agent_actions-0.1.0-py3-none-any.whl

  # Clean tasks
  clean:
    desc: Remove build artifacts and cache files
    cmds:
      - rm -rf {{.DIST_DIR}} {{.BUILD_DIR}} *.egg-info
      - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      - find . -type f -name "*.pyc" -delete

  uninstall:
    desc: Uninstall the package
    cmds:
      - pip uninstall -y {{.PACKAGE}} || echo "Package {{.PACKAGE}} is not installed"

  # Restart workflow
  restart:
    desc: Complete restart - uninstall, clean, and rebuild
    cmds:
      - task: uninstall
      - task: clean
      - task: build

  # Testing tasks
  test:
    desc: Run tests with pytest
    cmds:
      - uv run pytest

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - uv run pytest --cov={{.PACKAGE}} --cov-report=term-missing

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - uv run pytest -v --tb=short

  test:fast:
    desc: Run tests in parallel for faster execution
    cmds:
      - uv run pytest -n auto

  test:failed:
    desc: Run only previously failed tests
    cmds:
      - uv run pytest --lf

  test:stream:
    desc: Run tests for specific work stream
    vars:
      STREAM: '{{default "" .STREAM}}'
    cmds:
      - |
        if [ -z "{{.STREAM}}" ]; then
          echo "Usage: task test:stream STREAM=<stream_name>"
          echo "Available streams: cli, core, tasks, agents, utils"
        else
          uv run pytest tests/{{.STREAM}}/
        fi

  test:unit:
    desc: Run only unit tests (exclude integration)
    cmds:
      - uv run pytest -m "not integration"

  test:integration:
    desc: Run only integration tests
    cmds:
      - uv run pytest -m integration

  test:watch:
    desc: Run tests in watch mode (auto-rerun on file changes)
    cmds:
      - uv run pytest-watch

  test:report:
    desc: Run tests with HTML coverage report
    cmds:
      - uv run pytest --cov={{.PACKAGE}} --cov-report=html --cov-report=term
      - echo "Coverage report generated at htmlcov/index.html"

  test:all:
    desc: Run complete test suite with full reporting
    cmds:
      - uv run pytest -v --cov={{.PACKAGE}} --cov-report=term-missing --cov-report=html --tb=short

  test:parallel:
    desc: Run test streams in parallel (simulates multi-engineer workflow)
    cmds:
      - echo "Running test streams in parallel..."
      - |
        uv run pytest tests/test_cli.py tests/core/ & \
        uv run pytest tests/tasks/ & \
        uv run pytest tests/agents/ & \
        uv run pytest tests/utils/ & \
        wait
      - echo "All parallel test streams completed"

  test:quick:
    desc: Quick smoke test of critical paths
    cmds:
      - uv run pytest tests/test_cli.py::TestCLIVersionHandling -v
      - uv run pytest tests/tasks/test_init.py::TestInitCommand::test_init_creates_expected_structure -v
      - uv run pytest tests/agents/test_base.py::TestAgentBuilder::test_create_dynamic_agent_builds_correct_components -v

  # Linting and type checking
  lint:
    desc: Run linting with pylint
    cmds:
      - uv run pylint {{.PACKAGE}}

  pylint:
    desc: Run pylint on entire codebase for code review
    cmds:
      - uv run pylint {{.PACKAGE}} --output-format=colorized

  pylint:verbose:
    desc: Run pylint with detailed output and scores
    cmds:
      - uv run pylint {{.PACKAGE}} --output-format=colorized --reports=y --score=y

  pylint:report:
    desc: Generate pylint HTML report
    cmds:
      - uv run pylint {{.PACKAGE}} --output-format=html > pylint-report.html
      - echo "Pylint report generated at pylint-report.html"

  pylint:file:
    desc: Run pylint on specific file or directory
    vars:
      FILE: '{{default "" .FILE}}'
    cmds:
      - |
        if [ -z "{{.FILE}}" ]; then
          echo "Usage: task pylint:file FILE=path/to/file.py"
        else
          uv run pylint {{.FILE}} --output-format=colorized
        fi

  mypy:
    desc: Run type checking with mypy
    cmds:
      - uv run mypy {{.PACKAGE}}

  lint:ruff:
    desc: Run ruff linter (logging rules)
    cmds:
      - uv run ruff check {{.PACKAGE}}

  lint:ruff:fix:
    desc: Run ruff with auto-fix
    cmds:
      - uv run ruff check --fix {{.PACKAGE}}

  lint:logging:
    desc: Check logging format patterns with AST checker
    cmds:
      - uv run python scripts/check_logging_format.py {{.PACKAGE}}

  check:
    desc: Run all checks (lint, ruff, logging, and type check)
    deps: [lint, lint:ruff, lint:logging, mypy]

  # Utility tasks
  deps:tree:
    desc: Show dependency tree
    cmds:
      - uv pip tree

  deps:outdated:
    desc: Show outdated dependencies
    cmds:
      - uv pip list --outdated

  # Agent-specific tasks
  agent:run:
    desc: Run the agent CLI
    cmds:
      - uv run agent {{.CLI_ARGS}}

  agent:help:
    desc: Show agent CLI help
    cmds:
      - uv run agent --help

  # Pre-commit hooks
  hooks:install:
    desc: Install pre-commit hooks
    cmds:
      - uv run pre-commit install

  hooks:run:
    desc: Run all pre-commit hooks on all files
    cmds:
      - uv run pre-commit run --all-files

  # Default task
  default:
    desc: Show available tasks
    cmds:
      - task --list
