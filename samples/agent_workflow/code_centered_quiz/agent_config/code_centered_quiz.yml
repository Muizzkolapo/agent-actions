name: code_centered_quiz
description: "Code-centered quiz generation workflow for technical documentation with fact extraction, explanations, and distractor generation"
version: "2.0.0"

# Global defaults applied to all actions unless overridden
defaults:
  model_vendor: openai
  model_name: gpt-5-mini
  json_mode: true
  granularity: Record
  run_mode: online
  api_key: OPENAI_API_KEY
  is_operational: true
  prompt_debug: false
  few_shot: 0
  observe: [applicable_code_block, id, url, platform_name, exam_name, page_content, bloom_details, fact, quote, fact_explanation, technical_level, questionable]
  drops: [rewrite_instruction, needs_rewrite]


actions:
  - name: fact_extractor
    intent: "Extract candidate facts from educational content"
    schema: candidate_facts_list
    drops: [id, url, topic]  # overrides defaults
    prompt: $qanalabs-quiz-gen.Fact_extraction

  - name: cluster_list
    kind: tool
    impl: cluster_list
    intent: "Group extracted facts into logical clusters"
    observe: [topic, summary]  # only unique additions
    guard: 'candidate_facts_list != "[]"'

  - name: combine_by_cluster_and_id
    kind: tool
    impl: combine_records_to_items
    granularity: file
    intent: "Combine records by cluster and ID for processing"

  - name: Cluster_Validation_Agent
    intent: "Validate cluster quality and flag problematic items"
    schema: cluster_validation
    observe: [flagged_items]  # only unique additions
    prompt: $qanalabs-quiz-gen.Cluster_Validation_Agent

  - name: create_new_clusters
    kind: tool
    impl: create_new_clusters
    granularity: Record
    intent: "Create new clusters when validation indicates need for splitting"
    guard:
      condition: 'should_keep_cluster == false'
      on_false: "skip"

  - name: fact_explanations
    intent: "Generate detailed explanations for extracted facts"
    schema: {fact_explanation: string, applicable_code_block: string}
    observe: [candidate_facts_list, why_questionable, flagged_items]  # only unique additions
    prompt: |
      You are tasked with creating a comprehensive summary explanation for a fact from a technical documentation content.
      Content Fact:
      Using the fact field write a explanation for the fact_explanation field within this context. It must explain the fact in detail solely based on The page_content is the reference material, take the fact, identify the context from the page_context and write a coincise explanation based on this fact alone for a student based on it, use page_content to basically expand the fact.
      NOTE: in case of multiple fact, your explanation must be a cannonical reperesentation of all the facts, synthetize an explanation that covers them.

  - name: ScenarioGenerator
    intent: "Generate quiz scenarios based on technical facts"
    schema: ScenarioGenerator_schema
    drops: [id, url, page_content, flagged_items]  # overrides defaults
    observe: [candidate_facts_list, why_questionable, flagged_items]  # only unique additions
    prompt: $code_centered_quiz.terraform

  - name: flatten_questions
    kind: tool
    impl: flatten_questions
    intent: "Flatten nested question structures for processing"
    granularity: Record
    guard: 'questionable != "Low Value"'

  - name: answer_explanation
    intent: "Generate solution approach and key concept definitions"
    schema: {solution_approach: string, key_concept_definition: string}
    drops: [id, url, page_content, flagged_items]  # overrides defaults
    observe: [question, options, answer, answer_explanation, question_type, questions]  # only unique additions
    prompt: $code_centered_quiz.answer_explanation

  - name: distractor_count_suggestions
    kind: tool
    impl: suggest_word_counts
    intent: "Suggest word counts for answer distractors"
    observe: [summary, question, options, answer_explanation, answer, distractor_1, distractor_2, explanation_why_it_is_incorrect_1, explanation_why_it_is_incorrect_2, excerpt, options_answer, question_type, flagged_items, solution_approach, key_concept_definition]  # only unique additions
    guard: 'questionable != "Low Value"'

  - name: generate_distractors
    intent: "Generate answer distractors with explanations for multiple choice questions"
    loop:
      param: stage
      range: [1, 3]
    schema:
      distractor_${stage}: string
      explanation_why_it_is_incorrect_${stage}: string
    observe: [summary, question, answer_explanation, answer, excerpt, options_answer, question_type, target_word_counts, correct_answer_words, solution_approach, key_concept_definition]  # only unique additions
    drops: [options]
    few_shot: 6
    prompt: $qanalabs-quiz-gen.AnswerLengthDistractorGenerator_prompt
    guard: 'questionable != "Low Value"'
    prompt_debug: true

  - name: reconstruct_options_from_answer
    kind: tool
    loop_consumption:
      source: "generate_distractors"
      pattern: "merge"
    impl: apply_edited_distractors
    intent: "Reconstruct final answer options from correct answer and distractors"
    granularity: Record
    guard: 'questionable != "Low Value"'

  - name: QuizTaker
    intent: "This takes the quiz to show us if we have issues"
    schema: {my_answer_letter_key: string, my_answer_text: string, my_reasoning: string, my_confidence_level: string}
    is_operational: false
    prompt: "You are a quiz taker. Your task is to answer the question based on the provided information by grounding your choice based on the fact_explanation. Please provide your answer, reasoning, and confidence level. RULE: your answer is solely based on the fact_explanation and no external knowledge. You must not use any external knowledge to answer the question. If you are not sure about the answer, please indicate that in your reasoning and confidence level(High, Medium, Low). If you are confident, provide your reasoning based on the fact_explanation provided. important: my_answer_letter_key(can only be A-Z)"
    observe: [distractor_3, explanation_why_it_is_incorrect_3, explanation_why_it_is_incorrect_2, distractor_2, distractor_1, explanation_why_it_is_incorrect_1, answer_explanation, question_type, options, question, answer, flagged_items]
    drops: [id, url, platform_name, exam_name, bloom_details, candidate_facts_list, fact, quote, technical_level, questionable, why_questionable, distractor_3, explanation_why_it_is_incorrect_3, distractor_2, explanation_why_it_is_incorrect_2, distractor_1, explanation_why_it_is_incorrect_1, answer_explanation, answer, flagged_items]
    guard: 'questionable != "Low Value"'

  - name: quiztaker_maker
    kind: tool
    impl: mark_and_attach
    intent: "Mark the quiz"
    is_operational: false
    granularity: Record
    guard: 'questionable != "Low Value"'

  - name: OptionsCombiner
    kind: tool
    impl: merge_correct_answer_with_distractors
    intent: "Create the quiz structure"
    is_operational: false
    observe: [id, url, topic, key_ideas, explanation, options, options_answer, answer, answer_explanation, fact, quote, technical_level, questionable, options_answer, flagged_items]  # only unique additions
    drops: [decision, reasoning, total_tokens, source, title, page_content]  # overrides defaults
    granularity: Record
    guard: 'questionable != "Low Value" and marked_result_is_correct == "Correct"'

  - name: format_quiz_text
    kind: tool
    impl: format_quiz_object
    intent: "Format the quiz"
    is_operational: false
    granularity: Record
    guard: 'questionable != "Low Value"'


plan:
  - fact_extractor
  - cluster_list <- fact_extractor
  - combine_by_cluster_and_id <- cluster_list
  - Cluster_Validation_Agent <- combine_by_cluster_and_id
  - create_new_clusters <- Cluster_Validation_Agent
  - fact_explanations <- create_new_clusters
  - ScenarioGenerator <- fact_explanations
  - flatten_questions <- ScenarioGenerator
  - answer_explanation <- flatten_questions
  - distractor_count_suggestions <- answer_explanation
  - generate_distractors <- distractor_count_suggestions
  - reconstruct_options_from_answer <- generate_distractors
  - QuizTaker <- reconstruct_options_from_answer
  - quiztaker_maker <- QuizTaker
  - OptionsCombiner <- quiztaker_maker
  - format_quiz_text <- OptionsCombiner
