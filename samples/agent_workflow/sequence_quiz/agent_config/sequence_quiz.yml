name: sequence_quiz
description: "Generate sequential ordering quizzes where users arrange items (commands, steps, code blocks) in the correct order"
version: "1.0.0"

# Global defaults applied to all actions unless overridden
defaults:
  model_vendor: openai
  model_name: gpt-4o-mini
  json_mode: true
  granularity: Record
  run_mode: online
  api_key: OPENAI_API_KEY
  prompt_debug: false
  few_shot: 0
  observe: [id, url, page_content, bloom_details, topic, summary]
  drops: [id, url]


actions:
  - name: code_extractor
    intent: "Extract code blocks or sequential content from technical documentation"
    schema: candidate_code_list
    prompt: $drop_down_quiz.Code_extraction
    drops: [id, url, topic]

  - name: flatten_code
    kind: tool
    impl: flatten_code
    intent: "Flatten extracted code blocks for processing"
    observe: [topic, summary]

  - name: sequence_scenario_generator
    intent: "Generate scenario and context for sequential ordering task"
    schema: {sample_usage_scenario: string, code_for_scenario: string, scenario_complexity: string, key_considerations: string, sequence_type: string}
    observe: [code_for_scenario]
    prompt: |
      You are generating a scenario for a sequential ordering quiz where users must arrange items in the correct order.

      Based on the provided code/content, create a realistic scenario that requires understanding the proper sequence of operations.

      Context:
      - Code/Content: {code_for_scenario}
      - Topic: {topic}

      Generate:
      1. sample_usage_scenario: A realistic scenario describing when/why this sequence matters
      2. code_for_scenario: The complete correct sequence (preserve from input)
      3. scenario_complexity: Level of difficulty (Beginner/Intermediate/Advanced)
      4. key_considerations: Important points about the correct order and why it matters
      5. sequence_type: Type of sequence (workflow_steps/commands/code_execution/data_pipeline/deployment_steps)

      The scenario should make it clear WHY the order matters (e.g., dependencies, logical flow, best practices).

  - name: extract_sequence_items
    intent: "Break down the code/content into individual sequential items"
    schema: {sequence_items: array[{item_number: number, item_content: string, item_description: string, why_this_position: string}]}
    observe: [sample_usage_scenario, code_for_scenario, scenario_complexity, key_considerations, sequence_type]
    prompt: |
      You are extracting individual items from a sequence that users will need to arrange in the correct order.

      Based on the code/content provided, break it down into individual sequential items (typically 4-6 items).

      Context:
      - Code/Content: {code_for_scenario}
      - Scenario: {sample_usage_scenario}
      - Sequence Type: {sequence_type}

      For each item, provide:
      1. item_number: Position in correct sequence (1, 2, 3, 4...)
      2. item_content: The actual command, step, or code block
      3. item_description: Brief description of what this item does
      4. why_this_position: Why this item must be in this specific position (dependencies, logical flow)

      Examples:
      - For dbt commands: "dbt deps" must come before "dbt run" because dependencies must be installed first
      - For deployment: "Run tests" must come before "Deploy to production" to ensure quality
      - For data pipeline: "Extract data" must come before "Transform data" due to data dependencies

      Return 4-6 sequential items that represent the complete workflow.

  - name: generate_distractors_sequence
    intent: "Generate plausible but incorrect orderings and explain why they're wrong"
    schema: {common_mistakes: array[{mistake_description: string, why_incorrect: string, consequence: string}]}
    observe: [sequence_items, sample_usage_scenario, code_for_scenario, key_considerations, sequence_type]
    prompt: |
      You are identifying common mistakes people make when ordering these sequential items.

      Based on the correct sequence, identify 2-3 common mistakes or misconceptions about the ordering.

      Correct Sequence:
      {sequence_items}

      For each common mistake, provide:
      1. mistake_description: Description of the incorrect ordering (e.g., "Running 'dbt run' before 'dbt deps'")
      2. why_incorrect: Technical reason why this order is wrong
      3. consequence: What happens if you use this incorrect order (error, failure, inefficiency)

      Examples:
      - Mistake: "Running dbt test before dbt run"
        Why Incorrect: "Tests validate models that haven't been built yet"
        Consequence: "Tests will fail because the models don't exist in the target schema"

      Focus on mistakes that seem plausible to someone learning this topic.

  - name: create_explanation
    intent: "Generate comprehensive explanation of the correct sequence"
    schema: {correct_sequence_explanation: string, key_dependencies: array[string], best_practices: array[string]}
    observe: [sequence_items, sample_usage_scenario, key_considerations, common_mistakes, sequence_type]
    prompt: |
      You are creating an educational explanation for why items must be in a specific order.

      Based on the sequence and common mistakes, explain:

      1. correct_sequence_explanation:
         - Step-by-step explanation of the correct order
         - Why each item depends on the previous one
         - Overall flow and purpose

      2. key_dependencies:
         - List critical dependencies between steps
         - Format: ["Step A must precede Step B because...", "Step C requires Step B to complete first because..."]

      3. best_practices:
         - Industry best practices related to this sequence
         - Tips for remembering the correct order
         - Common patterns to recognize

      Context:
      - Sequence Type: {sequence_type}
      - Scenario: {sample_usage_scenario}
      - Items: {sequence_items}
      - Common Mistakes: {common_mistakes}

      Make the explanation clear and educational, helping users understand the "why" not just the "what".


plan:
  - code_extractor
  - flatten_code <- code_extractor
  - sequence_scenario_generator <- flatten_code
  - extract_sequence_items <- sequence_scenario_generator
  - generate_distractors_sequence <- extract_sequence_items
  - create_explanation <- generate_distractors_sequence
