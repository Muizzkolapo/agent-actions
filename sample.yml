qanalabs-quiz-gen:
  - agent_type: fact_extractor
    dependencies: []
    api_key: OPENAI_API_KEY
    model_vendor: "openai"
    model_name: "gpt-4.1-mini"
    schema_name: candidate_facts_list
    use_few_shot_samples: 0
    is_operational: True
    json_mode: True
    remove_collection: ["id","url","topic"]
    side_collection: ["id","url","page_content","bloom_details","platform_name","exam_name"]
    run_mode: "online"
    granularity: Record
    prompt_debug: False
    prompt: $qanalabs-quiz-gen.Fact_extraction 

  - {{ tooling_workflow(
        agent_type="cluster_list",
        model_name="qanalabs-quiz-gen.final_clustering.cluster_list",
        dependencies=["fact_extractor"],
        side_collection=["id","url","topic","summary","page_content","bloom_details","platform_name","exam_name"],
        is_operational=True,
        granularity="Record",
        description="Custom transformation tool",
        where_clause={"clause": "candidate_facts_list != \"[]\"", "scope": "item"},
    ) }}  


  - {{ file_tooling_workflow(
        agent_type="combine_by_cluster_and_id",
        model_name="qanalabs-quiz-gen.combine_records_to_items.combine_records_to_items",
        dependencies=["cluster_list"],
        is_operational=True,
        granularity="file",
        description="Custom transformation tool"
    ) }}  


  - agent_type: Cluster_Validation_Agent
    dependencies: ['combine_by_cluster_and_id']
    api_key: OPENAI_API_KEY
    model_vendor: "openai"
    model_name: "gpt-5-mini"
    schema_name: cluster_validation
    use_few_shot_samples: 0
    is_operational: True
    side_collection: ["flagged_items","id","url","page_content","bloom_details","platform_name","exam_name"]
    json_mode: True
    granularity: Record
    run_mode: "online"
    remove_collection: []
    prompt: $qanalabs-quiz-gen.Cluster_Validation_Agent


  - {{ conditional_tooling_workflow(
        conditional_clause="qanalabs-quiz-gen.combine_records_to_items.needs_split",
        agent_type="create_new_clusters",
        model_name="qanalabs-quiz-gen.combine_records_to_items.create_new_clusters",
        dependencies=["Cluster_Validation_Agent"],
        is_operational=True,
        granularity="record",
        description="Custom transformation tool"
    ) }}

  - agent_type: fact_explanations
    dependencies: ["create_new_clusters"]
    api_key: OPENAI_API_KEY
    model_vendor: "openai"
    model_name: "gpt-5-mini"
    run_mode: "online"
    use_few_shot_samples: 0
    is_operational: True
    schema: {"fact_explanation": "string"}
    side_collection: ["id","url","page_content","bloom_details","candidate_facts_list","fact","quote","technical_level","questionable","why_questionable","platform_name","exam_name","flagged_items"]
    json_mode: True
    granularity: Record
    prompt_debug: False
    prompt: $qanalabs-quiz-gen.Fact_Explanation_Agent_new

  - agent_type: classifer_feynman
    dependencies: ["fact_explanations"]
    api_key: OPENAI_API_KEY
    model_vendor: "openai"
    model_name: "gpt-5-mini"
    schema: {"quiz_type": "string","rationale": "string"}
    use_few_shot_samples: 6
    is_operational: True
    json_mode: True
    remove_collection: ["id","url","page_content","flagged_items","bloom_details"]
    side_collection: ["id","url","platform_name","exam_name","summary","question","options","answer_explanation","fact","quote","fact_explanation","technical_level","questionable","answer","rewrite_instruction","needs_rewrite","excerpt","options_answer","question_type","flagged_items","target_word_counts","correct_answer_words"]
    run_mode: "online"
    granularity: Record
    prompt_debug: True
    prompt: $feynman.classifer_feynman
    where_clause: {"clause": "questionable != \"Low Value\"", "scope": "item"}





  - agent_type: ScenarioGenerator
    dependencies: ["classifer_feynman"]
    api_key: OPENAI_API_KEY
    model_vendor: "openai"
    model_name: "gpt-5"
    schema_name: ScenarioGenerator_schema
    use_few_shot_samples: 0
    is_operational: True
    run_mode: "online"
    json_mode: True
    side_collection: ["id","url","candidate_facts_list","fact","quote","technical_level","questionable","why_questionable","fact_explanation","platform_name","exam_name","flagged_items"]
    remove_collection: ["id","url","page_content","flagged_items","bloom_details"]
    granularity: Record
    prompt_debug: False
    prompt: $feynman.application_prompt