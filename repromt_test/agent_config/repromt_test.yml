name: repromt_test
description: "Educational quiz generation workflow with fact extraction and validation"
version: "2.0.0"

defaults:
  vendor: openai
  model: gpt-4o-mini
  json_mode: true
  granularity: Record
  run_mode: online

actions:
  - name: explain_facts
    intent: "Generate explanations for extracted facts"
    model: gpt-4o
    schema: {poem: string}
    prompt: "generate a short with only 10 words about the input data provided"
    interceptors:
      - type: validation
        validator_function: "repromt_test.validator.poem_word_count_validator"
        validator_args:
          expected: 5
        on_failure: retry
      - type: reprompt
        strategy: "llm"
        max_attempts: 3
        llm_config:
          model_vendor: "openai"
          model_name: "gpt-4"

plan:
  - explain_facts