[project]
name = "agent-actions"
version = "3.0.0"
description = "Declarative YAML-based framework for orchestrating agentic workflows"
authors = [
    {name = "Muizz Kolapo"},
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["llm", "ai", "workflow", "yaml", "openai", "anthropic", "batch-processing", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiofiles>=24.0.0,<26",
    "openai>=1.26.0,<4",
    "tiktoken>=0.9.0,<1",
    "click>=8.1.3,<9",
    "flask>=3.0.3,<4",
    "flask-cors>=4.0.1,<7",
    "werkzeug>=3.0.0,<4",
    "networkx>=3.3,<4",
    "pypdf>=4.0.0,<7",
    "python-docx>=1.1.2,<2",
    "pandas>=2.2.2,<4",
    "openpyxl>=3.1.2,<4",
    "beautifulsoup4>=4.12.3,<5",
    "defusedxml>=0.7.1,<1",
    "google-api-python-client>=2.130.0,<3",
    "google-genai>=1.0.0,<3",
    "anthropic>=0.30.0,<3",
    "pyparsing>=3.1.1,<4",
    "sentence-transformers>=2.2.2,<7",
    "numpy>=1.26.4,<3",
    "json-repair>=0.30.0,<1",
    "jsonschema>=4.23.0,<5",
    "pydantic>=2.8.0,<3",
    "pydantic-settings>=2.4.0,<3",
    "python-dotenv>=1.0.1,<2",
    "ollama>=0.1.0,<1",

    "cohere>=5.0.0,<8",
    "groq>=0.1.0,<2",
    "httpx>=0.27.0,<1",
    "rich>=13.0.0,<16",
    "pyyaml>=6.0.0,<7",
    "jinja2>=3.1.0,<4",
    "portalocker>=2.8.2,<5",
    # LSP dependencies
    "pygls>=2.0.0,<3",
    "lsprotocol>=2024.0.0,<2026",
    "ruamel.yaml>=0.18.0,<1",
]

[project.urls]
Homepage = "https://github.com/Muizzkolapo/agent-actions"
Documentation = "https://docs.runagac.com"
Repository = "https://github.com/Muizzkolapo/agent-actions"
Issues = "https://github.com/Muizzkolapo/agent-actions/issues"

[project.scripts]
agac = "agent_actions.cli.main:main"
agac-lsp = "agent_actions.tooling.lsp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<10",
    "pytest-cov>=4.1.0,<8",
    "mypy>=1.8.0,<3",
    "types-PyYAML>=6.0.12,<7",
    "pandas-stubs>=2.0.3,<4",
    "types-requests>=2.31.0,<3",
    "types-beautifulsoup4>=4.12.0,<5",
    "ipython>=8.0.0,<10",
    "ipdb>=0.13.0,<1",
]
nlp = [
    "spacy>=3.0.0,<4",
]
# One extra a connection type, named as the type is in `connections:`.
bigquery = ["google-cloud-bigquery>=3.11.0,<4"]
databricks = ["databricks-sql-connector>=3.0.0,<5"]
duckdb = ["duckdb>=1.0.0,<3"]
mysql = ["pymysql>=1.1.0,<3"]
postgres = ["psycopg[binary]>=3.1.0,<4"]
redshift = ["redshift-connector>=2.1.0,<3"]
snowflake = ["snowflake-connector-python>=3.6.0,<6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
exclude = [
    "docs.agent-actions/",
    "examples/",
    "tests/",
    ".github/",
    ".claude/",
    "MagicMock/",
    "tasks/",
    # Output a run of a bundled template can leave in the package folder; agent_io/staging/
    # is the template's input.
    "agent_actions/cli/project_templates/**/agent_io/*",
    "!agent_actions/cli/project_templates/**/agent_io/staging/",
    "agent_actions/cli/project_templates/**/*.db",
    "agent_actions/cli/project_templates/**/*.db-*",
    "agent_actions/cli/project_templates/**/.agac/",
    "agent_actions/cli/project_templates/**/artefact/",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_actions"]
exclude = [
    # Output a run of a bundled template can leave in the package folder; agent_io/staging/
    # is the template's input.
    "agent_actions/cli/project_templates/**/agent_io/*",
    "!agent_actions/cli/project_templates/**/agent_io/staging/",
    "agent_actions/cli/project_templates/**/*.db",
    "agent_actions/cli/project_templates/**/*.db-*",
    "agent_actions/cli/project_templates/**/.agac/",
    "agent_actions/cli/project_templates/**/artefact/",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<10",
    "pytest-cov>=4.1.0,<8",
    "mypy>=1.8.0,<3",
    "types-PyYAML>=6.0.12,<7",
    "pandas-stubs>=2.0.3,<4",
    "types-requests>=2.31.0,<3",
    "types-beautifulsoup4>=4.12.0,<5",
    "ipython>=8.0.0,<10",
    "ipdb>=0.13.0,<1",
    "hypothesis>=6.139.2,<7",
    "pytest-asyncio>=1.2.0,<2",
    "pytest-mock>=3.15.1,<4",
    "pytest-benchmark>=5.1.0,<6",
    "pytest-xdist>=3.8.0,<4",
    "ruff>=0.8.0,<1",
    "pre-commit>=3.6.0,<4",
    "vulture>=2.11,<3",
    "bandit>=1.7.0,<2",
    # The drivers of the connection types a test can start a database for.
    "duckdb>=1.0.0,<3",
    "psycopg[binary]>=3.1.0,<4",
    "pymysql>=1.1.0,<3",
]

[tool.mypy]
python_version = "3.11"
exclude = ["^examples/"]
# `mypy tests/` aborted on "Duplicate module named conftest" before checking a single file,
# so the whole test tree was unreachable to the type checker -- not out of scope, but
# unrunnable. 34 of 203 test directories carry an __init__.py and the rest do not, so mypy
# resolved several conftest.py files to the same module name. Chosen over adding the missing
# __init__.py files because it changes no layout: pytest's rootdir and import mode are
# untouched, and collection is identical before and after.
explicit_package_bases = true
mypy_path = "."
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
incremental = true
namespace_packages = true

# Gradual adoption - start with errors only
[[tool.mypy.overrides]]
module = "agent_actions.*"
ignore_errors = false
warn_unused_ignores = false

# External library stubs
[[tool.mypy.overrides]]
module = [
    "pymysql.*",
    "psycopg.*",
    "duckdb.*",
    "snowflake.*",
    "databricks.*",
    "redshift_connector.*",
    "google.cloud.*",
    "tiktoken.*",
    "sentence_transformers.*",
    "google.genai.*",
    "openai.*",
    "anthropic.*",
    "pypdf.*",
    "docx.*",
    "networkx.*",
    "agent_actions.llm.batch.*"
]
ignore_missing_imports = true

# Vendor modules - ignore complex API typing for now
[[tool.mypy.overrides]]
module = "agent_actions.vendors.*"
ignore_errors = true

[tool.ruff]
target-version = "py311"
# PEP 8's limit for a team that agrees on longer lines.
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (PEP 8)
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "B",    # bugbear
    "UP",   # pyupgrade
    "LOG",  # flake8-logging rules
    "G",    # flake8-logging-format rules
    "T20",  # flake8-print (bans bare print())
    "C90",  # mccabe complexity
]
ignore = [
    "G004",  # Allow f-strings in logging (project standard)
    "N818",  # Exception names are public API; renaming them to end in Error would break callers
]

[tool.ruff.lint.pep8-naming]
# ast.NodeVisitor and Jinja visitors dispatch on the node class name.
extend-ignore-names = ["visit_*"]

[tool.ruff.lint.mccabe]
# Functions already above this carry `# noqa: C901`; the gate blocks new ones.
max-complexity = 30

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["LOG", "G", "T201"]
"agent_actions/skills/agac-agent-skills/scripts/*" = ["T201"]
"agent_actions/logging/core/handlers/*" = ["T201"]
".claude/*" = ["T201"]
"examples/*" = ["T201"]

[tool.bandit]
exclude_dirs = ["tests", "agent_actions/vendors/manual_vendor_checks"]
