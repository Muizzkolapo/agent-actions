[project]
name = "agent-actions"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "you@example.com"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.26.0",
    "tiktoken>=0.9.0",
    "flask>=3.0.3",
    "flask-cors>=4.0.1",
    "networkx>=3.3",
    "pypdf2>=3.0.1",
    "python-docx>=1.1.2",
    "pandas>=2.2.2",
    "openpyxl>=3.1.2",
    "beautifulsoup4>=4.12.3",
    "google-api-python-client>=2.130.0",
    "google-generativeai>=0.7.2",
    "google-genai>=1.0.0",
    "anthropic>=0.30.0",
    "sentence-transformers>=2.2.2",
    "numpy>=1.26.4",
    "jsonschema>=4.23.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "ollama>=0.1.0",
    "mistralai>=0.1.0",
    "cohere>=5.0.0",
    "groq>=0.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "portalocker>=2.8.2",
]

[project.scripts]
agac = "agent_actions.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pylint>=2.17.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "pandas-stubs>=2.0.3",
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
    "ipython>=8.0.0",
    "ipdb>=0.13.0",
]
nlp = [
    "spacy>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_actions"]

[tool.hatch.build.targets.wheel.force-include]
"agent_actions/docs/docs_site" = "agent_actions/docs/docs_site"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pylint>=2.17.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "pandas-stubs>=2.0.3",
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
    "ipython>=8.0.0",
    "ipdb>=0.13.0",
    "hypothesis>=6.139.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.1",
    "pytest-benchmark>=5.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
incremental = true
namespace_packages = true

# Gradual adoption - start with errors only
[[tool.mypy.overrides]]
module = "agent_actions.*"
ignore_errors = false
warn_unused_ignores = false

# External library stubs
[[tool.mypy.overrides]]
module = [
    "tiktoken.*",
    "sentence_transformers.*",
    "google.generativeai.*",
    "google.api_core.*",
    "openai.*",
    "anthropic.*",
    "pypdf2.*",
    "docx.*",
    "networkx.*"
]
ignore_missing_imports = true

# Vendor modules - ignore complex API typing for now
[[tool.mypy.overrides]]
module = "agent_actions.vendors.*"
ignore_errors = true
