# Key Design Principles:
# 1. Simple syntax: dispatch_task('function_name') - no arguments
# 2. Function receives full context_data (same as LLM)
# 3. Works with field references: {source.field}, {agent.field}
# 4. Processing order: field_refs → dispatch_task → LLM
# 5. No complex parsing needed - just function name in quotes
# 6. Functions access all data: source + dependencies (flattened)
