# Sample Workflow: dispatch_task() - Simple Design
#
# dispatch_task() has a clean, simple design:
# - Syntax: dispatch_task('function_name')
# - The function receives the same context_data as the LLM
# - No additional arguments - keeps it simple
# - Works with field references: {source.field}, {agent.field}
#
# Use Cases Demonstrated:
# 1. Basic dispatch_task() usage
# 2. Combining with field references
# 3. Multiple dispatch calls
# 4. Accessing full context in functions

settings:
  workflow_name: "dispatch_task_demo"
  description: "Demonstrates dispatch_task() with field references"

source:
  file_path: "sample_documents.jsonl"
  # Expected format:
  # {"content": "Document text here", "title": "Sample", "metadata": {"author": "John", "category": "tech"}}

agents:
  # Agent 1: Extract keywords using dispatch_task
  # The function receives the full context (content, title, metadata)
  extract_keywords:
    model_vendor: "tool"
    prompt: |
      Extract keywords from the document:
      dispatch_task('extract_keywords')
    tools:
      path: "./workflow_tools"
    schema:
      fields:
        - name: keywords
          type: string
          description: "Comma-separated keywords"
    granularity: record

  # Agent 2: Format document using field references AND dispatch_task
  # Field refs are replaced first, then dispatch_task executes
  format_document:
    model_vendor: "tool"
    prompt: |
      Document Title: {source.title}
      Author: {source.metadata.author}

      Formatted content:
      dispatch_task('format_content')
    dependencies:
      - extract_keywords
    tools:
      path: "./workflow_tools"
    schema:
      fields:
        - name: formatted_doc
          type: string
          description: "Formatted document"
    granularity: record

  # Agent 3: Multiple dispatch calls
  # Each function receives the same context_data
  analyze_document:
    model_vendor: "tool"
    prompt: |
      Summary: dispatch_task('generate_summary')

      Key Points: dispatch_task('extract_key_points')

      Category: dispatch_task('categorize')
    dependencies:
      - extract_keywords
      - format_document
    tools:
      path: "./workflow_tools"
    schema:
      fields:
        - name: analysis
          type: string
          description: "Document analysis"
    granularity: record

  # Agent 4: Access dependency data in dispatch function
  # The function sees all context including dependency outputs
  final_report:
    model_vendor: "tool"
    prompt: |
      Generate final report combining all analysis:
      dispatch_task('create_report')
    dependencies:
      - extract_keywords
      - format_document
      - analyze_document
    tools:
      path: "./workflow_tools"
    schema:
      fields:
        - name: report
          type: string
          description: "Final report"
    granularity: record

