name: syntax_validation
fields:
  - id: has_syntax_errors
    type: boolean
    description: "Whether any syntax errors were detected"

  - id: validation_status
    type: string
    description: "Overall validation status - must be either VALID or INVALID"

  - id: error_summary
    type: string
    description: "Brief summary of syntax errors found, or 'No errors detected' if valid"
