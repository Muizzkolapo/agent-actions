name: question_quality_score
fields:
  - id: syllabus_alignment_score
    type: number
    description: "How well the question tests specific learning objectives (0-100). Score >= 85 means keep question."

  - id: objective_tested
    type: string
    description: "Which specific objective(s) from referenced_in this question tests (quote the objective)"

  - id: aligned_skill_area
    type: string
    description: "Primary exam skill area tested (e.g., 'Train and deploy models', 'Optimize language models for AI applications')"

  - id: reasoning
    type: string
    description: "Explanation of how the question does (or doesn't) test the specific objective(s)"
