name: generate_recommendations
description: Schema for similar book recommendations
fields:
  - id: similar_books
    type: array
    description: "List of similar book recommendations"
    items:
      type: object
      properties:
        title:
          type: string
          description: "Book title"
        author:
          type: string
          description: "Book author"
        reason:
          type: string
          description: "Why this book is similar/recommended"
      required:
        - title
        - author
        - reason
  - id: reading_path
    type: string
    description: "Suggested reading path/progression"
additionalProperties: false
