{
    "title": "Quiz",
    "description": "A quiz containing a list of questions.",
    "type": "object",
    "properties": {
        "questions": {
            "type": "array",
            "title": "Questions",
            "description": "An array of questions.",
            "items": {
                "type": "object",
                "properties": {
                    "scenario": {
                        "type": "string",
                        "title": "Scenario",
                        "description": "The technical scenario for the question (No question should be posed here, no question marks)",
                        "pattern": "^[^??]*$"  # This regex pattern disallows question marks
                    },
                    "question": {
                        "type": "string",
                        "title": "Question",
                        "description": "The Question based on the scenario",
                    },
                    "options": {
                        "type": "array",
                        "title": "Options",
                        "description": "List of options",
                        "items": {
                            "type": "string"                        },
                        "minItems": 4,
                        "maxItems": 5
                    },
                    "answer": {
                        "type": "string",
                        "title": "Answer",
                        "description": "Must include the correct answer to the question",
                        "enum": ["A", "B", "C", "D", "E"]
                    },
                    "explanation": {
                        "type": "string",
                        "title": "Explanation",
                        "description": "The explanation of the correct answer"
                    }
                },
                "required": ["scenario", "question", "options", "answer", "explanation"]
            }
        }
    },
    "required": ["questions"]
}