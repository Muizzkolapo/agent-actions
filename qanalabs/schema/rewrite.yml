title: "Comprehensive Run Book Schema"
description: "A structured schema for creating and validating run books, including purpose, scope, procedures, and escalation points."
type: "object"
required:
  - "Purpose"
  - "Introduction"
  - "Scope"
  - "Definitions"
  - "Responsibilities"
  - "Frequency"
  - "ToolsAccess"
  - "SpecificProcedure"
  - "InternalExternalReferences"
  - "EscalationPoint"

properties:
  Purpose:
    type: "string"
    title: "Purpose"
    description: "A brief description of the purpose of the run book, explaining why it is required (e.g., compliance, incident resolution, daily monitoring)."

  Introduction:
    type: "string"
    title: "Introduction"
    description: "A general introduction with a statement of rationale."

  Scope:
    type: "string"
    title: "Scope"
    description: "A statement outlining the areas and context covered by the run book, including any areas to which it does not apply."

  Definitions:
    type: "string"
    title: "Definitions"
    description: "A list of definitions for terms used in the run book. Acronyms and abbreviations should be explained at the point of use."

  Responsibilities:
    type: "string"
    title: "Responsibilities"
    description: "A summary of the roles and the key tasks each role holder is responsible for in the procedures detailed in the run book."

  Frequency:
    type: "string"
    title: "Frequency"
    description: "A description of how often the process needs to be run."

  ToolsAccess:
    type: "string"
    title: "Tools and Access Required"
    description: "A list of tools and access required to fully perform the activity."

  SpecificProcedure:
    type: "string"
    title: "Specific Procedure"
    description: "The main text of the run book, detailing the procedure for the task to be performed. It should enable a trained person to perform the procedure without supervision and to train others."

  InternalExternalReferences:
    type: "string"
    title: "Internal/External References"
    description: "A list of all controlled internal references (e.g., other run books) and external references referred to within the run book."

  EscalationPoint:
    type: "string"
    title: "Escalation Point"
    description: "The procedure to escalate if the process did not run successfully, including contact details of the team responsible for escalation."
