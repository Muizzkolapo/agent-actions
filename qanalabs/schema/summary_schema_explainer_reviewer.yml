title: "summary_schema_feedback"
description: "A schema for validating summaries with associated explanations in a structured format."
type: "object"
required:
  - "summaries"
properties:
  summaries:
    title: "All Summaries"
    description: "An array of summaries, each containing a written summary, its explanation, and feedback."
    type: "array"
    minItems: 1
    items:
      type: "object"
      required:
        - "summary"
        - "explainer"
        - "feedback"
      properties:
        summary:
          type: "string"
          description: "The written summary capturing the main idea or concept."
        explainer:
          type: "string"
          title: "Detailed Explanation"
          description: "A detailed explanation of the summary, providing further context and understanding."
          pattern: "^(?=.*\\b(explain|describe|elaborate|discuss|how|why|what)\\b)(?=.*\\b(because|since|as|thus|therefore)\\b)(?=.*[,;]).{300,}$"
        feedback:
          type: "string"
          title: "Feedback"
          description: "Feedback provided on the summary and explainer to guide improvements or corrections."
