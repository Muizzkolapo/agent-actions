{
  "scenario": {
    "type": "string",
    "title": "Scenario",
    "description": "The technical scenario for the question (No question should be posed here, no question marks)",
    "pattern": "^[^??]*$"
  },
  "question": {
    "type": "string",
    "title": "Question",
    "description": "The Question based on the scenario",
    "pattern": "^[^scenario]*$"
  },
  "options": {
    "type": "array",
    "title": "Options",
    "description": "List of options",
    "items": {
      "type": "string",
      "pattern": "^(?=.*\\b(explain|describe|elaborate|discuss|how|why|what)\\b)(?=.*\\b(because|since|as|thus|therefore)\\b)(?=.*[,;]).{300,}$"
    },
    "minItems": 4,
    "maxItems": 5
  },
  "answer": {
    "type": "string",
    "title": "Answer",
    "description": "Must include the correct answer to the question",
    "enum": ["A", "B", "C", "D", "E"]
  },
  "explanation": {
    "type": "string",
    "title": "Explanation",
    "description": "The explanation of the correct answer"
  }
,
  "keep": {
    "type": "string",
    "title": "keep or dont keep",
    "description": "keep or not."
  }
}
