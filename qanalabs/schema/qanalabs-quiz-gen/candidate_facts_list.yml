name: candidate_facts_list
type: array
items:
  type: object
  properties:
    fact:
      type: string
      description: "Short, testable statement (≤25 words)"
      maxLength: 150  
    quote:
      type: string
      description: "Verbatim span from the source"
    technical_level:
      type: string
      description: "Technical level of the fact"
      enum: ["configuration", "implementation", "constraint","procedure","integration"]
  required:
    - fact
    - quote
    - technical_level
