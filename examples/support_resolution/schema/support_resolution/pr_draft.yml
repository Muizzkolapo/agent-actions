name: pr_draft
description: Schema for draft pull request
fields:
  - id: pr_title
    type: string
    description: "PR title (conventional commit style)"
  - id: pr_type
    type: string
    description: "Type: fix | feat | docs | refactor | perf | test"
  - id: summary
    type: string
    description: "One-paragraph summary of changes"
  - id: motivation
    type: string
    description: "Why this change is needed"
  - id: solution_approach
    type: string
    description: "How the fix/feature works"
  - id: files_to_modify
    type: array
    items:
      type: object
    description: "Files to change with suggested modifications"
  - id: testing_instructions
    type: string
    description: "How to test the changes"
  - id: checklist
    type: array
    items:
      type: string
    description: "PR checklist items"
  - id: breaking_changes
    type: boolean
    description: "Whether this includes breaking changes"
  - id: breaking_change_notes
    type: string
    description: "Notes on breaking changes if applicable"
  - id: related_issues
    type: array
    items:
      type: string
    description: "Issue numbers this PR addresses (e.g., 'Fixes #123')"
  - id: full_pr_body
    type: string
    description: "Complete PR body in markdown"
required:
  - pr_title
  - pr_type
  - summary
  - files_to_modify
  - full_pr_body
additionalProperties: false
