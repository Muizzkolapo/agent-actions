name: resolution_path
description: Schema for resolution decision
fields:
  - id: resolution_type
    type: string
    description: "Type: immediate_fix | workaround | code_change | documentation_update | wont_fix"
  - id: requires_code_change
    type: boolean
    description: "Whether a code change is needed"
  - id: complexity
    type: string
    description: "Estimated complexity: trivial | small | medium | large"
  - id: assigned_team
    type: string
    description: "Team to handle: frontend | backend | devops | docs | support"
  - id: priority
    type: string
    description: "Priority: p0 | p1 | p2 | p3"
  - id: estimated_effort
    type: string
    description: "Estimated effort (e.g., '2 hours', '1 day', '1 week')"
  - id: resolution_summary
    type: string
    description: "Summary of recommended resolution approach"
  - id: blockers
    type: array
    items:
      type: string
    description: "Any blockers or dependencies"
required:
  - resolution_type
  - requires_code_change
  - complexity
  - priority
  - resolution_summary
additionalProperties: false
