# Basic Example: Word Count Validation with Reprompting
# This example shows how to validate that an LLM response contains exactly 5 words
# and automatically retry with improved prompts if it fails.

agents:
  - agent_type: SummaryGenerator
    model_vendor: "openai"
    model_name: "gpt-4"
    prompt: "Summarize this article in exactly 5 words"
    
    # Configure interceptors for validation and reprompting
    interceptors:
      # Validation interceptor - checks if response meets criteria
      - type: validation
        config:
          validator_function: "agent_actions.validators.builtin_functions.word_count_validator"
          validator_args:
            expected: 5
          on_failure: retry  # Options: retry, fail, continue
          
      # Reprompt interceptor - generates improved prompts on validation failure
      - type: reprompt
        config:
          strategy: "llm"  # Use LLM to generate improved prompts
          max_attempts: 3
          llm_config:
            model_vendor: "openai"
            model_name: "gpt-4"
            # Optional: custom prompt template for reprompt generation
            # prompt_template: "Custom template here..."

# How this works:
# 1. Agent executes with original prompt
# 2. ValidationInterceptor checks if response has exactly 5 words
# 3. If validation fails, RepromptInterceptor generates improved prompt using LLM
# 4. Process repeats up to max_attempts (3) times
# 5. Returns final response (successful or after max attempts)