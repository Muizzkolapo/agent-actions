name: qanalabs-quiz-gen
description: "Educational quiz generation workflow with fact extraction, clustering, validation, and distractor generation"
version: "2.0.0"

# Global defaults applied to all actions unless overridden
defaults:
  vendor: openai
  model: gpt-4o-mini
  json_mode: true
  granularity: Record
  run_mode: online
  api_key: OPENAI_API_KEY
  is_operational: true
  prompt_debug: false
  few_shot: 0
  # Most common fields across actions - each action only adds unique fields
  observe: [id, url, platform_name, exam_name, page_content, bloom_details, fact, quote, fact_explanation, technical_level, questionable]
  drops: [rewrite_instruction, needs_rewrite, flagged_items, quiz_type, rationale]

actions:
  - name: fact_extractor
    intent: "Extract candidate facts from educational content"
    schema: candidate_facts_list
    drops: [id, url, topic]  # overrides defaults - unique drops for this action
    prompt: $qanalabs-quiz-gen.Fact_extraction

  - name: cluster_list
    kind: tool
    impl: qanalabs-quiz-gen.final_clustering.cluster_list
    intent: "Group extracted facts into logical clusters"
    observe: [topic, summary]  # only unique additions
    guard: 'candidate_facts_list != "[]"'  # overrides default guard

  - name: combine_by_cluster_and_id
    kind: tool
    impl: qanalabs-quiz-gen.combine_records_to_items.combine_records_to_items
    granularity: file
    intent: "Combine records by cluster and ID for processing"

  - name: validate_clusters
    intent: "Validate cluster quality and flag problematic items"
    schema: cluster_validation
    # uses all defaults - no additional fields needed
    prompt: $qanalabs-quiz-gen.Cluster_Validation_Agent

  - name: create_new_clusters
    kind: tool
    impl: qanalabs-quiz-gen.combine_records_to_items.create_new_clusters
    granularity: Record
    intent: "Create new clusters when validation indicates need for splitting"
    conditional_clause: "qanalabs-quiz-gen.combine_records_to_items.needs_split"

  - name: explain_facts
    intent: "Generate detailed explanations for extracted facts"
    schema: {fact_explanation: string}
    observe: [candidate_facts_list, why_questionable]  # only unique additions
    prompt: $qanalabs-quiz-gen.Fact_Explanation_Agent_new

  - name: classify_feynman
    intent: "Classify quiz type using Feynman technique principles"
    schema: {quiz_type: string, rationale: string}
    drops: [id, url, page_content, bloom_details]  # overrides defaults
    observe: [summary, question, options, answer_explanation, answer, excerpt, options_answer, question_type, target_word_counts, correct_answer_words]  # only unique additions
    few_shot: 6
    prompt: $feynman.classifer_feynman
    guard: 'questionable != "Low Value"'
    prompt_debug: true

  - name: generate_scenarios
    intent: "Generate quiz scenarios based on classified facts"
    schema: ScenarioGenerator_schema
    drops: [id, url, page_content, bloom_details]  # overrides defaults (quiz_type, rationale already in defaults)
    observe: [candidate_facts_list, why_questionable]  # only unique additions (quiz_type, rationale excluded by drops)
    prompt: $feynman.ScenarioGenerator_prompt
    prompt_debug: true

  - name: flatten_questions
    kind: tool
    impl: qanalabs-quiz-gen.flatten_questions.flatten_questions
    intent: "Flatten nested question structures for processing"
    granularity: Record
    guard: 'questionable != "Low Value"'

  - name: suggest_distractor_counts
    kind: tool
    impl: qanalabs-quiz-gen.randomize_options.suggest_word_counts
    intent: "Suggest word counts for answer distractors"
    observe: [summary, question, options, answer_explanation, answer, distractor_1, distractor_2, explanation_why_it_is_incorrect_1, explanation_why_it_is_incorrect_2, excerpt, options_answer, question_type]  # only unique additions

  - name: add_answer_text
    kind: tool
    impl: qanalabs-quiz-gen.add_answer_text.add_answer_text
    intent: "Add structured answer text to questions"
    observe: [summary, question, options, answer_explanation, answer, distractor_1, distractor_2, explanation_why_it_is_incorrect_1, explanation_why_it_is_incorrect_2, excerpt, options_answer, question_type]  # only unique additions

  - name: generate_distractors
    intent: "Generate answer distractors with explanations for multiple choice questions"
    loop:
      param: stage
      range: [1, 3]
    schema:
      distractor_${stage}: string
      explanation_why_it_is_incorrect_${stage}: string
    observe: [summary, question, answer_explanation, answer, excerpt, options_answer, question_type, target_word_counts, correct_answer_words, answer_text]  # only unique additions
    prompt: $qanalabs-quiz-gen.AnswerLengthDistractorGenerator_prompt
    guard: 'questionable != "Low Value"'
    prompt_debug: true

  - name: reconstruct_options
    kind: tool
    impl: qanalabs-quiz-gen.test2.apply_edited_distractors
    intent: "Reconstruct final answer options from correct answer and distractors"
    granularity: Record
    guard: 'questionable != "Low Value"'

plan:
  - fact_extractor
  - cluster_list <- fact_extractor
  - combine_by_cluster_and_id <- cluster_list
  - validate_clusters <- combine_by_cluster_and_id
  - create_new_clusters <- validate_clusters
  - explain_facts <- create_new_clusters
  - classify_feynman <- explain_facts
  - generate_scenarios <- classify_feynman
  - flatten_questions <- generate_scenarios
  - suggest_distractor_counts <- flatten_questions
  - add_answer_text <- suggest_distractor_counts
  - generate_distractors <- add_answer_text
  - reconstruct_options <- generate_distractors