################################################################################
# QanaLabs Quiz Generation Workflow
################################################################################
# Description: Educational quiz generation workflow with fact extraction,
#              deduplication, clustering, validation, and distractor generation
# Version: 2.0.0
# Workflow Phases:
#   1. Fact Extraction, Deduplication & Validation
#   2. Summary Generation & Code Cleanup
#   3. Question Generation & Validation
#   4. Explanation & Distractor Generation
#   5. Quiz Validation
#
# See workflow plan at bottom of file for execution order
################################################################################
name: qanalabs_quiz_gen
description: "Educational quiz generation workflow with fact extraction, clustering, validation, and distractor generation"
version: "2.0.0"
# Global defaults applied to all actions unless overridden
defaults:
  json_mode: true
  granularity: Record
  run_mode: online  # Use batch for batch mode testing
  model_vendor: openai
  model_name: gpt-4o-mini
  api_key: OPENAI_API_KEY
  is_operational: false
  prompt_debug: false
  few_shot: 0
  context_scope:
    seed_data:
        exam_syllabus: $file:mcp_qanalabs_syllabus.json
actions:
  # ============================================================================
  # STEP 1: EXTRACT RAW Q&A FROM DOCUMENTATION
  # ============================================================================
  - name: extract_raw_qa
    intent: "Extract staff/senior engineer level Q&A from documentation"
    schema: extract_raw_qa
    model_vendor: openai
    model_name: gpt-5-mini
    api_key: OPENAI_API_KEY
    prompt: $qanalabs_quiz_gen.Extract_Raw_QA
    versions:
      param: iteration 
      range: [1, 2, 3] 
      mode: parallel 
    context_scope:
      drop:
        - source.syllabus
        - source.url
    prompt_debug: false

  # ============================================================================
  # STEP 2: FLATTEN QUESTIONS FOR PROCESSING
  # ============================================================================
  - name: flatten_raw_questions
    dependencies: [extract_raw_qa]
    kind: tool
    impl: flatten_questions
    intent: "Flatten questions array for individual processing"
    granularity: Record
    version_consumption:
      source: extract_raw_qa
      pattern: merge
    context_scope:
      observe:
        - extract_raw_qa.*
  # ============================================================================
  # STEP 3: CANONICALIZE AND DEDUPLICATE Q&A PAIRS
  # ============================================================================
  - name: canonicalize_qa
    dependencies: ["flatten_raw_questions"]
    intent: "Deduplicate and create canonical representation of Q&A pairs"
    schema: canonicalize_qa
    prompt: $qanalabs_quiz_gen.Canonicalize_QA
    granularity: record
    prompt_debug: false
    context_scope:
      observe:
        - flatten_raw_questions.*

  # ============================================================================
  # STEP 4: FLATTEN CANONICAL QUESTIONS FOR PROCESSING
  # ============================================================================
  - name: flatten_canonical_questions
    dependencies: [canonicalize_qa]
    kind: tool
    impl: flatten_canonical_questions
    intent: "Flatten canonical_questions array for individual processing"
    granularity: Record
    context_scope:
      observe:
        - canonicalize_qa.*

  # ============================================================================
  # STEP 5: VOTE ON LEARNING QUALITY (3 voters)
  # ============================================================================
  - name: filter_learning_quality
    dependencies: ["flatten_canonical_questions"]
    intent: "Vote on questions for deep understanding and learning effectiveness"
    schema: filter_learning_quality
    prompt: $qanalabs_quiz_gen.Filter_Learning_Quality
    granularity: record
    versions:
      param: voter_id
      range: [1, 2, 3]
      mode: parallel
    context_scope:
      observe:
        - flatten_canonical_questions.*

  # ============================================================================
  # STEP 6: AGGREGATE VOTES FROM ALL VOTERS
  # ============================================================================
  - name: aggregate_votes
    dependencies: [filter_learning_quality]
    kind: tool
    impl: aggregate_votes
    intent: "Aggregate votes from 3 voters using majority rule"
    granularity: Record
    version_consumption:
      source: filter_learning_quality
      pattern: merge
    context_scope:
      observe:
        - filter_learning_quality_1.vote
        - filter_learning_quality_1.learning_quality_score
        - filter_learning_quality_1.vote_reasoning
        - filter_learning_quality_2.vote
        - filter_learning_quality_2.learning_quality_score
        - filter_learning_quality_2.vote_reasoning
        - filter_learning_quality_3.vote
        - filter_learning_quality_3.learning_quality_score
        - filter_learning_quality_3.vote_reasoning

  # ============================================================================
  # STEP 7: FILTER TO KEEP ONLY APPROVED QUESTIONS
  # ============================================================================
  - name: select_approved_questions
    dependencies: [aggregate_votes]
    kind: tool
    impl: select_fields
    intent: "Select only questions that passed voting (filter=keep)"
    granularity: Record
    guard:
      condition: 'filter == "keep"'
      on_false: "filter"
    context_scope:
      observe:
        - aggregate_votes.filter
        - aggregate_votes.vote_summary
        - flatten_canonical_questions.question_text
        - flatten_canonical_questions.answer_text
        - flatten_canonical_questions.canonicalize_reasoning
        - flatten_canonical_questions.source_quote
        - flatten_canonical_questions.merged_count
        - flatten_canonical_questions.difficulty_reason


  # ============================================================================
  # STEP 8: GENERATE ANSWERS FROM SOURCE (3 independent answerers)
  # ============================================================================
  - name: generate_answer_from_source
    dependencies: [select_approved_questions]
    intent: "Generate answer and source quote by analyzing original source content"
    schema: generate_answer_from_source
    prompt: $qanalabs_quiz_gen.Generate_Answer_From_Source
    prompt_debug: true
    granularity: record
    reprompt:
      validation: check_source_quote_length  # Validate source_quote >= 30 words
      max_attempts: 3
      on_exhausted: return_last
    versions:
      param: voter_id
      range: [1, 2]
      mode: parallel
    context_scope:
      observe:
        - select_approved_questions.*
        - source.page_content
        - source.url
      drop:
        - select_approved_questions.vote_summary
        - select_approved_questions.filter

  # ============================================================================
  # STEP 9: CONSOLIDATE ANSWERS AND VALIDATE AGAINST SOURCE
  # ============================================================================
  - name: consolidate_answer_from_source
    dependencies: [generate_answer_from_source]
    intent: "Consolidate two independent answers and validate against source quotes"
    schema: consolidate_answer_from_source
    prompt: $qanalabs_quiz_gen.Consolidate_Answer_From_Source
    prompt_debug: true
    granularity: record
    version_consumption:
      source: generate_answer_from_source
      pattern: merge
    context_scope:
      observe:
        - generate_answer_from_source.*
        - select_approved_questions.question_text
        - source.page_content
        - source.url
      passthrough:
        - select_approved_questions.question_text


  # ============================================================================
  # STEP 4: GET SCENARIO AUTHORING PROMPT
  # ============================================================================
  - name: get_authoring_prompt
    dependencies: [consolidate_answer_from_source]
    intent: "Get the appropriate scenario authoring prompt based on question type"
    schema: {
      authoring_prompt: string,
      suggested_opener: string,
      quiz_type_used: string
    }
    prompt: $qanalabs_quiz_gen.Compose_Authoring_Prompt
    granularity: Record
    context_scope:
      observe:
        - consolidate_answer_from_source.final_answer_text
        - consolidate_answer_from_source.final_source_quote

  # ============================================================================
  # STEP 5: WRITE SCENARIO-BASED QUESTION
  # ============================================================================
  - name: write_scenario_question
    dependencies: [get_authoring_prompt]
    intent: "Write staff/senior engineer level scenario-based question"
    schema: {
      question: string,
      options: array,
      answer: string,
      question_type: string,
      answer_explanation: string
    }
    prompt: $qanalabs_quiz_gen.Write_Scenario_Question
    granularity: Record
    context_scope:
      observe:
        - get_authoring_prompt.*
        - consolidate_answer_from_source.final_answer_text
        - consolidate_answer_from_source.final_source_quote
        - source.page_content


  # ============================================================================
  # STEP 6: FIX OPTIONS FORMAT
  # ============================================================================
  - name: fix_options_format
    dependencies: [write_scenario_question]
    kind: tool
    impl: fix_options_formatting
    intent: "Convert options field from JSON string to array format"
    granularity: Record
    context_scope:
      observe:
        - write_scenario_question.*


  # ============================================================================
  # STEP 7: SUGGEST DISTRACTOR WORD COUNTS
  # ============================================================================
  - name: suggest_distractor_counts
    dependencies: [fix_options_format]
    kind: tool
    impl: suggest_word_counts
    intent: "Suggest word counts for answer distractors"
    context_scope:
      passthrough:
        - fix_options_format.*


  # ============================================================================
  # STEP 8: ADD ANSWER TEXT
  # ============================================================================
  - name: add_answer_text
    dependencies: [suggest_distractor_counts]
    kind: tool
    impl: add_answer_text
    granularity: Record
    intent: "Add structured answer text to questions"
    context_scope:
      passthrough:
        - suggest_distractor_counts.*

  # ============================================================================
  # STEP 9: GENERATE DISTRACTOR 1 - Wrong technology/service
  # ============================================================================
  - name: generate_distractor_1
    dependencies: [add_answer_text]
    intent: "Generate first distractor - focus on wrong technology/service"
    schema:
      distractor_1: string
      explanation_why_it_is_incorrect_1: string
      thinking_process_1: string
    context_scope:
      observe:
        - suggest_distractor_counts.target_word_counts
        - add_answer_text.answer_text
        - add_answer_text.answer_explanation
        - consolidate_answer_from_source.final_source_quote
        - source.page_content
    prompt: $qanalabs_quiz_gen.Generate_Distractor_1
    prompt_debug: true

  # ============================================================================
  # STEP 10: GENERATE DISTRACTOR 2 - Wrong approach/concept
  # ============================================================================
  - name: generate_distractor_2
    dependencies: [generate_distractor_1]
    intent: "Generate second distractor - focus on wrong approach/concept"
    schema:
      distractor_2: string
      explanation_why_it_is_incorrect_2: string
      thinking_process_2: string
    context_scope:
      observe:
        - suggest_distractor_counts.target_word_counts
        - add_answer_text.answer_text
        - add_answer_text.answer_explanation
        - consolidate_answer_from_source.final_source_quote
        - source.page_content
        - generate_distractor_1.distractor_1
        - generate_distractor_1.explanation_why_it_is_incorrect_1
    prompt: $qanalabs_quiz_gen.Generate_Distractor_2
    prompt_debug: true

  # ============================================================================
  # STEP 11: GENERATE DISTRACTOR 3 - Edge case/misconception
  # ============================================================================
  - name: generate_distractor_3
    dependencies: [generate_distractor_2]
    intent: "Generate third distractor - focus on edge case/misconception"
    schema:
      distractor_3: string
      explanation_why_it_is_incorrect_3: string
      thinking_process_3: string
    context_scope:
      observe:
        - suggest_distractor_counts.target_word_counts
        - add_answer_text.answer_text
        - add_answer_text.answer_explanation
        - consolidate_answer_from_source.final_source_quote
        - source.page_content
        - generate_distractor_1.distractor_1
        - generate_distractor_1.explanation_why_it_is_incorrect_1
        - generate_distractor_2.distractor_2
        - generate_distractor_2.explanation_why_it_is_incorrect_2
    prompt: $qanalabs_quiz_gen.Generate_Distractor_3
    prompt_debug: true

  # ============================================================================
  # STEP 12: RECONSTRUCT OPTIONS
  # ============================================================================
  - name: reconstruct_options
    dependencies: [generate_distractor_3]
    kind: tool
    impl: apply_edited_distractors
    intent: "Reconstruct final answer options from correct answer and distractors"
    granularity: Record
    context_scope:
      observe:
        - generate_distractor_3.*
        - generate_distractor_2.*
        - generate_distractor_1.*
        - add_answer_text.*

  # ============================================================================
  # STEP 13: VALIDATE ANSWER FROM SOURCE (5 parallel AI validators)
  # ============================================================================
  - name: validate_answer_from_source
    dependencies: [reconstruct_options]
    intent: "Validate if question can be correctly answered from source documentation"
    versions:
      param: attempt
      range: [1, 2, 3]
      mode: parallel
    schema:
      predicted_answer: string
      reasoning: string
      supporting_quotes: array
    prompt: $qanalabs_quiz_gen.Validate_Answer_From_Source
    prompt_debug: true
    context_scope:
      observe:
        - source.page_content
        - consolidate_answer_from_source.final_source_quote
        - write_scenario_question.question
        - reconstruct_options.options

  # ============================================================================
  # STEP 14: AGGREGATE VALIDATION VOTES
  # ============================================================================
  - name: aggregate_validation_votes
    dependencies: [validate_answer_from_source]
    kind: tool
    impl: aggregate_validation_votes
    intent: "Aggregate votes from 5 validators using majority rule"
    granularity: Record
    version_consumption:
      source: validate_answer_from_source
      pattern: merge
    context_scope:
      observe:
        - validate_answer_from_source.*
        - write_scenario_question.question
        - reconstruct_options.answer
        - reconstruct_options.answer_text
        - reconstruct_options.options
        - consolidate_answer_from_source.final_source_quote

  # ============================================================================
  # STEP 15: FILTER VALIDATED QUESTIONS
  # ============================================================================
  - name: select_validated_questions
    dependencies: [aggregate_validation_votes]
    kind: tool
    impl: select_fields
    intent: "Select only questions that passed validation (validation_passed=true)"
    granularity: Record
    guard:
      condition: validation_status == "PASS"    
      on_false: "filter"
    context_scope:
      observe:
        - aggregate_validation_votes.*

  # ============================================================================
  # STEP 16: GENERATE FEYNMAN EXPLANATION
  # ============================================================================
  - name: generate_feynman_explanation
    dependencies: [select_validated_questions]
    intent: "Generate Feynman-style explanations for why the answer is correct"
    schema:
      question_explanation: string
      answer_reasoning: string
      key_concept_analogy: string
      memorable_takeaway: string
    prompt: $qanalabs_quiz_gen.Feynman_Explanation_Generator
    prompt_debug: true
    context_scope:
      observe:
        - select_validated_questions.*
        - write_scenario_question.question
        - reconstruct_options.options
        - reconstruct_options.answer
        - write_scenario_question.answer_explanation
        - consolidate_answer_from_source.final_source_quote
        - source.page_content

  # ============================================================================
  # STEP 17: GENERATE CONCEPT EXPLANATION
  # ============================================================================
  - name: generate_concept_explanation
    dependencies: [generate_feynman_explanation]
    intent: "Generate educational explanation of the underlying concept being tested"
    schema:
      concept_explanation: string
    prompt: $qanalabs_quiz_gen.Generate_Concept_Explanation
    prompt_debug: true
    context_scope:
      observe:
        - generate_feynman_explanation.*
        - write_scenario_question.question
        - reconstruct_options.answer
        - write_scenario_question.answer_explanation
        - consolidate_answer_from_source.final_source_quote
        - source.page_content

  # ============================================================================
  # STEP 18: OPTIONS COMBINER
  # ============================================================================
  - name: OptionsCombiner
    dependencies: [generate_concept_explanation]
    kind: tool
    impl: merge_correct_answer_with_distractors
    intent: "Merge correct answer with distractors into options_combined format"
    granularity: Record
    context_scope:
      observe:
        - generate_concept_explanation.*
        - generate_feynman_explanation.*
        - reconstruct_options.*
        - write_scenario_question.*

  # ============================================================================
  # STEP 19: FORMAT FINAL QUIZ
  # ============================================================================
  - name: format_quiz_text
    dependencies: [OptionsCombiner]
    kind: tool
    impl: format_quiz_object
    intent: "Format the final quiz output with HTML formatting"
    granularity: Record
    context_scope:
      observe:
        - OptionsCombiner.*
        - source.url