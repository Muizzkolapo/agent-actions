name: code_centered_quiz
description: "Generate code options quizzes where users select the best implementation from multiple working alternatives"
version: "1.0.0"

# Global defaults applied to all actions unless overridden
defaults:
  model_vendor: openai
  model_name: gpt-5-mini
  json_mode: true
  granularity: Record
  run_mode: online
  api_key: OPENAI_API_KEY
  prompt_debug: false
  few_shot: 0


actions:
  - name: code_extractor
    intent: "Extract code blocks from technical documentation"
    schema: candidate_code_list
    prompt: $drop_down_quiz.Code_extraction
    context_scope:
      observe:
        - source.page_content
        - source.id
        - source.url
        - source.platform_name
        - source.exam_name
        - source.bloom_details

  - name: flatten_code
    dependencies: [code_extractor]
    kind: tool
    impl: flatten_code
    intent: "Flatten extracted code blocks for processing"
    context_scope:
      observe:
        - code_extractor.*

  - name: code_usage_scenario
    dependencies: [flatten_code]
    intent: "Generate realistic usage scenarios for code comparison"
    schema: {sample_usage_scenario: string, code_for_scenario: string, scenario_complexity: string, key_considerations: string}
    prompt: $drop_down_quiz.Scenario_generation
    context_scope:
      observe:
        - flatten_code.code_block
        - flatten_code.description
        - flatten_code.language

  - name: generate_optimal_code
    dependencies: [code_usage_scenario]
    intent: "Generate the BEST implementation following industry best practices"
    schema: {optimal_code: string}
    prompt: $code_options_quiz.generate_optimal_code
    context_scope:
      observe:
        - code_usage_scenario.sample_usage_scenario
        - code_usage_scenario.code_for_scenario
        - code_usage_scenario.scenario_complexity
        - code_usage_scenario.key_considerations
        - source.page_content
        - source.title

  - name: generate_code_alternatives
    dependencies: [generate_optimal_code]
    intent: "Generate 3 suboptimal but working code alternatives with different issues"
    versions:
      param: alternative_num
      range: [1, 2, 3]
      mode: parallel
    schema:
      alternative_code_${alternative_num}: string
      issue_type_${alternative_num}: string
      issue_description_${alternative_num}: string
    prompt: $code_options_quiz.generate_code_alternatives
    context_scope:
      observe:
        - code_usage_scenario.sample_usage_scenario
        - code_usage_scenario.code_for_scenario
        - code_usage_scenario.scenario_complexity
        - code_usage_scenario.key_considerations
        - generate_optimal_code.optimal_code
        - source.page_content
        - source.title

  - name: merge_alternatives
    dependencies: [generate_code_alternatives]
    kind: tool
    version_consumption:
      source: generate_code_alternatives
      pattern: merge
    impl: merge_alternatives
    intent: "Merge all code alternatives into single record"
    granularity: Record
    context_scope:
      observe:
        - generate_code_alternatives.*

  # ============================================================================
  # STEP 6.5: VALIDATE CODE QUALITY (CRITICAL SAFETY CHECK)
  # ============================================================================
  - name: validate_code_quality
    dependencies: [merge_alternatives]
    intent: "Validate that optimal code is actually superior to alternatives"
    model_vendor: openai
    model_name: gpt-5
    schema:
      optimal_is_best: boolean
      validation_reasoning: string
      quality_issues: array
      validation_status: string
    prompt: $code_options_quiz_validation.validate_code_quality
    context_scope:
      observe:
        - generate_optimal_code.optimal_code
        - merge_alternatives.*
        - code_usage_scenario.sample_usage_scenario
        - code_usage_scenario.key_considerations
        - source.page_content
        - source.title

  # ============================================================================
  # STEP 7: GENERATE FEYNMAN EXPLANATION
  # ============================================================================
  - name: generate_feynman_explanation
    dependencies: [merge_alternatives, validate_code_quality]
    intent: "Generate simple explanation for why the optimal code is best"
    # TESTING: Lowered threshold to allow FAIL/NEEDS_REVIEW through for testing
    # guard:
    #   condition: 'validation_status == "PASS"'
    #   on_false: "filter"
    schema:
      question_explanation: string
      answer_reasoning: string
      key_concept_analogy: string
      memorable_takeaway: string
    prompt: $code_options_quiz.Feynman_Explanation_Generator
    context_scope:
      observe:
        - merge_alternatives.*
        - code_usage_scenario.sample_usage_scenario
        - code_usage_scenario.key_considerations
        - generate_optimal_code.optimal_code
        - source.page_content
        - source.url
        - source.title
        - validate_code_quality.*

  # ============================================================================
  # STEP 8: GENERATE CONCEPT EXPLANATION
  # ============================================================================
  - name: generate_concept_explanation
    dependencies: [generate_feynman_explanation]
    intent: "Generate educational explanation of the coding concept being tested"
    schema:
      concept_explanation: string
    prompt: $code_options_quiz.Generate_Concept_Explanation
    context_scope:
      observe:
        - generate_feynman_explanation.*
        - code_usage_scenario.*
        - generate_optimal_code.optimal_code
        - merge_alternatives.*
        - source.page_content

  # ============================================================================
  # STEP 8.5: VALIDATE EDUCATIONAL QUALITY (ENSURE CLEAR EXPLANATIONS)
  # ============================================================================
  - name: validate_educational_quality
    dependencies: [generate_concept_explanation]
    intent: "Validate explanations are clear, accurate, and educational"
    model_vendor: openai
    model_name: gpt-5.1-codex
    schema:
      explanation_is_clear: boolean
      explanation_is_grounded: boolean
      explanation_is_complete: boolean
      missing_concepts: array
      quality_score: integer
      quality_status: string
      improvement_suggestions: array
    prompt: $code_options_quiz_validation.validate_educational_quality
    context_scope:
      observe:
        - generate_concept_explanation.concept_explanation
        - generate_feynman_explanation.*
        - merge_alternatives.*
        - code_usage_scenario.sample_usage_scenario
        - generate_optimal_code.optimal_code

  # ============================================================================
  # STEP 9: OPTIONS COMBINER
  # ============================================================================
  - name: OptionsCombiner
    dependencies: [generate_concept_explanation, validate_educational_quality]
    kind: tool
    impl: merge_code_options
    intent: "Merge optimal code with alternatives into options_combined format"
    granularity: Record
    # TESTING: Lowered threshold - commented out guard to allow all through for testing
    # guard:
    #   condition: 'quality_status == "PASS" and quality_score >= 8'
    #   on_false: "filter"
    context_scope:
      observe:
        - generate_concept_explanation.*
        - generate_feynman_explanation.*
        - merge_alternatives.*
        - code_usage_scenario.*
        - generate_optimal_code.*
        - validate_educational_quality.*

  # ============================================================================
  # STEP 10: FORMAT FINAL QUIZ
  # ============================================================================
  - name: format_quiz_text
    dependencies: [OptionsCombiner]
    kind: tool
    impl: format_quiz_object
    intent: "Format the final quiz output with HTML formatting"
    granularity: Record
    context_scope:
      observe:
        - OptionsCombiner.*
        - source.url

  # ============================================================================
  # STEP 11: GENERATE VSCODE MOCKUPS
  # ============================================================================
  - name: format_code_blocks
    dependencies: [format_quiz_text]
    kind: tool
    impl: generate_vscode_mockup_for_options
    intent: "Generate VS Code mockup HTML for code options with syntax highlighting"
    granularity: Record
    context_scope:
      observe:
        - format_quiz_text.*
