name: consolidate_answer_from_source
description: Schema for consolidating multiple answers and validating against source quotes
fields:
  - id: final_answer_text
    type: string
    description: "Consolidated answer supported by the source"
  - id: final_source_quote
    type: string
    description: "Single best direct quote that supports the final answer"
  - id: validity
    type: string
    description: "Whether the final answer is fully supported by the source"
  - id: validity_reason
    type: string
    description: "Brief explanation for validity decision"
  - id: selected_answerer
    type: string
    description: "Which answerer was selected or if both/none were used"
additionalProperties: false
