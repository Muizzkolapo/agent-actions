name: aggregate_votes
description: Schema for final questions after vote aggregation
fields:
  - id: high_quality_questions
    type: array
    description: "Array of questions that passed voting (majority keep)"
    items:
      type: object
      properties:
        question_text:
          type: string
          description: "The question text"
        answer_text:
          type: string
          description: "The answer text"
        source_quote:
          type: string
          description: "Source quote"
        difficulty_reason:
          type: string
          description: "Why this tests senior-level understanding"
        merged_count:
          type: integer
          description: "Number of questions merged"
        canonicalize_reasoning:
          type: string
          description: "Canonicalization reasoning"
        vote_summary:
          type: string
          description: "Summary of votes (e.g., '3 keep, 0 filter')"
        avg_quality_score:
          type: number
          description: "Average quality score from all voters"
        consensus_reasoning:
          type: string
          description: "Synthesis of all voter reasoning explaining why this question passed"
      required:
        - question_text
        - answer_text
        - source_quote
        - difficulty_reason
        - merged_count
        - canonicalize_reasoning
        - vote_summary
        - avg_quality_score
        - consensus_reasoning
      additionalProperties: false
additionalProperties: false
