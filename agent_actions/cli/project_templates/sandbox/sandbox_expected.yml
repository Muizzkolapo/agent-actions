# What a sandbox run of support_desk must produce, with sandbox.yml as its scenario.
# `agac sandbox check -w support_desk` runs the workflow in the sandbox and compares.
#
# The mock and the scenario decide the same way for the same input, so each number
# here is the same in each run. A key that is not here is not checked.

exit_code: 0

# The counts of the line `SANDBOX scenario sandbox.yml: ...` after the run.
scenario:
  errors: 8                  # each first call of score_1 and score_2: 4 records x 2 raters
  rules_broken: 4            # each first answer of classify
  batch_results_dropped: 2   # tag_reply results the first batch left out

# Per action: its status, and the record counts of `agac dispositions --sandbox`.
actions:
  read_ticket: {status: completed, records: 5}
  classify: {status: completed, success: 4, filtered: 1}          # the guard filters the spam ticket
  score_1: {status: completed, success: 4}
  score_2: {status: completed, success: 4}
  merge_scores: {status: completed, success: 4}
  reply_round_iter1__draft_reply: {status: completed, success: 4}
  reply_round_iter2__draft_reply: {status: completed, success: 2, sent_elsewhere: 2}  # the high-priority tickets
  reply_round: {status: completed, records: 4}
  by_queue: {status: completed, success: 5}
  billing_team: {status: completed, success: 2, sent_elsewhere: 2}
  support_team: {status: completed, success: 2, sent_elsewhere: 2}
  assigned: {status: completed, records: 4}
  approve_reply: {status: completed, success: 4}
  tag_reply: {status: completed, success: 4, failed: 0}
