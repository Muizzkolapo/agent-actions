name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Install go-task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Lint
        run: task lint

      - name: Format check
        run: task format:check

      - name: Type check
        run: task mypy

      - name: Security scan
        run: task security

  changelog:
    name: Changelog Entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for changelog entry
        run: |
          if ls .changes/unreleased/*.yaml 1>/dev/null 2>&1; then
            echo "Changelog entry found:"
            ls .changes/unreleased/*.yaml
          else
            echo "::error::No changelog entry found. Run 'task changelog:new' to create one."
            exit 1
          fi

      - name: Check for signed commits
        run: |
          git log origin/main..HEAD --format="%H %s" | while read hash subject; do
            if ! git log -1 --format="%B" "$hash" | grep -q "Signed-off-by:"; then
              echo "::error::Commit $hash is missing Signed-off-by. Use 'git commit --signoff'."
              exit 1
            fi
          done

  test-shard:
    # The suite runs as 6 jobs at once, each on all the runner's cores. A shard
    # holds whole test files, balanced by tests/shard_durations.json
    # (tests/_support/sharding.py); every file runs in exactly one shard.
    name: Tests (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: check
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Run tests
        # The last line of each log holds the seconds each file took on CI's runners:
        # the times tests/shard_durations.json balances the shards by.
        run: uv run pytest -n auto --dist worksteal --shard ${{ matrix.shard }}/6 --report-shard-durations

  test:
    # One check named "Tests", as before the suite was sharded: it passes only when
    # every shard passed.
    name: Tests
    runs-on: ubuntu-24.04
    permissions: {}
    needs: test-shard
    if: always()
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          echo "Shards: $SHARDS"
          test "$SHARDS" = "success"

  newest-sdks:
    # uv.lock pins the SDKs the main job tests; a user's install takes the newest
    # versions pyproject.toml allows, which can differ (anthropic 1.x and openai 3.x
    # run on httpx2). This job runs the provider tests on those (#1781).
    name: Provider Tests (newest SDKs)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: check
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Upgrade the vendor SDKs to the newest versions the pins allow
        run: >-
          uv sync --dev
          --upgrade-package anthropic --upgrade-package openai --upgrade-package groq
          --upgrade-package google-genai --upgrade-package cohere --upgrade-package ollama

      - name: Show the SDK versions under test
        run: uv pip list | grep -Ei '^(anthropic|openai|groq|google-genai|cohere|ollama|httpx2?) '

      - name: Run provider tests
        run: uv run pytest -n auto --dist worksteal tests/unit/llm tests/unit/llm_invocation tests/unit/validation

  build:
    name: Build Package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Build
        run: uv build

      - name: Verify py.typed marker
        run: unzip -l dist/agent_actions-*.whl | grep py.typed

      - name: Verify entrypoints
        run: |
          uv pip install --force-reinstall dist/*.whl
          uv run agac --help > /dev/null
          uv run agac-lsp --help > /dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
