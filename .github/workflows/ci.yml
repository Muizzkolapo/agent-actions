name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Linting and style checks
  check:
    name: Lint & Style Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Install go-task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Run ruff linter
        run: task lint:ruff

      - name: Run ruff format check
        run: uv run ruff format --check agent_actions tests

  # Dead code analysis (warning only)
  dead-code:
    name: Dead Code Analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Run dead code analysis
        run: uv run python .claude/helpers/dead_code_analyzer.py agent_actions --brief

  # Unit tests
  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Install go-task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Run unit tests
        run: task test:unit

  # Build verification
  build:
    name: Build Package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Install go-task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Build package
        run: task build

      - name: Verify py.typed marker included
        run: unzip -l dist/agent_actions-*.whl | grep py.typed

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
