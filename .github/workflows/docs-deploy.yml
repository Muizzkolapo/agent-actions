name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs.agent-actions/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# This site is plain static HTML/CSS/JS — there is NO build step.
# We upload the folder as-is and let GitHub Pages serve it.
jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # the folder that contains index.html (this docs site)
          path: docs.agent-actions

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
