name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff (logging rules)
        run: uv run ruff check agent_actions --select LOG,G --ignore G004

      - name: Run custom logging checker
        run: uv run python scripts/check_logging_format.py agent_actions

      - name: Run logging format tests
        run: uv run pytest tests/test_logging/test_logging_format_validation.py -v
