kind: Enhancement or New Feature
body: '`agac docs` and the editor now know `- route:`, `- join:` and `- loop:` entries. The docs catalog loads a workflow with a router or a join through the render step a run uses, as it already did for an include, so the router, the join and each branch action appear in it; a loop appears as each of its iterations and the action named after it. The editor indexes the name of each route, join and loop entry as an action of the workflow, at the line of its entry, so a read of `router.case`, `bank.<field>` or `round.<field>` resolves; an action of a loop''s branch is not an action of the workflow, as the load refuses a read of it outside the loop. A new example, `examples/question_rounds`, runs a loop of three rounds, a router and a join offline against the mock provider.'
time: 2026-11-21T09:30:00Z
