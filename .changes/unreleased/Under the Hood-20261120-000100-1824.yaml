kind: Under the Hood
body: 'A record can now be sent to another branch rather than dropped: an action carrying the internal key `_sends_elsewhere` records a record its guard filters as `filtered` with reason `sent_elsewhere`. The record stays out of that branch, also at a fan-in that reads an action above the branch, and comes back at an action carrying `_gathers`, and below it, through the branch it went to; an ordinary filter stays dead there. An action whose every record went elsewhere completes on no records instead of being skipped, in both run modes, and its readers run on nothing. Such a record is never reported as filtered: the guard pre-filter log line and the result collection event count it as sent elsewhere, and `agac dispositions` shows it in a Sent elsewhere column, outside Filtered and Total (`--json`: each action''s `sent_elsewhere`). The disposition gate and `agac retry` treat it as any filtered record.'
