kind: Bug Fix
body: "Batch carry-forward decided which stored rows to hand back to a rewrite by subtracting the batch's record identities from the stored ones, so a row the batch had just replaced read as one it never answered for. An expansion mints a fresh identity per child, so the rows a re-run produces for an input carry none of the identities its previous rows did, and the output file was written holding both generations side by side. Reachable without an interrupted write: a prompt, schema, guard, model or limit change clears the action's dispositions and re-runs the action with its previous rows still stored, which is why the duplication showed up on an ordinary edit-and-re-run rather than only after a crash. Carry-forward is now told which inputs the batch carried — `finalize_batch_output` already held that, in the context map it writes filtered dispositions from — instead of inferring it from the results. A stored row is handed back unless this run replaced everything it holds: under its own identity while holding nothing else, or through the producers that minted it. A row naming a producer the run left alone keeps both, and an input the batch carried is never read as a minted identity, so a row held for one the results did not answer for is kept rather than inferred away. Resolving such a row through `producer_source_guids` alone is not sufficient and not safe: that field is the consumed set minus the row's own guid, so a row that kept an input's identity does not name it, and a many-to-one row would have been dropped whenever its other inputs were reprocessed."
