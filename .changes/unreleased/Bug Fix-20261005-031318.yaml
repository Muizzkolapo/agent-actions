kind: Bug Fix
body: >-
  A batch action now puts every record it carries as done to its guard again, as an online
  action does, other than a record the action above blocked, which batch never puts to the
  guard. A record it had already answered was carried without reaching the guard, so when
  the guard's verdict on it changed with nothing resetting the action, its old answer
  stayed in the output and every action below read it: an action stopped partway and run
  again after its guard's UDF was changed kept its answer to a record the guard now skips.
  The output now holds the rows online's does: a record the guard now filters is left out,
  and one it now skips is replaced by its tombstone; where it filters every record, the
  action holds nothing and is skipped. Nothing is sent to the model for either, and a
  record the guard still passes is carried as before, with no prompt prepared for it. A
  guard UDF that writes to a carried record stops the action, as it does online, wherever
  the record sits in its file.
