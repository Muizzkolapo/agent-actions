kind: Enhancement or New Feature
body: 'A workflow can run a branch again for each record whose check failed, up to a fixed number of times. `- loop: <name>` with `include:` (a branch file), `max_iterations:` (1 to 10), `inputs:`, `feedback:` (a branch input bound to an action of the previous iteration, none in iteration 1), `until:` (a condition on the branch''s fields) and `result:` unrolls at load into one include instance per iteration, `<name>_iter<k>`. From iteration 2 the actions that start the branch take only the records for which `until` did not hold in the previous iteration; a record that passed is recorded filtered with reason `sent_elsewhere`, not reported as filtered, and comes back at the action named after the loop, which holds for each record the `result` of the last iteration that ran for it (the last iteration for a record that never passed). Each iteration is an ordinary action, so a stop resumes at the next iteration and `agac retry` continues the loop from the iteration that failed, in both run modes. The load refuses a `max_iterations` out of range, a `feedback` or `result` the branch does not list under `outputs:`, an `until` that reads anything but declared fields of branch actions up to `result`, an entry action with a guard of its own, a guard reading a feedback input, a branch action at File granularity, and an action outside the loop that reads an iteration instead of the loop name. `agac inspect` shows the loop as one line with its limit and condition. A fan-in below an action that sends records elsewhere is no longer warned about as possibly null, and a batch retry whose guard now sends a record elsewhere takes the rows built on it out of the actions below, as online does.'
