kind: Under the Hood
body: "Drops three fields `PreparedTask` carried for no reader: `source_content` and `prompt_context`, assigned on two of `TaskPreparer.prepare`'s three returns (the upstream-unprocessed short-circuit assigned neither), and `metadata`, assigned on none. Nothing read any of them; the similarly spelled reads elsewhere are on `ContextBuildConfig` and `PromptPreparationRequest`. #1131 asked whether `source_content` should instead become the single carrier every surface reads for a record's resolved `source` namespace, so the guard and prompt surfaces cannot drift apart again. It cannot, for a structural reason: the field is built after each surface that would read it. `apply_context_scope_for_records` and `prefilter_by_guard` both run over raw records — in `pipeline.py` and `UnifiedProcessor._guard_filter` — and produce the survivors that later reach `prepare()`, so no `PreparedTask` exists when they need the answer; and within `prepare()` the guard and the prompt already share one `field_context` built from a single resolution, threaded into `build_guard_context` through the very parameter the issue named as the seam. The drift the field was meant to prevent was closed where it actually lived — in the guard evaluator, by #1135 — which is also why no carrier would have helped: that override sat downstream of the context any carrier would populate. What the fields stood in for is now asserted rather than implied, and the new coverage is specifically the prompt surface: that the value a guard admitted a record on is the one the model is then shown. `PreparationContext` still carries three fields no consumer reads; left alone deliberately, because it has a second builder in the batch preparator that takes two of them as parameters purely to set them, so dropping them changes that signature too. No behaviour change."
