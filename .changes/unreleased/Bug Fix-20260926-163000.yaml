kind: Bug Fix
body: "A FILE tool's `source_index` is now checked for what it holds, not only its outer type, so a value that could never be an input position is refused where the outputs are built. `source_index` says which input produced a row: an integer, a list of integers for a many-to-one output, or `None` when no single input produced it. `FileUDFResult` validated that the key was present and that it was an `int`, a `list`, or `None` — never what a list held, nor the sign of an integer. Two things followed. A `None` inside a list, and a `bool` anywhere, resolved silently to a real input: the reconciliation step reads only a list's first element for namespace carry-forward, where `None` falls back to the first input record, and `isinstance(True, int)` holds in Python, so `source_index: True` read input 1 and the row inherited that record's namespaces with nothing logged. A string, a float or a negative integer instead raised `IndexError` from framework internals, reported as `out of bounds` even though the value was never a position to begin with. Separately, every position after a list's first reaches only the many-to-one disposition accounting, which silently fails to account for one it cannot read — so `source_index: [0, -1]` resolved fine from `0` and then tombstoned the input the tool had claimed as `-1`, recording it as a record the tool never returned. The check refuses bools, non-integers and negatives at construction, in the message naming the offending output and the values it rejected. Range is deliberately left to the run: how many inputs there are is not knowable where the outputs are built, and the run already accounts for nobody on an index it cannot resolve, so an index past the end still arrives there as before."
time: 2026-09-26T16:30:00Z
