kind: Bug Fix
body: "A FILE tool's `source_index` is now checked for what it holds, not only its outer type, so a value that could never be an input position is refused where the outputs are built. `source_index` says which input produced a row: an integer position, a list of positions for a many-to-one output, or `None` when no single input produced it. `FileUDFResult` validated that the key was present and that it was an `int`, a `list`, or `None` — never what a list held, nor the sign of an integer. Three things followed. A bool was silently accepted as a position, because `isinstance(True, int)` holds in Python: `source_index: True` resolved to input 1 and the row was written carrying that record's `source_guid` outright, as an update to a record the tool never named. A `None` nested inside a list was accepted at the boundary and then failed the record deep in lineage enrichment, which compares a contributor index against the input count with no lower bound and no type guard, so `None < len(source_data)` raised `TypeError` and the record surfaced as `Enrichment failed: '<' not supported between instances of 'NoneType' and 'int'` — a real failure, but one naming nothing the tool author could act on; `[None, 0]` did the same while also discarding the one real contributor it had been given. And because only a list's first position is read for parentage, the rest reach only the many-to-one disposition accounting, which requires `0 <= idx < len(records)` and accounts for nobody otherwise: `source_index: [0, -1]` resolved its row from `0`, had its lineage attributed to `source_data[-1]` — the last input — and then tombstoned the input it had claimed as `-1`, recording it as a record the tool never returned. Two framework readers disagreed about one value. The check refuses bools, non-integers and negatives at construction, scalar or nested, naming the output index and rendering the values it rejected. Note that a numpy integer is not a Python `int` and is now refused as well: inside a list it previously caused exactly the spurious tombstone above, and as a scalar it was already refused by the existing outer type check. Range is deliberately left to the run: how many inputs there are is not knowable where the outputs are built, so an index past the end still arrives there, where a list's later position accounts for nobody and its first fails the action."
