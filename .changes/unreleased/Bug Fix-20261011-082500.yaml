kind: Bug Fix
body: "A `templates/` file now contributes the names it exports and nothing Jinja adds of its own, so a project with two or more `.j2` or `.jinja2` files no longer warns on every load that each file after the first redefines `__name__` and `_body_stream`. No template defined those two: they are attributes `TemplateModule.__init__` sets on every loaded module, and registration took the module's whole `vars()` as the file's names. The first file therefore seeded the environment globals with them and each later file collided, so the warning fired once per file per load even when the files shared no names, and a genuine collision had the two mixed into its list beside the macro that really was defined twice — `__name__, _body_stream, house_length` where only `house_length` was the user's. Both names also became globals of the workflow file, so a workflow could read `{{ __name__ }}` and get whichever `templates/` filename the directory listing happened to yield last. Registration now keeps the module's public names, which is exactly its export set: Jinja's compiler exports no name beginning with an underscore, filtering `public_names` for `{% set %}` and checking `startswith(\"_\")` for `{% macro %}`, so nothing a template can export is lost and the two attributes are never registered. The warning now names only names two files really export, and a macro that genuinely collides is still reported; a file that only `{% extends %}` another exports its parent's names too, so those are named as well, which is accurate because the second file does overwrite them. Reading one of the two attributes from a workflow file now fails the load by name rather than resolving, since a name a workflow reads and nothing supplies raises. Unchanged: collisions are still measured against the whole of the environment globals, so a macro shadowing `load_prompt` or a Jinja builtin such as `range` is still reported as set by a previous template — misattributed, as before, but a real shadow worth surfacing."
