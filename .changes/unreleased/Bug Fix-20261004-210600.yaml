kind: Bug Fix
body: >-
  An online action whose guard filters every record of one input file is no longer skipped
  while another of its files holds rows. The file whose records were all filtered marked
  the whole action skipped with "All records guard-filtered — no output produced", so the
  action ended `skipped` over the rows its other files had just written, every later run
  ran it again, and its readers were skipped and kept the rows they built before, those
  from the filtered records included. Batch completed in the same project. Such an action
  now completes, as in batch, and its readers run on what it holds; an action whose guard
  filters every record of every file is still skipped. A project left this way is put
  right by its next run. The warning for a file whose records are all filtered now says
  none of them reaches downstream actions, rather than that downstream actions receive no
  input.
time: 2026-10-04T21:06:00Z
