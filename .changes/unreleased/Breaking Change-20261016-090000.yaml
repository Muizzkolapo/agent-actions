kind: Breaking Change
body: >-
  `retry.max_attempts` now counts every attempt under batch, the original batch included, as it
  does online. Under batch it counted only the retry batches sent after the first, so
  `max_attempts: N` asked a record the provider never answered N+1 times and stored it
  `exhausted_after_N+1_attempts`, while online made N calls. A batch action with `max_attempts: 1`
  now sends no retry batch, and one with `max_attempts: N` sends at most N-1, so an existing
  workflow sends one fewer paid retry batch per missing record. Raise `max_attempts` by one to
  keep the old count. The schema description and `retry.md` and `batch-recovery.md` now say what
  the number counts. (#1368)
time: 2026-10-16T09:00:00Z
