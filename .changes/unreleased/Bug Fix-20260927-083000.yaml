kind: Bug Fix
body: "The docs site's Drops and Observe panels render again. Both read a catalog key that nothing had emitted since the bare `drops:`/`observe:` action keys were removed, so every action shipped without them and the panels stayed empty whatever the workflow declared. They are now filled from the live mechanism: `observe` from the `context_scope.observe` directive as written, and `drops` from the resolved output schema rather than from `context_scope.drop`, because the directive also names wildcards and fields that belong to nothing and the panel used to show those as dropped. One limitation remains, and it is older and wider than these panels: a field that reaches an action through a wildcard observe is never enumerated, so a drop aimed at one cannot be named — the same blindness already shortens the Outputs panel for those actions."
time: 2026-09-27T08:30:00Z
