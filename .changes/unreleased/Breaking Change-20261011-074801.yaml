kind: Breaking Change
body: >-
  A `BETWEEN` or `NOT BETWEEN` whose range is not two numbers or two strings is now refused
  when the condition is parsed, so pre-flight stops the run. A range written as one value, as
  a list that is not two values, with `NULL` or a boolean for an end, with ends of two types,
  or as a parenthesised clause (`x BETWEEN 50`, `x BETWEEN [1, 2, 3]`, `x BETWEEN [50, NULL]`,
  `x BETWEEN ["a", 5]`, `x BETWEEN (50 AND 100)`) used to be accepted in a guard and in an
  `expression` expectation, and never tested a range: it gave every record the same answer,
  or an answer decided by the types of its ends. In an `expression` expectation,
  an `a AND b` range whose ends are fields (`score BETWEEN low AND high`) was accepted and
  false for every record as well; it is now refused, and is written
  `score >= low AND score <= high`. A guard already refused a field on the right of a
  comparison. Because `x BETWEEN a AND b` is now read whole, an expression that follows a
  range held in a field with another condition, `score BETWEEN range AND y == 1`, is read as
  a range from `range` to `y` and refused: put the other condition first,
  `y == 1 AND score BETWEEN range`. A range written straight after `IS NULL` or `IS NOT NULL`,
  `x IS NULL BETWEEN 0 AND 1`, is refused too, where its list form was accepted and false for
  every record.
