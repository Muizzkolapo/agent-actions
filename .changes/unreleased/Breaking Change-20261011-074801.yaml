kind: Breaking Change
body: >-
  A `BETWEEN` or `NOT BETWEEN` that cannot test a range is now refused when the condition is
  parsed, so pre-flight stops the run. A range written as one value, or as a list that is not
  two values (`x BETWEEN 50`, `x BETWEEN [1, 2, 3]`), used to be accepted in a guard and in an
  `expression` expectation, and was false for every record. In an `expression` expectation,
  an `a AND b` range whose ends are fields (`score BETWEEN low AND high`) was accepted and
  false for every record as well; it is now refused, and is written
  `score >= low AND score <= high`. A guard already refused a field on the right of a
  comparison. Because `x BETWEEN a AND b` is now read whole, an expression that follows a
  range held in a field with another condition, `score BETWEEN range AND y == 1`, is read as
  a range from `range` to `y` and refused: put the other condition first,
  `y == 1 AND score BETWEEN range`.
