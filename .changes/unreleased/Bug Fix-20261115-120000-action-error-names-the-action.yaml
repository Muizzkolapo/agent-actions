kind: Bug Fix
body: "An error that carries the action it is about names that action on an `Action:` line, not as the agent. A missing, unset or empty API key and a failed version merge put the action name under the workflow's key, so the error printed the action as `Agent:`, and all but the unset variable also printed `Invalid configuration in agent '<action>'` as the title. Every error whose formatter keeps `action_name` now prints the `Action:` line: 26 raise sites pass it, and a schema validation error sets it. An error that names no action prints no `Action:` line, and the action typed to `agac inspect action`, `inspect context`, `batch status` or `batch retrieve` is not shown as the action an error is about. The `Invalid configuration` title omits the agent when no agent is known, instead of `agent 'unknown'`. Known limits: a missing required field error and a function-not-found error print no `Action:` line, because their formatters build their own context; their problem text still names the action. A template rendering error still names the action as the agent."
time: 2026-11-15T12:00:00Z
