kind: Under the Hood
body: >-
  Every stamp writer records each part of an action's config stamp, so a stamp that lacks
  one (the model, the config digest, or a digest of the context scope, dependencies,
  generation settings, tool/guard code, schema options, output settings or provider
  endpoint) names that part as edited. An action without `schema_options` stamps an empty
  options digest, so options added to it are named as an edit.
  When a run deletes what an action stores for an input that is gone, it also deletes that
  file's batch state: its batch registry entries, context map, recorded inputs and
  recovery state. A file whose batch is still owed keeps that state, with a warning, for a
  collect pass to read.
