kind: Bug Fix
body: >-
  A batch run whose every record is already done now writes its file for that run's
  inputs, as online does every run. Such a run sent nothing and collected nothing, so the
  file kept rows for records that had left it: a record removed from a file kept its row
  there, a record moved to another file was answered there and still held in the old one,
  so the actions below read it twice, and a staged file emptied before an edit kept every
  old answer. This is met on resuming a run that died, and on running again after an edit
  that resets the action. The run now drops the rows of records that are no longer inputs,
  writes an emptied input's file empty, and keeps the rows of records a record limit holds
  back, since they are still inputs. A file nothing left is not written again, unless it
  holds two rows under one `source_guid`: it is then written with one of them, as online
  writes it. `agac retry` writes nothing over a file it names no record of. A record that
  leaves a file while that file's batch is out still keeps its row.
