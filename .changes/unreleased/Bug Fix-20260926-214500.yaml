kind: Bug Fix
body: "A staged file the filesystem would not describe was dropped from the walk with no exception, no error record and no log line, so the action completed as though the file had never been staged. `Path.is_file()` answers `False` for `ENOENT`, `ENOTDIR`, `EBADF` and `ELOOP`, which made a dangling symlink indistinguishable from a directory; it re-raises the rest, so a permission failure was never silent but escaped from the middle of a walk with no file attached. Both filesystem walks now ask through one predicate that lets the error out: the deliberate exclusions are answered first, so a dotfile or a filtered suffix is still skipped silently, and only a file that would have been processed is reported — named, with its errno, with the action's record count taken out of service, and counted as *found*, so a walk that lost every entry fails loudly instead of completing green and empty. A mixed staging directory holding one unreadable file now completes with partial output and an unknown count where it previously aborted the action."
