kind: Bug Fix
body: "A `json_mode: false` action now works in batch mode. The batch clients parse every text answer as JSON, and the expectation loop checks the answer against the action's schema before anything wrapped it, so a plain-text action failed every repair round. An answer that is JSON text arrived as that object, and other text as a bare string, where the schema expects the text under `output_field`. The answer text now goes under `output_field`, as online's `call_non_json` does, before the check, in the first collection and in the retry and repair rounds. Structured content with no text is unchanged."
time: 2026-11-15T17:30:00Z
