kind: Bug Fix
body: 'With enable_prompt_caching on, an Anthropic request now puts one cache_control mark on a static prompt, and never on the record content. Anthropic writes a cache entry at each mark, at 1.25 times the input price for the 5-minute cache, and a later request reads it only when the full prefix up to that mark is the same; its prompt-caching guide says to mark the last block that is the same across requests and not text that changes per request (https://platform.claude.com/docs/en/build-with-claude/prompt-caching). Before, the batch path marked the system prompt and each record''s message, and the online path marked its one user message, which held the instruction and the record together. Now the record''s message is sent unmarked in batch, and online sends the instruction and the record as two text blocks with the same text as before. The prompt is sent with no mark when it reads record data (a name it does not bind other than version, workflow, loop or a version param, or a seed key other than by a constant key with no select_by while any seed key has select_by), when it calls dispatch_task directly or through a rendered seed or version value, when it uses the random filter or the lipsum global, when the schema calls dispatch_task, on a repair call or a batch repair round, and on an expectation judge call, whose prompt holds the record''s output. agac inspect now warns once for each Anthropic action with enable_prompt_caching on, and once for all versions of an action, when its prompt or schema keeps it from being cached, and names each reason in one message. With caching off, requests do not change.'
