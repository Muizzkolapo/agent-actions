kind: Enhancement or New Feature
body: 'Retrieval from an earlier action: `context_scope.retrieve` takes `from: <action>`, so each record searches what that action wrote for the other records (duplicate tickets, consistent labels, related parts of a document). The entry names the output fields to search with `text`, and optionally `title` and `id`; the record itself is never a match, so each record gets `top_k` matches (the step knows the record by its `source_guid`, so below a step that splits records a record can match the record it came from). The corpus is each record the action processed in this run and earlier runs; the step indexes it once when it starts, under `agent_io/retrieve/<step>/`. A run that adds records says so once and keeps the earlier answers until `--rerun <step>`; changed or removed records warn. The load refuses a `from:` that is not upstream, a FILE tool, a versioned action, a router or a loop, and checks the fields against the action''s output schema. The sandbox starter template finds similar tickets in `classify` (`classify__similar`). See the Knowledge Bases and Retrieval guide.'
