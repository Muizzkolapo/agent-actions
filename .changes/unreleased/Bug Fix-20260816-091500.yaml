kind: Bug Fix
body: "FILE-granularity observed fields no longer overwrite each other or the namespaces they land beside. Each observed field is injected into a record as a bare top-level key, and that write was blind: a wildcard expansion could clobber an explicitly observed field (last writer wins, decided by ref order), and a field whose name matched a sibling namespace or a bus namespace (source/version/workflow/seed) replaced that namespace outright — which then stranded the namespace's own observed fields, since they no longer resolved against a dict. All of it was silent data loss on the bus handed to kind: tool and kind: hitl actions. Keys that could collide are now delivered namespace-qualified (ns.field) and announced. Qualification is decided from the observe refs alone, never the record values, so a given ref produces the same key on every record, batch and run: an explicit ref is qualified whenever a wildcard on another namespace could expand onto its name, and a field naming an observed or bus namespace is always qualified. Configs mixing a wildcard with a cross-namespace explicit ref will see that explicit ref arrive qualified — e.g. observe: [extract.*, classify.category] now delivers classify.category rather than category. The preflight check covers kind: hitl as well as kind: tool, resolves granularity the way the expander does (it compared against a lowercase literal the expander never emits, so it had never fired), and reports only what the action's payload will actually receive."
time: 2026-08-16T09:15:00Z
