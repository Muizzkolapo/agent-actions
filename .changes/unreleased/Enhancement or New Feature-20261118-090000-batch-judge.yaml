kind: Enhancement or New Feature
body: 'A `run_mode: batch` action''s `llm_judge` calls now go out as a batch of their own (`<file>_judge_<n>`) instead of online, one record at a time, after the batch returns. Each value is judged once whatever the number of records holding it, each vote is one request, and the verdicts are read as online reads them (a strict majority passes, a tie fails closed, an errored request fails the call), within the same `judge_budget`. A record the judge fails goes to the repair batch as before, and what the repair returns is judged by the next judge batch. A run stopped while a judge batch is out reads that batch on the next run and never sends it again. Set `expect.judge_mode: online` to keep a batch action''s judge calls online; `judge_mode: batch` on an online action is refused at preflight.'
