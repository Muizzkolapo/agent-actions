kind: Bug Fix
body: >-
  An action whose every record exhausted its retries now fails with the error the provider
  raised, not a bare count. The retry service kept the last error, but the record's error
  read only "Retry exhausted after N attempts" and the run's summary counted no cause for an
  exhausted record, so the run, `agac status` and `agac dispositions` showed "produced 0
  successful records … (Found N files but failed to process any.)" and nothing more. The
  error now leads the record's error, the action's failure and an `on_exhausted: raise` halt,
  and is kept as `_recovery.retry.last_error`. An error with no message is named by its type.
time: 2026-11-03T18:15:00Z
