kind: Bug Fix
body: >-
  A retry that does not resume a stopped one leaves it to be resumed. A retry with `--from`
  below where the stopped retry started is refused before anything goes back, naming the
  retry to run; it used to put the stopped retry's failures back, say "Nothing to retry",
  exit 0 and delete its record of that retry, so the next `agac retry` was refused and the
  rows a split had re-written stayed unanswered below it. A retry that puts the failures
  back and is then refused, such as one naming a record that did not fail, keeps that
  record too, so the next `agac retry` resumes the stopped one (#1524).
