kind: Bug Fix
body: >-
  An LLM action that observes a field nested about 1000 levels deep or more now runs on
  Python 3.11, online and in batch, and a prompt can render such a field with
  `| tojson`. Building the request used the recursive JSON codec and a recursive
  JSON-safety pass, which raised `RecursionError` at that depth and failed the action;
  each now handles any depth and gives ordinary records the same request text as before.
  A prompt that prints such a field with a bare `{{ }}` (Python's `str()`, which has its
  own recursion limit) fails that record with a reason naming the field, its depth and
  the limit, instead of failing the action with an empty "references undefined
  variables" message (1483).
time: 2026-10-17T16:30:00Z
