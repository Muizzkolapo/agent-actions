kind: Bug Fix
body: agac docs's catalog.json now sums each action's counts across every input file instead of keeping only the last file's, and counts a batch guard skip as skipped. Both the per-file summing and the guard-skip count now also work for batch, which previously had no file identity to key its events by at all.
