kind: Breaking Change
body: "A staging JSON file must hold a list of records. A file whose top level is a lone object was wrapped into a one-row list before the rule that refuses one could see it, so the same payload staged identically whether it was written as an object or as an array. It is now refused, and the refusal names the fix. To migrate, wrap the object in an array: a file holding `{...}` becomes `[{...}]`, which stages exactly the record it staged before, with the same identity. The refusal already named what it found; it now names what to do about it as well, on every input that reaches it. A staged document whose rows are not records, and one that is not rows at all, are reported as the shapes they are rather than as a missing field in the prompt that could not be built from them."
time: 2026-09-23T09:00:00Z
