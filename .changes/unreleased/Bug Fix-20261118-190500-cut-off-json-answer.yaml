kind: Bug Fix
body: "A JSON answer that the output limit cut off is no longer completed into a partial object. For OpenAI, Groq, Gemini and Ollama, online and in batch, and for Cohere online, no call read the finish reason in JSON mode, so JSON repair closed the half-written answer and the record was stored as a success with its last fields missing or shortened. Such an answer is now a parse error that names the stop reason, `The answer was cut off at the output limit (stop_reason=length); raise max_tokens`, with the text as the model wrote it under `raw_response`. The record fails with the reason `parse_error`, or `expect: {repair: auto}` regenerates it. Anthropic already refused a cut-off answer; its batch parse error now names the stop reason too. In text mode the cut-off text is stored as written, as before."
time: 2026-11-18T19:05:00Z
