kind: Bug Fix
body: "`agac dispositions` now shows what each action wrote beside what it consumed. A disposition is one row per input record per action, so an action that expands or collapses records has a disposition count that legitimately differs from the number of records it produced — a workflow step that fans one record out to five showed a single row, which read as four missing records. The summary gained a `Records` column carrying the number of records stored under the action, with a note naming the reasons the two differ, and the contract is now written down in the storage architecture reference and the `dispositions` command page: the children an action creates are accounted at the actions that consume them, not at the one that produced them, which is also why `retry` targets inputs."
time: 2026-08-31T16:45:00Z
