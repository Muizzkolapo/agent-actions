kind: Breaking Change
body: >-
  A workflow file now fails to load where a tag needs a name that has no value at load,
  instead of rendering it as nothing or as false. Outside a prompt, a name nothing defines,
  used other than through `is defined` or `default(...)`, fails the load naming it:
  `{{ workflow_name }}`, `{% if enable_validation %}` with no `{% set enable_validation %}`,
  or `{{ cfg.missing }}` for a field a variable lacks; guarded uses such as
  `{% if debug is defined and debug %}` or `{{ model | default('gpt-4o-mini') }}` load as
  before, and so does the top level of a `templates/` file, which runs once as the folder
  loads. An inline prompt whose names the load all knows renders at load as before, and one
  using a name nothing supplies (`Write about {{ topic }}.`) fails the load, or each record
  when it also reads a record's names, instead of sending "Write about .". A name a record or a version supplies (`source`, an action of the
  workflow, `version`, `i`) read anywhere the load renders also fails the load: in a value
  other than a prompt, in a `{% set %}` block, macro or `caller()` body that a prompt uses,
  or tested with `is defined`, which used to be decided false for every record; wrap such a
  tag in `{% raw %}` to hand it to the prompt as text. A prompt that reads a record's names
  is sent as the same prompt in the prompt store is, under that render's `trim_blocks` and
  `lstrip_blocks` whitespace rules; it can use a macro, `load_prompt` or an imported
  template only in a `{{ }}` tag of its own outside its `{% %}` blocks, and cannot
  `{% include %}` anything, or the load fails naming it. A versioned action's other values that read a version variable render once
  per version, and fail the load on an action without versions unless guarded. The
  templates page listed `workflow_name`, `env` and `now` as built-in variables of a workflow
  file; none existed, and the page now says which names the load supplies.
