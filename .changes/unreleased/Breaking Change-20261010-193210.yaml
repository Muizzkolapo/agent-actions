kind: Breaking Change
body: >-
  A workflow file that names something nothing defines outside a prompt now fails to load,
  naming it, instead of rendering it as nothing. `{{ workflow_name }}`, `{% if
  enable_validation %}` with no `{% set enable_validation %}`, or a bare `{{ topic }}` in a
  value other than a prompt used to load as an empty string or a false condition, and a
  missing field of a variable the file sets (`{{ cfg.missing }}`) did the same. In an inline
  prompt such a name is left for the record and now fails each record at run time ("Template
  for 'write' references undefined variables: topic"), where `Write about {{ topic }}.` used
  to be sent as "Write about .". The templates page listed `workflow_name`, `env` and `now`
  as built-in variables of a workflow file; none existed, and the page now says which names
  the load supplies.
time: 2026-10-10T19:32:10Z
