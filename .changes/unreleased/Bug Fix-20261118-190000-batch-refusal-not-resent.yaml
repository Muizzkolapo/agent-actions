kind: Bug Fix
body: "A batch action with a `retry:` block no longer sends a refused answer again. An OpenAI or Groq batch line that holds a refusal was read as a failed request with no HTTP status, which a retry resends: the refusal was paid for up to `max_attempts` times and its record ended EXHAUSTED. The line is now read as what it is, an answer with no content, and the record ends as it does online. In text mode it fails at once with `The model refused to answer: <reason>`. In JSON mode it is stored with that reason as its parse error, as the online call stores it. The same holds for a message with no content and no refusal, which now fails with `Empty response content from <vendor> API (stop_reason=<reason>)` where batch said `Batch processing failed`, and for an Anthropic batch message that holds only a thinking block, which a retry resent unless the output limit cut it off. A text answer the limit cut off before its first character is still sent again, as online retries it. The tokens of such a line are now counted; a failed line reported none."
time: 2026-11-18T19:00:00Z
