kind: Bug Fix
body: "Documentation that still described `reprompt:` has been brought back to what the code does. Two of the corrections would have cost a reader real time: the shipped `agac` agent skill taught a `reprompt:` block that a project carrying it is refused for at config load, and eight `expect:` snippets across the context-scope and output-validation reference pages used `max_attempts:`, which `ExpectConfig` forbids. The event catalogue listed three recovery events that do not exist, the batch-recovery page documented a metadata shape that was replaced, and eight example READMEs listed a `tools/shared/reprompt_validations.py` that is not shipped with any example. Also removed: three uncollected test scripts that fail on import because the mechanism they exercised is gone, and `llm/batch/services/resubmission.py`, whose only reason to exist was keeping the reprompt and repair rounds in step."
time: 2026-09-07T17:15:00Z
