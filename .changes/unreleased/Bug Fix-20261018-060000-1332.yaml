kind: Bug Fix
body: >-
  An edit to a completed action's `context_scope` (observe, passthrough, drop or seed) or
  `dependencies` now runs it again on the next `agac run`, with every action reading it, and
  the run logs what changed, for example `context scope changed for recap, resetting to
  pending`. It used to report the action `already complete` and keep answers produced under
  what it read before. An action stopped partway likewise answers everything again after such
  an edit instead of keeping the records it had finished, and `agac retry` leaves the edit to
  the next run, as it does for a prompt edit. Reordering or repeating the entries of an
  observe, passthrough or drop list is not an edit. The two are stamped as digests of their
  own beside `config_hash`, which is unchanged, so upgrading runs nothing again; an action
  completed before the upgrade starts noticing these edits once it next runs to completion.
  (#1332)
time: 2026-10-18T06:00:00Z
