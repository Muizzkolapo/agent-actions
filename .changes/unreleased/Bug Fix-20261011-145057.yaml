kind: Bug Fix
body: A guard that compares a field to a string containing and, or, not, in, is, like, between, null or contains now parses. A naive pre-check split the raw clause on those words with no regard for quotes or parentheses, refusing valid guards such as `source.title == "rock and roll"`, `(s.x == 5 OR s.done)`, and every function call (`LENGTH(extract.items) > 2`) with a misleading "Invalid field names detected" that named no field. The check is removed; the real grammar already enforces the same field-name shape. `LENGTH`, `UPPER`, `LOWER` and `TRIM` can now take a field argument, not only a literal, and are documented on the guards page; they are not available in an `expression` expectation's condition. A guard naming an unregistered function, or the wrong number of arguments, is now refused before any run starts, rather than silently becoming a no-op at the first record.
