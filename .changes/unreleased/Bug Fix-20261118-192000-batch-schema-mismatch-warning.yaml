kind: Bug Fix
body: 'A batch answer that does not match its action''s schema is reported with the `Schema validation warning for ''<action>''` log line an online call writes; batch stored it without a word. The answer is stored as before, since an `expect:` block is what enforces a schema. A record whose schema a `dispatch_task(...)` chose is checked against that schema.'
time: 2026-11-18T19:20:00Z
