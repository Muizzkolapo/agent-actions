kind: Breaking Change
body: A change to a first stage's staged input no longer answers every record again. Adding, removing or changing a staged file used to reset that action and every action reading it, as `--fresh` would for them. Now the records the change left alone keep their answers; a record added, or one whose content changed (a new record), is answered; and a record no staged file holds any more leaves nothing behind — its rows, its dispositions (a failure included, so `agac retry` no longer offers it) and its checkpoints go at that action and at every action reading it, once a run has read every staged file (not under a file limit, after a file failed to read, or under `agac retry`). An edit met beside the change is named as for a config edit. Use `agac run --rerun <action>` to answer every record again.
time: 2026-11-01T18:00:00Z
