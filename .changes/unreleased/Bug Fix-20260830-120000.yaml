kind: Bug Fix
body: "A retry recovery batch that reaches a terminal failure at the provider (FAILED or CANCELLED) now counts as a spent attempt instead of resetting the counter. Previously such a batch superseded nothing, so the next pass re-read the parent from scratch, wrote a fresh recovery state with `retry_attempt: 1`, and submitted another paid provider batch — every pass, forever, with `on_exhausted: raise` never firing. The dead recovery is now processed in its own right: it delivered no results, so the existing recovery handler advances the attempt counter and either resubmits the missing records as the next attempt or, at `max_attempts`, applies the `on_exhausted` policy — `raise` halts the action with a node-level failure disposition, `return_last` finalizes with exhausted tombstones. The same applies to a recovery batch cancelled at the provider. For local testing, the Ollama failure-injection seam gained `OLLAMA_FAIL_BATCH_NAMES`, which makes matching batches die terminally at the provider."
