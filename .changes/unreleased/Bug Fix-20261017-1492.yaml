kind: Bug Fix
body: >-
  The dag-fit pre-flight warning now names every required output field a tool's code does
  not return, even when an upstream action's schema requires a field of the same name. A
  tool's output is validated exactly as its UDF returns it: upstream fields reach the tool
  as input, and `context_scope.passthrough` fields are added beside its output after it is
  checked, so neither supplies the field. A FILE tool returning a literal `FileUDFResult`
  without `id` below an action that requires `id` used to pass pre-flight in silence and
  then fail every record; `agac inspect`, `run` and `retry` now warn, naming the action,
  the field and the tool. The warning stays a warning. Fields inside an optional object the
  tool does not return are no longer reported, since runtime never checks them, and the
  fix text no longer suggests marking the field required upstream (1492).
