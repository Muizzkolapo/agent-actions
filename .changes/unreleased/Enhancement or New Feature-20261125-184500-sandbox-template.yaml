kind: Enhancement or New Feature
body: "`agac init <name> --template sandbox` creates a small starter project from the package: one workflow, `support_desk`, that uses each feature once (a tool action, a guard, `expect:` with `repair: auto` and an `llm_judge` rule, versions and their merge, a loop, a router and a join, a HITL action and a batch action), with staged input, seed data, a `sandbox.yml` whose faults heal and a `sandbox_expected.yml`. It names `model_vendor: openai`, so it is also a start for real runs. `agac sandbox check -w <workflow>` runs a workflow as `agac run --sandbox --fresh --wait` in the same process and compares the result with `sandbox_expected.<workflow>.yml`, else `sandbox_expected.yml` (or `--expected <path>`): the exit code of the run, the counts of the `SANDBOX scenario` line, and per action its status and record counts as `agac dispositions --json` gives them. It prints one row per stated value and exits 0 when each holds, 1 with the rows that do not hold or when the run wrote no result (the check reads only what its own run wrote, so an earlier run's output never passes), 2 when the file is missing or not valid or the check could not run, and 130 when interrupted; an unknown key, an action entry with no value and an action that the workflow does not have are refused by name. It takes `--scenario`, `-u` and `-e`, and clears and writes only the sandbox output. The starter project passes its check in about 4 seconds and is the end-to-end smoke test of the framework. The name of a loop now holds the schema of its `result`, with its required fields, as documented: before, it got the schema of a join, so a prompt that read the loop's name got a warning that the field is not guaranteed. A workflow that observes a field the loop's result does not declare now fails at load (`Field '<x>' not found in action '<loop>' output schema`) instead of warning; it failed at runtime before. The loop's name takes the fields of its result but not its `expectations`, which read the names of the last iteration. A built-in tool action (a router, a join, a loop's name) is no longer held to return the required fields of its schema."
