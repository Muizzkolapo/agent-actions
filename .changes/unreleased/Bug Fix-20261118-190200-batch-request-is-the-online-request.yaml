kind: Bug Fix
body: 'A batch request now carries the messages the online request carries for the same prompt, record, schema and `json_mode`. Batch sent the prompt as a system prompt and the record as the user message for every vendor, whatever online sent: Anthropic online sends one tagged user message and no system prompt; Groq one system message, with its JSON rule or its instructions template; OpenAI one tagged user message in text mode; Gemini the tagged prompt with the schema and its rule. A repair round''s feedback now lands where online puts it. With `enable_prompt_caching`, the Anthropic cache mark sits on the same text in both modes, and a repair prompt that does not begin with the action''s prompt is left unmarked, as online. A batched `llm_judge` request is the online judge request. The prompts of batch actions change with this, so their answers can change and a prompt cache starts again; a repair round sent after the upgrade for a batch sent before it does not read that batch''s cache entry.'
