kind: Enhancement or New Feature
body: 'A workflow can include a shared branch file with an entry `- include: <name>` in `actions:`. The load reads `branches/<name>.yml` at the project root and puts the branch actions in place of the entry, with their own names. The branch file declares `inputs` (actions of the workflow that it reads, each bound under `inputs:` to the action of the same name) and `outputs` (the only branch actions that the workflow can read). It is plain YAML, names its prompts from a prompt store, and cannot include another branch. The load refuses a missing branch file, an unknown include key, an unbound or renamed input, a name that the workflow and a branch both define, a read of a branch action that is not an output, a branch read outside the branch and its inputs, and a branch file that breaks its own rules. Each refusal names the workflow file; a refusal about a branch file or a branch action also names the branch file and the action. `agac run` and `agac inspect` show that text, with the workflow file on a `File:` line and the action on an `Action:` line. The one exception is a dependency cycle through a branch: it is refused as every dependency cycle is, names the branch file of each branch action in it, and does not name the workflow file. An `expect` block inherited from the defaults counts as a read, a branch can read the versions of an input it declares, and `schema_name:` loads in a branch as it does inline. Each included action carries its origin in `_include` in the rendered workflow, which does not change its config hash or its stamps; a hand-written `_include` is refused. `agac docs` on a workflow that has not run loads it as a run does: it lists the branch actions in place of the include entry, and leaves out with a warning a workflow that the load refuses; and the editor treats the outputs of an included branch as actions of the workflow.'
