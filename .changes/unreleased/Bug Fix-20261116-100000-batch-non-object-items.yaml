kind: Bug Fix
body: 'A batch JSON action whose answer is a list of non-object items, such as `["a", "b"]` or prose that json_repair turns into a list, stores each item as `{"value": item}`, as online does. Batch emptied each item to `{}` and stored the records as successes with no content.'
