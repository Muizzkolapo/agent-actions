kind: Breaking Change
body: "`primary_dependency` is no longer a key an action takes. It was declared on the action and checked at load to name an action of the workflow, but it never reached the running action, and the one thing it could have changed, which dependency of a fan-in is called the input and which the context, is read as one list by everything that runs: every dependency's records reach the action whichever is listed first. An action that sets it is now refused at load like any other unknown key and must drop it. `agac inspect --json` no longer carries `has_primary_dependency` and `primary_dependency` for each action; both always read false and null."
time: 2026-10-13T21:00:00Z
