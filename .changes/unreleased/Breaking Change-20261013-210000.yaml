kind: Breaking Change
body: "`primary_dependency` is no longer a key an action takes. It was declared on the action and checked at load to name an action of the workflow, but a value written on an action never reached the running action, and the one thing it could have changed, which dependency of a fan-in is called the input and which the context, is read as one list by everything that runs: every dependency's records reach the action whichever is listed first. An action that sets it is now refused at load like any other unknown key and must drop it. Written under `default_agent_config:` in `agent_actions.yml`, which takes any key, it did reach every action: there it relabelled the input and context of each fan-in in `agac inspect`, could change which of two actions at the same level ran first, and failed the load of every fan-in when it named something that was not one of its dependencies. It is now read nowhere, so the key there does nothing."
time: 2026-10-13T21:00:00Z
