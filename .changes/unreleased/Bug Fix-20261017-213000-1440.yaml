kind: Bug Fix
body: >-
  A fan-in that reads a splitting action and an action that splits that action's
  records again now pairs each record of the second split with the first split's
  record it came from and with the other branches' record for their source. With
  the second split listed before the first in the fan-in's dependencies, it ran
  once per record of the first split with the second split's fields empty and every
  record of the second split dropped, and the run reported success; listed after,
  it failed saying the two branches each split the source on their own. (#1440)
time: 2026-10-17T21:30:00Z
