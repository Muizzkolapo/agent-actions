kind: Bug Fix
body: >-
  A version merge no longer strands versions answered from another path. Correlation ids
  were minted from the workflow's absolute config path, so a version answered again from
  another checkout, worktree or mount (a `--rerun`, a retry, a resumed run) took other ids
  than the versions it kept, and the merge held each record in halves short of a version.
  Ids now derive from the workflow's name. Ids stored by an earlier release took the path in
  too: a merge meeting a record whose versions carry different ids warns, naming the records
  and `agac run --rerun <version base>`, which answers every version under one id.
time: 2026-11-03T18:00:00Z
