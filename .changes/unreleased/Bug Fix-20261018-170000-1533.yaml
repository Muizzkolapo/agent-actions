kind: Bug Fix
body: >-
  A YAML, CSV or text seed file (`context_scope.seed: {lookup: $file:rubric.yaml}`)
  passes pre-flight and runs. Pre-flight parsed every seed file as JSON and stopped
  `agac run` with "failed to parse: Expecting value", although the docs show
  `$file:rubric.yaml` and the run reads YAML, CSV and text. Pre-flight now parses a
  seed file, plain or one file of a `select_by` map, with the parser the run uses, so
  the two cannot disagree; a malformed file is refused with its own format's error,
  and a missing field in a YAML seed is reported as one in a JSON seed is. A seed CSV
  saved with a UTF-8 byte order mark no longer carries the mark in its first column's
  name, and a quoted cell keeps a `\r\n` line break as written. (#1533)
time: 2026-10-18T17:00:00Z
