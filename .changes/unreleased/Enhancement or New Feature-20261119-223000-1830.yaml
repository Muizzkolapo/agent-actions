kind: Enhancement or New Feature
body: '`agac dispositions --json` and `agac status --json` print one JSON document on stdout, so a script no longer reads the table. `dispositions --json` lists every action with a `counts` object that always holds every count (`success`, `failed_checks`, `failed`, `exhausted`, `guard_skipped`, `unprocessed`, `passthrough`, `filtered`, `skipped`, `deferred`; 0 where none), its `total`, its `records` and its action-level state. The sum of `failed` and `exhausted` for an action is the `Records to retry` that `agac retry --dry-run` shows from that action. `status --json` gives each action its `name`, `status` and `error`, and a `run_status` of `SUCCESS`, `FAILED` or `PAUSED`, the status a run ends with for those actions. Keys are added in later releases, never renamed or removed. `--json` does not take `--quarantined`. A workflow that has not run now reads `No action status is stored for workflow ...` in `agac status`. (#1830)'
