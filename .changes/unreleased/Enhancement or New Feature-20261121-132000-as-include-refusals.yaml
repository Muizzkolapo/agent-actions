kind: Enhancement or New Feature
body: 'Inside an include with `as:`, a prompt that reads a short name is told that it reads a short name, with the final name to write. A branch action that reads a bound workflow action by its workflow name, not through its input, is refused. A removal refusal names the include as `Include ''<branch>'' as ''<instance>''` and the reader by its short name.'
