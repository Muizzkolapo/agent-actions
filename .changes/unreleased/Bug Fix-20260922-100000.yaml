kind: Bug Fix
body: "A JSON input file holding a single object rather than a list is now staged like every other first-stage record: the payload is namespaced under content.source and the record carries an identity, its ancestry and its node. Such a record was previously built by hand with none of those, so the source save dropped it before the store's own identity check could refuse it. The input row never entered the store, nothing keyed on identity could reach it — a record limit deciding which stored rows to spare, a named retry, carry-forward — and for a document holding a bare value the submitted prompt's source namespace carried the batch's own identifiers in place of the user's content. Batch and online now derive the same identity for the same payload."
time: 2026-09-22T10:00:00Z
