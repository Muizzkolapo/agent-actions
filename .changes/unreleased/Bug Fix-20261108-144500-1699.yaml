kind: Bug Fix
body: >-
  agac clean (in every mode, whenever it finds something to remove) and the skills'
  reset_workflow.py --full take the workflow's run lock before they ask or delete anything,
  with or without a store folder, and exit 1 while a run or retry is in progress, removing
  nothing. They hold it until they finish, so a run started while clean waits at its prompt
  is refused. They never delete the lock file: clean --all leaves the store folder holding
  only the empty lock file. Before, clean --all deleted the store folder with the lock file
  in it, so a second run then passed the lock check.
time: 2026-11-08T14:45:00Z
