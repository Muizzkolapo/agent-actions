kind: Bug Fix
body: >-
  A RECORD-granularity action now resolves a record's `source` namespace by identity before
  reading the namespace the record carries, which is the order the FILE-mode resolver already
  used. A record can carry a `source` namespace in its own content and also have an entry in
  the source pool under its `source_guid`, and the two resolvers disagreed about which one
  wins: the same record therefore resolved to a different source document depending on the
  granularity of whichever action read it, with nothing in the config saying so. The pool is
  the run's current source set, while the namespace a record carries is a copy taken when the
  record was written, so identity is the authoritative answer where it resolves — the reading
  the FILE-mode resolver already took, and the one consistent with a record whose `source_guid`
  misses a multi-record pool being skipped rather than given another record's document. A
  record the pool cannot place is unaffected: own `source_guid`, then the carried
  `parent_source_guid`, then the namespace the record carries, which is all such a record has.
  This governs what the prompt and the observe/passthrough output fields see. It does not
  reach a guard condition: the guard evaluator promotes `item["content"]` over the resolved
  context, so a RECORD-mode guard still reads the namespace the record carries while a
  FILE-mode guard reads the resolved one, because the FILE path writes the resolved namespace
  back onto the record before the guard runs. That split predates this change and is unchanged
  by it.
  Two kinds of record change what they observe. One is a record that carries a `source`
  namespace and also resolves in the pool, where the two hold different values; it now
  observes the pool's. Measured across the eleven stores of this repo's sample project, no
  stored record meeting both conditions holds a namespace differing from its pool entry, so
  the case is reached mainly on a resumed run whose staging data changed underneath it —
  note that those stores have at most one staged path each and none uses a FILE-mode `drop`
  on a `source` field, so they do not exercise every way the two can diverge. The other is a
  record whose `source` key holds something that is not a namespace — a scalar, `None` or a
  list. Such a record was returned as its own source document on the strength of the key
  alone, and the namespace builder then fell through to exposing that record's other content,
  its upstream actions' output, under `source.*`, where a prompt asking for `source.<field>`
  could be answered from the record's own earlier output. It now resolves by identity, or to
  nothing when identity cannot place it either. No record in those eleven stores holds a
  non-dict under `content.source`, and the only two writers of that key both write an
  already-resolved dict, so the shape is hard to produce deliberately. An empty `source`
  namespace still satisfies the type check and still answers for the record at the resolver,
  though the namespace builder drops an empty namespace, so none reaches the prompt either
  way.
  One consequence is worth stating on its own, because it moves in the direction of disclosure
  rather than away from it. A `drop` on a `source` field rewrites the namespace on the record
  the action passes forward, and the pool it was resolved from keeps the field. Reading
  identity first means a later resolution of that same record returns the pool's copy, so a
  dropped `source` field that the record no longer carries comes back. FILE mode already
  behaved this way, which is why the change is a widening of an existing gap rather than a new
  one, and the gap itself is that a drop does not survive re-resolution at all — see the issue
  filed for it. A workflow relying on `drop` to keep a `source` field out of a later action's
  context should not, on any granularity, until that is fixed.
  Also, where one `source_guid` appears twice in the source pool — which a repair can produce,
  because it concatenates every staged path while the store's uniqueness holds only per path —
  both resolvers now take the first row. The FILE-mode index kept the last while the
  RECORD-mode scan took the first. Stored values are unaffected either way: a `source_guid` is
  a content hash of the payload, so two pool rows sharing one hold the same payload; the change
  removes a divergence between the two readers rather than altering what either returns today.
  What still differs between the granularities is confined to cases where neither resolves a
  namespace and to the shape of the pool row. Where nothing resolves, FILE mode skips the
  record and writes a disposition while RECORD mode proceeds with no `source` namespace and
  writes none, because that reason string has only ever been written on the FILE-mode path.
  And for a flat pool row with no `content` envelope, which legacy and foreign stores hold and
  which this repo's sample project has one of, the FILE-mode path strips the record-keeping
  keys and the RECORD-mode path offers them as document fields; reading identity first newly
  routes a namespace-carrying record onto that path in RECORD mode, so the difference now
  reaches records it did not before. Aligning it is not safe in passing, because the exclusion
  list holds names a user's own document can use — a staged row with a `metadata` field is in
  this repo's own parity fixture — so aligning it discards user fields. Both are filed rather
  than fixed here. Counted across every combination of carried shape (a namespace, a scalar,
  `None`, a list, an empty namespace, or no key at all) and pool state (a hit on the record's
  own guid, a hit through its parent, a miss, an empty pool, and the pool being the input set),
  holding the pool row enveloped, the two granularities disagreed on 25 of 30 combinations
  before this change and 14 after; the eleven closed are every case where a namespace resolves
  at all, plus the empty-pool case where the record carries `None`. No combination disagrees
  now that agreed before.
