kind: Bug Fix
body: "A RECORD-granularity action now resolves a record's `source` namespace by identity before reading the namespace the record carries, which is the order the FILE-mode resolver already used. A record can carry a `source` namespace in its own content and also have an entry in the source pool under its `source_guid`, and the two resolvers disagreed about which one wins: the same record therefore resolved to a different source document depending on the granularity of whichever action read it, with nothing in the config saying so. The pool is the run's current source set, while the namespace a record carries is a copy taken when the record was written, so identity is the authoritative answer where it resolves — the reading the FILE-mode resolver already took, and the one consistent with a record whose `source_guid` misses a multi-record pool being skipped rather than given another record's document. Nothing changes for a record the pool cannot place: own `source_guid`, then the carried `parent_source_guid`, then the namespace the record carries, which is all such a record has. The visible change is confined to a RECORD-mode action reading a record that carries a `source` namespace *and* resolves in the pool, where the two hold different values. Measured across the eleven stores of this repo's sample project, every stored record meeting both conditions carries a namespace identical to its pool entry, which is what the writers guarantee: a record's namespace was copied from that same entry. The case is therefore reachable mainly on a resumed run whose staging data changed underneath it, where the action now observes the current document rather than the older copy. Three narrower corrections come with it, each of which the precedence change would otherwise have left reachable. The carried value must be a namespace: it was accepted on the strength of the `source` key alone, so a record whose `source` held a scalar, `None` or a list was returned as its own source document, and the namespace builder then fell through to exposing that record's *other* content — its upstream actions' output — under `source.*`, where a prompt asking for `source.<field>` could be answered from the record's own earlier output. A pool hit that is the record being resolved is now ignored: a workflow with no staging data of its own resolves against its input records, so a record matches itself by guid, and returning it there would bypass the namespace check and publish the record's own output as its source. Where one `source_guid` appears twice in the pool — which a repair can produce, because it concatenates every staged path, and the store's uniqueness holds only per path — both resolvers now take the first row; the FILE-mode index previously kept the last while the RECORD-mode scan took the first, so the two granularities could pick different rows for the same record. One divergence is deliberately left alone: for a flat pool row with no `content` envelope, which legacy and foreign stores hold, the FILE-mode path strips the record-keeping keys and the RECORD-mode path does not. Neither is safe to adopt wholesale, because the exclusion list holds names a user's own document can use — a staged row with a `metadata` field is in this repo's own parity fixture — so aligning them either discards user fields or offers framework keys as document fields, and which one is correct is a decision rather than a fix."
