kind: Bug Fix
body: "A RECORD-granularity action now resolves a record's `source` namespace by identity before reading the namespace the record carries, which is the order the FILE-mode resolver already used. A record can carry a `source` namespace in its own content and also have an entry in the source pool under its `source_guid`, and the two resolvers disagreed about which one wins: the same record therefore resolved to a different source document depending on the granularity of whichever action read it, with nothing in the config saying so. The pool is the run's current source set, while the namespace a record carries is a copy taken when the record was written, so identity is the authoritative answer where it resolves — the reading the FILE-mode resolver already took, and the one consistent with a record whose `source_guid` misses a multi-record pool being skipped rather than given another record's document. Nothing changes for a record the pool cannot place: own `source_guid`, then the carried `parent_source_guid`, then the namespace the record carries, which is all such a record has. The visible change is confined to a RECORD-mode action reading a record that carries a `source` namespace *and* resolves in the pool, where the two hold different values — within a single run they do not, because the record's namespace was copied from that same pool entry, so this is reachable mainly on a resumed run whose staging data changed underneath it. Such an action now observes the current document rather than the older copy. The carried namespace must also be a namespace: it was accepted on the strength of the `source` key alone, so a record whose `source` held a scalar, `None` or a list was returned as its own source document, and the namespace builder then fell through to exposing that record's *other* content — its upstream actions' output — under `source.*`. A prompt asking for `source.<field>` could be answered from the record's own earlier output, and a field that happened to share a name resolved to the wrong value rather than failing. Such a record now resolves by identity, or to nothing when identity cannot place it either. No shipped example produces a non-dict `source` namespace — `source` is a reserved action name and first-stage records nest the user payload one level down — so this half is a latent case the precedence fix would otherwise have left reachable."
