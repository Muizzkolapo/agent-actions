kind: Bug Fix
body: "A RECORD-granularity action now resolves a record's `source` namespace by identity before reading the namespace the record carries, which is the order the FILE-mode resolver already used. A record can carry a `source` namespace in its own content and also have an entry in the source pool under its `source_guid`, and the two resolvers disagreed about which one wins: the same record therefore resolved to a different source document depending on the granularity of whichever action read it, with nothing in the config saying so. The pool is the run's current source set, while the namespace a record carries is a copy taken when the record was written, so identity is the authoritative answer where it resolves — the reading the FILE-mode resolver already took, and the one consistent with a record whose `source_guid` misses a multi-record pool being skipped rather than given another record's document. A record the pool cannot place is unaffected: own `source_guid`, then the carried `parent_source_guid`, then the namespace the record carries, which is all such a record has. Two kinds of record change what they observe. One is a record that carries a `source` namespace and also resolves in the pool, where the two hold different values; it now observes the pool's. Measured across the eleven stores of this repo's sample project, no stored record meeting both conditions holds a namespace differing from its pool entry, so the case is reached mainly on a resumed run whose staging data changed underneath it — note that those stores each have a single staged path and none uses a FILE-mode `drop` on a `source` field, so they do not exercise every way the two can diverge. The other is a record whose `source` key holds something that is not a namespace — a scalar, `None` or a list. Such a record was returned as its own source document on the strength of the key alone, and the namespace builder then fell through to exposing that record's *other* content, its upstream actions' output, under `source.*`, where a prompt asking for `source.<field>` could be answered from the record's own earlier output. It now resolves by identity, or to nothing when identity cannot place it either, which is a change for a record that previously resolved to something. An empty `source` namespace is still a namespace and still answers for the record. Separately, where one `source_guid` appears twice in the pool — which a repair can produce, because it concatenates every staged path while the store's uniqueness holds only per path — the three places that index that pool now agree on which row wins. Both source resolvers and the lineage enricher take the first; the FILE-mode index and the enricher previously kept the last while the RECORD-mode scan took the first, so one record's source namespace and its lineage could be attributed to different rows. What remains differs only where neither granularity resolves a namespace at all. There FILE mode skips the record and writes a `source_unresolved` or `observe_field_missing` disposition, while RECORD mode proceeds with no `source` namespace and no disposition, because that reason string has only ever been written on the FILE-mode path; and where the pool is the action's own input set, RECORD mode additionally offers the record's own content, which is what "the input data IS the source" means for a workflow with no staging data of its own. Neither is created here and neither is safe to align in passing: the second is intended for cross-workflow records, and aligning the stripping of record-keeping keys that goes with it would discard user fields, because the exclusion list holds names a user's own document can use — a staged row with a `metadata` field is in this repo's own parity fixture. Both are decisions to record rather than fixes to slip in. Counted across every combination of carried shape (a namespace, a scalar, `None`, a list, an empty namespace, or no key at all) and pool state (a hit on the record's own guid, a hit through its parent, a miss, an empty pool, and the pool being the input set), the two granularities disagreed on 25 of 30 before this change and 15 after, the ten closed being every case where a namespace resolves at all, and no combination disagrees now that agreed before."
