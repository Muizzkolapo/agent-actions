kind: Enhancement or New Feature
body: 'An include entry takes `override:`, `remove:` and `defaults:`. `override:` maps a branch action to action keys whose values replace the branch values whole, `context_scope` and `expect` included; `null` removes a key, so the action takes it from the defaults. `remove:` lists branch actions that this include leaves out. `defaults:` sets defaults for the actions of this include only: the order, lowest first, is the project `default_agent_config`, the workflow `defaults:`, the include `defaults:`, the branch action, then `override:`. The include defaults are not copied onto the actions, so a tool still runs online under a `run_mode: batch` default and an LLM action still sets aside a `granularity: file` default; `context_scope`, `expect` and `vendor_params` merge key by key and the chunk settings name by name, as they do for workflow defaults. The load refuses an override or removal that names no branch action (with the nearest name), an override key that is not an action field (with the nearest field), an override of `name`, an override that leaves an invalid action (naming the field), one action under both `override` and `remove`, a removal that a remaining branch action still reads (naming every reader), a removal of an output that the workflow or another include reads, and a `defaults:` block that a workflow `defaults:` block would refuse or that sets `data_source`. An overridden read is checked again against the branch boundary, and an override changes the config hash and the stamps exactly as the same value written inline does; the include defaults change neither beyond the values they give. `as:` is still refused as not supported yet.'
