kind: Breaking Change
body: >-
  The store's payload columns are compressed, as prompt traces are: `target_data.data`,
  `source_data.data`, `checkpoint_output.record_data` and
  `record_disposition.input_snapshot` are zlib blobs, each compressed against a
  dictionary made from the first value its action wrote, so `sqlite3` shows them as
  blobs and `json_each`/`json_extract` over them no longer work. Read them with the new
  `agac records -w <workflow>` (`-a <action>`, `--source-guid`, `--file`, `--field
  <path>`; `--snapshots` for the input each failed record was processed with). Rows
  written before this stay as text and read back as before; `action_name`,
  `relative_path`, `record_count`, `disposition` and `reason` are unchanged, so metadata
  queries still work. A row that cannot be decoded stops the resume or retry that reads
  it with an error naming the table, action and row, rather than reading as empty; a
  walk that meets one counts the file as lost, as it did a corrupt text row.
  The storage format version is now 3: an older agent-actions refuses to read a store
  this version has written to, with a message to upgrade, rather than misreading it.
  (#1546)
time: 2026-10-24T12:00:00Z
