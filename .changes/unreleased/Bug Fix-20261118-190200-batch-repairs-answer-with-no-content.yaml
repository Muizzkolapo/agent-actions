kind: Bug Fix
body: "Under `expect:` with a repair policy, a batch now regenerates an answer that came back with no content, as the online loop does. Online, a JSON-mode answer that is empty, refused or blocked is a parse-error record, which the schema gate rejects and the loop regenerates with the `structural:` mode. Batch treated every result with no content as a provider failure and never regenerated it. A batch line the provider answered with no answer in it is now the same parse-error record, so it is regenerated exactly when the suite rejects it, with the prompt the online loop sends. A request that failed (an HTTP error, an expired or canceled request) is still not regenerated and keeps its error, and so is a text-mode answer that was refused or cut off, which online fails before any expectation runs."
time: 2026-11-18T19:02:00Z
