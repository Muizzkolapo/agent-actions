kind: Enhancement or New Feature
body: 'An include entry takes `as: <instance>`, so one branch file can be included more than once. Each branch action is named `<instance>__<name>`, and inside the instance each short name means the action of the same instance or the action an input binds: the load renames the short names in `dependencies`, the `observe`, `passthrough` and `drop` lists of `context_scope`, the guard clause (only the action at the start of a field path; quoted text, numbers and keywords stay as written; a UDF guard is left alone), `version_consumption.source`, the `context` of inline `llm_judge` rules, and the same keys in the include''s `defaults:` and `override:`. A version keeps its suffix (`vote_1` becomes `c2__vote_1`) and a trailing `?` is kept. Under `as:`, an input can be bound to any action, so two instances can read different actions and one instance can read an output of another. Each instance''s name map is written to `_include.names` in the rendered workflow. The load and `agac inspect` refuse an instance name that breaks the action-name rule, two includes with one instance name (an include without `as:` has its branch name), a short name that is also an action of the workflow (except an input bound to the action of its own name), and a read inside an instance of a name that the branch does not define and no input binds. The editor resolves an output of an instance by its prefixed name. An include without `as:` loads as before; only the refusal of one branch included twice now says to give each include its own name with `as:`, and the list of include keys in a refusal names `as`.'
