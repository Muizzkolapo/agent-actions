kind: Bug Fix
body: >-
  `on_empty` written on an action now decides what an empty answer does. The key never
  reached the action, so `on_empty: error` and `on_empty: skip` both behaved as `warn`:
  the empty record was marked failed and the run went on, with no halt and no tombstone.
  It now does what it says online and in a batch, and it can also be set for every action
  under the workflow's `defaults:`, which refused it as an unknown key. An `on_empty`
  in the project's `default_agent_config:` was applied, but over the action's own; an
  action's `on_empty` now wins over it, as it does over `defaults:`. A value there other
  than `warn`, `error` or `skip`, such as a misspelling, was taken as `skip` by some
  actions and as `warn` by others; it is now refused when the workflow loads, unless the
  action sets its own. If your workflows set `on_empty: error`, an empty answer now fails
  the action where it was a failed record before.
