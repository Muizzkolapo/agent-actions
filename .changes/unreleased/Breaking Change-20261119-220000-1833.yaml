kind: Breaking Change
body: 'The exit code of `agac run` and `agac retry` now tells how the command ended: 0 success, 1 failed (as before), 3 finished with failed or exhausted records, 4 paused for a batch. A paused run and a run that finished with failed or exhausted records exited 0 before; they now exit 4 and 3, so a script that stops on any non-zero code must accept 4 after it submits a batch. The code is read from the action statuses, not from the printed sentence, and the run names the actions that hold the failed records. New `agac run --wait [--poll SECONDS] [--wait-timeout SECONDS]` runs the workflow again while a batch is open, as a second `agac run` does, and exits with the code of the final status; at the timeout it exits 4, names the actions still waiting and says how to resume.'
time: 2026-11-19T22:00:00+00:00
