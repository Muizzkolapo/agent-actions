kind: Bug Fix
body: 'An action no longer reads every earlier action''s output before it runs. Each action read every stored file of every action before it, on the thread that drives the run, and held them until it finished, though nothing used them: at a late step of a long workflow that was every record of every earlier action, for each action of the step. The storage walk now checks every input file before it processes any, as before, then reads one upstream file when it processes it and lets it go before the next, from the store''s cache too. A version merge reads its versions the same way. Each batch file''s preparation logs its time, records and the peak memory of the run, and each step''s StepCompleteEvent carries that peak as peak_rss_mb. On a synthetic run with 16 earlier actions and 600 records, the batch step''s peak memory fell from 3.3 GB to 0.8 GB.'
