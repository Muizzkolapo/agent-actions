kind: Bug Fix
body: 'An Ollama action in `run_mode: batch` sends its records from the Agent Actions process, `batch_max_workers` at a time (1-32, default 1; the `OLLAMA_BATCH_MAX_WORKERS` environment variable when no action or default sets it), where an online action uses `record_concurrency`. The setting was documented only among the internal defaults; the configuration reference, the defaults reference and a new "Ollama batch" section of the run modes page now say which setting applies where. `record_concurrency` written on an `ollama_local` or `ollama_cloud` batch action was refused with "a batch action''s records run at the provider"; the refusal now says the records are sent from this process and names `batch_max_workers`. A bad `OLLAMA_BATCH_MAX_WORKERS` value was reported as `batch_max_workers=<value>`; the warning now names the variable. The request timeout section said `request_timeout` does not apply to the in-process Ollama batch; it does, and the page now says so.'
time: 2026-11-18T19:30:00Z
