kind: Under the Hood
body: 'A model call an action makes besides its main one is now a side call (`agent_actions.llm.side_calls`), run the way the action''s run mode says whatever feature asks for it: online it runs at once, in `run_mode: batch` it is held and sent with the step''s other held calls as a batch of its own. The `llm_judge` is the first requester and no longer has a mechanism of its own; its batches are still named `<file>_judge_<n>`, `expect.judge_mode` still chooses how the judge is sent, and its verdicts, cache, budget and resume are unchanged. A batch run''s registry and recovery state now record a judge batch as a side batch of kind `judge`. Every side batch holds at most the requests and the bytes the provider takes in one batch; the calls past either limit go out in the next round.'
