kind: Bug Fix
body: >-
  A `context_scope` key that is present but null no longer crashes the static analyser with
  `AttributeError: 'NoneType' object has no attribute 'items'`. `AgentConfig` permits the
  value, and the reference extractor read it with a `{}` default, which does not help when
  the key is there and the value is null — so the whole config went down, taking the
  references the analyser had already found with it.

  Null and absent both mean no directives, so they are now read alike, which lets the
  existing "action has no context_scope" check report it with its own hint instead. That is
  the idiom five other call sites already use for this key.

  Two sibling sites in the schema extractor raised the same error on the same input and are
  fixed with it: the methods that infer an input schema from `context_scope` and that apply
  its directives to an output schema both called `.get` on the value directly. A sweep of
  every read of the key found fifteen further sites, all already safe — by an `isinstance`
  check, an `if not context_scope` guard, or a receiver typed to accept `None`.

  Not reachable through the `actions:` config shape, where an empty `context_scope:` already
  produced a clean error. It needed the legacy `agents:` shape, which `get_user_agents`
  returns verbatim without `ActionConfig` or the expander, or a direct caller of the
  extractor.
time: 2026-10-01T12:00:00Z
