kind: Bug Fix
body: >-
  A batch retry or repair round is now prepared the way the first submission was.
  The first submission gave its task preparator the action's version and the run's
  `workflow` metadata. A retry round had the version but no workflow metadata, and a
  repair round had neither, so a prompt reading `workflow.*` (or `version.*` on a
  repair round) could not render and a guard reading them could not be evaluated.
  A retried record whose prompt read `workflow.*` was dropped as unrendered while the
  action read complete; on a repair round the collect pass failed the action, and every
  later run paused on the same finished batch and failed again. The prompt traces of
  those rounds were written with a NULL `run_id`. One builder now serves both rounds,
  and the collecting run's metadata is carried from the executor through the collect
  pass to every round, so `workflow.run_id` is the id of the run that collects the
  batch.
time: 2026-10-16T12:00:00Z
