kind: Enhancement or New Feature
body: "The bundled skills teach the sandbox. `agac-agent-skills` has the rule \"Test offline first\", `agac run --sandbox` in its run commands and beside `record_limit`, sandbox triggers in its description (sandbox, offline, mock, scenario, sandbox.yml, stub, chaos, testing a workflow without an API key), and `references/sandbox-testing.md`: when to run a sandbox run, the commands, what is mocked and what is real, the `sandbox.yml` scenario with an example of each key (tool `stub` included), the presets and when `chaos` completes, how to read the results, testing recipes and the limits. `agac-operations` rehearses a large run with `agac run --sandbox --scenario chaos --wait`, and `references/recovery.md` scripts the faults of one recovery (`errors` with `heal_on_attempt`, then `agac retry --sandbox`; `batch.drop_rate` and `batch.fail`). `scripts/run_health.py --sandbox` checks the output counts of sandbox runs: it runs `agac dispositions --json --sandbox` and reads `agent_io/sandbox/.agent_status.json`. `agac-expectations` tests the rules and the repair loop in a sandbox run (`break_rules` with `heal_on_attempt`, `judge.pass_rate`) and says that a sandbox verdict calibrates nothing. `agac-blind-verification` reads the rendered verifier prompts of a sandbox run. The editor setup guide says that the LSP does not check `sandbox.yml` and that `agac inspect -w <workflow> --sandbox` checks it."
time: 2026-11-25T12:00:00Z
