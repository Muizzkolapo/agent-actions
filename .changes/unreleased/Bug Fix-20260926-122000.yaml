kind: Bug Fix
body: "A FILE tool that declares an output's provenance as an empty list — `source_index: []` — is now refused with a message naming the output and both valid forms, instead of raising `IndexError` from inside the framework. `source_index` says which input produced a row: an integer, a list of integers for a many-to-one output, or `None` when no single input produced it. `FileUDFResult` checked that the key was present and of an allowed type, but not that a list held anything, so an empty one passed validation and reached the reconciliation step, which resolves the first contributor by indexing the list directly. A tool that computes its contributor list — filtering, deduping, dropping records that failed a check — and lands on empty for one output therefore got a stack trace from framework internals rather than either a result or an error it could act on. The refusal is at the point the outputs are constructed, where the other output validation already lives and where the message can name the offending output index; the empty list is refused rather than read as `None`, because a contributor list that came out empty is as likely to be a filter that dropped everything as a row the tool meant to invent, and `None` already exists to say the latter. No working behaviour changes: the same input failed before, only less legibly."
