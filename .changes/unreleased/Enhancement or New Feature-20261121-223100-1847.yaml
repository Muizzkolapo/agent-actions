kind: Enhancement or New Feature
body: 'A record of a JSON, CSV, TSV or Excel file whose prompt is too large can now be split instead of failing. `chunk_config: {field: source.<name>}` on the first action, or in the workflow''s `defaults:`, splits that one field of each staged record into parts with `chunk_size`, `chunk_overlap` and `split_method`, as a text file is split. Each part is a record of its own: it keeps every other field of the record and gets `chunk_index` (from 0) and `chunk_count`. A record whose field fits, is empty or is missing becomes one part. The load refuses a `field` that does not name one top-level field, and refuses it in the project''s `default_agent_config:`; a record whose field is not text, or that already holds `chunk_index` or `chunk_count`, stops the file before any record is stored or sent. Without `field`, records are staged as before.'
