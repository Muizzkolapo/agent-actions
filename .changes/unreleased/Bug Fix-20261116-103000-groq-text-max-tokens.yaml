kind: Bug Fix
body: "An online Groq call with `json_mode: false` no longer sends `max_tokens: 1000` when the action sets no `max_tokens`. A long text answer was cut off at 1,000 tokens with no warning, while JSON mode and batch send no limit. `max_tokens` is now sent only when it is set, in all three."
