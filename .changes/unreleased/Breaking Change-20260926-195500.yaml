kind: Breaking Change
body: "`agac retry` now exits 1 when the workflow it re-ran finished with a failed action, and names the failed and skipped actions instead of printing `Retry complete.`. It previously exited 0 in that case. A script, CI job or loop that treats a non-zero retry as an error will now see one where it saw success before; nothing that succeeds changes. Retry already classified the finished workflow exactly as `run` does — complete, terminal with a failed action, or paused — and recorded that status against the run, but then returned success whatever the answer was, so a repair that fixed nothing was indistinguishable from one that worked to every caller except a human reading stdout. Retry is the command most likely to run unattended, which is where the missing signal cost the most. What counts as failure is unchanged and is the same as `run`: a record that failed inside an action that still completed leaves the action `completed_with_failures`, which both commands call success; a failed action is the non-zero case. One divergence in the classification is closed at the same time. Retry called a workflow with actions still pending and no batch in flight FAILED, where `run` calls it PAUSED; that was invisible while retry ignored its own answer, and would have become an exit-code difference between the two commands the moment it stopped. Both now decide the three outcomes identically."
