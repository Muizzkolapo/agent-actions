kind: Bug Fix
body: "A FILE-granularity tool that folds N inputs into fewer outputs no longer tombstones the contributors it kept. `FileUDFResult(outputs=[{\"source_index\": [0, 1, 2, ...]}])` is the documented shape for a many-to-one collapse, but the missing-record safety net decided which inputs were accounted for by reading the output records' source_guid — and a collapsed output inherits only its first contributor's guid, so the rest read as dropped and were tombstoned `tool_missing_record`. Those tombstones were emitted as real output records carrying `_state: failed`, so a collapse of ten records into one file produced one real result and nine synthetic failures, with record_count reporting ten. The check now also walks the source_mapping that reconcile_outputs already builds, which is the only place the remaining contributors survive. The change can retire a false tombstone but never create one: a contributor named by no output is still caught, and 1:1 tools are unaffected."
time: 2026-08-29T11:00:00Z
