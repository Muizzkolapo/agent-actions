kind: Bug Fix
body: 'Seven example tools in book_catalog_enrichment and product_listing_enrichment read an observed or passed-through field bare instead of under the producing action''s name, so every run silently fell to defaults and still reported success -- wrong BISAC codes, no catalog search results, blank catalog entries, a quality filter that rejected everything, flat-$100 competitor pricing, a blank final product identity, and a brand-in-title compliance check that could never fire. Fixed, with two config fixes where a field had been declared under context_scope.passthrough from an action never itself observed, which does not deliver it. examples/book_catalog_enrichment/tools/book_catalog_enrichment/validate_description.py (never wired into the workflow) and examples/contract_reviewer''s README/config mismatch are left for #1405.'
time: 2026-10-11T19:15:29.756203+01:00
