kind: Bug Fix
body: "A staging directory the walk cannot open no longer loses every file beneath it in silence. `Path.rglob` swallows the `OSError` that `scandir` raises for such a directory: the directory entry comes back, so the per-entry regular-file check answers correctly and the existing loss path never fires, while every file under it is dropped with no exception, no log line and no error row. Since #1021/#1027 a completed action stamps how many records it processed and a later record limit at or above that count is read as one that could not have changed the record set, so files lost this way were never counted while the count still read as known — the action was skipped on the next run and its short output vouched for. Permission is normally set on a directory rather than on each file, so this is the common shape of the loss, not an exotic one. Both staging walks now enumerate with `os.walk`, which reports the failure with the directory that caused it. Such a directory is counted as one file found and never as one processed, is named in the action's error list and logged at error, and takes the action's record count out of service: an action left with nothing else readable now fails with a `DependencyError` naming the directory instead of completing as though its input were empty, and one that read the rest reports and gives up its count rather than vouching for a run short by an unknown amount. The tool scanner carried a comment claiming `rglob` raises here, and a handler that could therefore never fire; it now uses the same walk and warns when a tool directory cannot be listed, which previously surfaced only as a much later \"function not found\"."
