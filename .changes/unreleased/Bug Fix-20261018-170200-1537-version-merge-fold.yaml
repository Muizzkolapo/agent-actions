kind: Bug Fix
body: >-
  A record one version of a versioned `granularity: File` tool folds into another
  record's row (`source_index: [a, b]`), while another version keeps it, is left
  `unprocessed` at the version merge (`version_consumption`) with reason
  `consumed_into_another_record`, as at a fan-in (#1523). The merge correlates versions
  without the fan-in's merge, so it ran `b` without the folding version's output: a tool
  ran it half empty and exited 0, and a model action failed it on a missing template
  variable. Its tombstone names the row it went into as `metadata.consumed_into`, the run
  logs a warning, and `agac dispositions` counts it under Unprocessed, online and batch.
  (#1537)
time: 2026-10-18T17:02:00Z
