kind: Bug Fix
body: 'An inline schema field such as `rows: "array[object:[''q'', ''n'']]"`, whose item fields are not a mapping, now stops `agac inspect` and `agac run` with "Inline schema field ''rows'' gives its object fields as a list, not a mapping of field names to types", and a hint that shows the mapping form. Before, the error was "''list'' object has no attribute ''items''". The same applies to a string or a number in place of the mapping.'
time: 2026-11-14T20:45:00Z
