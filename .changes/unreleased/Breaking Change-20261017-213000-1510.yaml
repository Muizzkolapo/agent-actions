kind: Breaking Change
body: >-
  Pre-flight now refuses more RECORD tools that return a record without a required output
  field. A tool returning its dict as `[out]` is read like one returning `out`; a key removed
  with `del out["key"]`, `out.pop("key")` or `out.clear()` no longer counts as returned; and a
  dict bound twice, `out = {...}` then `out = {...}`, holds only the second literal's keys.
  Each of these used to pass pre-flight and then fail at run time the records that lacked the
  field. The refusal names the field and the line that sets it in a branch, removes it or
  re-binds the dict without it. Make the field optional in the schema, or set it on every path
  in the tool. (#1510)
time: 2026-10-17T21:30:00Z
