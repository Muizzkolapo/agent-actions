kind: Bug Fix
body: "A Gemini answer with no text now ends its record the same way online and in batch, and says why. A prompt that Gemini blocked fails with `Gemini blocked the prompt (blockReason=SAFETY)`; neither path reported the block reason, online stored the record as a success with an empty string in text mode, and batch failed it with `No candidates in response`. An answer that stopped for a reason other than the model's own, such as `SAFETY`, fails with `Empty response content from Gemini API (stop_reason=SAFETY)`. A text answer cut off at `MAX_TOKENS` before its first character is retried online and is now sent again by a batch `retry:`, which failed it at once. A text answer the model ended with nothing in it goes to the action's `on_empty` on both paths: online stored it as a success holding an empty string, and batch failed it with `No content in response`. In JSON mode each of these is a parse-error record that holds the same reason, where online said only `Empty response from API`. The batch client also reads an answer's text as the online client does, joining its text parts and leaving thoughts out; it read the first part alone, which is a thought when the model thinks first."
