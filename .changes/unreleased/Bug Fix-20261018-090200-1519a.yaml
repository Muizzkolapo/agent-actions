kind: Bug Fix
body: >-
  A retry stopped after an action that splits records wrote, but before the actions below
  it ran, is resumed by the next `agac retry` without leaving those actions holding what
  they held for the rows the split replaced. The resumed retry re-ran the split over the
  rows the stopped one wrote, so it never saw the original rows go: the action below kept
  the repaired record's tombstone (or the rows it built on the replaced split rows) beside
  the new answers, warned that rows "cannot be attributed", read complete, and the next
  `agac run` left it so. A retry now keeps what it notes below each split in
  `agent_io/store/<workflow>/_retry_repair_notes.json` beside its record of the failures,
  and the retry resuming it takes those rows out of every action the stopped one never
  completed. (#1519)
time: 2026-10-18T09:02:00Z
