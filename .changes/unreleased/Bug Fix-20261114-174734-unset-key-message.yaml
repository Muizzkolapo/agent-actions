kind: Bug Fix
body: '`agac run` with the API key variable unset no longer says "Authentication Error: Invalid Openai API key" (or "Invalid Anthropic API key"). It now shows the pre-flight refusal, which names the variable: "API key environment variable ''OPENAI_API_KEY'' is not set (required by action ''summarize'', vendor ''openai'')", with the hint "Set the environment variable: export OPENAI_API_KEY=...". A key that the server refuses under `--verify-keys` still reads as invalid, and the refusal now keeps its own text: "API key for vendor ''openai'' is invalid: <the server''s answer>", with the hint "The openai API rejected the key. Check that it is not expired or revoked." With a `base_url`, the message adds "at <url>" after the vendor name, and the hint starts "The server at <url> rejected the key". The error formatters that match message words (authentication, model, function, file and network) no longer take a pre-flight refusal and replace its message and hint with their own.'
time: 2026-11-14T17:47:34Z
