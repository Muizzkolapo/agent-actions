kind: Bug Fix
body: >-
  Five retry fixes. A retry clears the checkpoint rows only of the records whose failures
  it clears: a record keeping its `success` keeps its checkpoint answer, so a retry
  resuming a halt carries what the halted action answered before the halt instead of
  asking for it again (1316), and a retry running a stopped action in full answers again
  a record answered after an edit replaced its stored file, as a plain run does, instead
  of serving the pre-edit row (1277). A record carried from its checkpoint is stored with
  the `_recovery` it earned, where before it was stored with `_recovery: null` (1320). A
  retry resuming a halt in full notes what the run found and answered for the records it
  cleared, so one in a file that fails during the resume is reported by that failure, and
  one a FILE tool answered with invented rows is not put back as failed (1329). A retry
  starting below a halted action, whose starting action is skipped because of it, names
  the halted action and `agac retry --from <halted>` instead of `agac run --fresh` (1317).
