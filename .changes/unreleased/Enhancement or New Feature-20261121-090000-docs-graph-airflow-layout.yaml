kind: Enhancement or New Feature
body: "The `agac docs` Graph tab is easier to read. Each action is now a compact box with its name, its model or tool function, its type and a chevron that opens its fields. Edges are dark right-angle lines, and stages are 50px apart (they were 240px). Click an action to trace it: its full upstream and downstream path turns green and the rest of the graph fades. Click empty canvas to clear the trace. Double-click an action to open its details panel; a single click no longer opens it. A workflow too large to read at full fit now opens on its first stage at a readable zoom. The fit button still shows the whole graph, and a new full-screen button shows the graph on the whole screen. The graph box now fits under the page header, so all of its controls can be seen, and on a wide screen it uses the full width of the page, not the narrower reading width of the text above it."
time: 2026-11-21T09:00:00Z
