kind: Bug Fix
body: >-
  The mock provider (`agac-provider`) keeps a generated value inside the `minimum`/`maximum`
  its schema declares, and a string inside its `minLength`/`maxLength`. Its field-name rules
  answered first, so an integer `score` declared 1 to 4 was drawn from 1 to 100. A declared bound now wins,
  and the value is drawn across the whole bound, on its `multipleOf` step when it has one. A
  string outside its length bound is padded or cut at a word boundary; a string with a declared
  `format` keeps its format. A field with no bound keeps the name rule.
time: 2026-11-07T11:00:00Z
