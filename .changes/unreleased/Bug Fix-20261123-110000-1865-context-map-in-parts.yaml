kind: Bug Fix
body: 'A batch''s context map is now stored in parts of about 4 MB, so submitting a batch no longer builds one string of it. The map keeps each submitted record''s input row, which collection rebuilds the output from, and was saved as one JSON string: a temporary copy about the size of the file''s input, the largest part of the batch step''s peak memory. Collection reads the same map as before. A map an earlier version saved whole still loads, so a batch submitted before an upgrade still collects; an earlier version cannot read a map this version saved. On a synthetic file of 925 records with 30 earlier actions, saving the map held at most 245 MB above its start before and 15 MB after.'
time: 2026-11-23T11:00:00Z
