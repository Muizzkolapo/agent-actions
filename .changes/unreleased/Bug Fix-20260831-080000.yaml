kind: Bug Fix
body: "Prompt traces can now be correlated with the records they belong to. `prompt_trace` held only the prepare-time `target_id`, an identifier minted afresh on every run, so it shared no key with `record_disposition` — the join between a record's outcome and the prompt that produced it returned nothing on every store measured. Traces now also record `source_guid`, the durable identity the disposition table keys on, and `run_id`, the run that wrote the row; existing stores gain both columns on open, and rows written earlier keep them `NULL`. Separately, a record produced by a 1-to-many expansion had its identifier re-minted after its prompt had already run, so the batch response update and the Data Explorer's trace attachment both matched nothing for it: every expansion trace kept a `NULL` response and showed no prompt. Both now reach the trace through the record's `parent_target_id`, and a record prompted in its own right always resolves to its own trace first. A response that finds no row to land on is logged instead of passing silently. Reprompt rounds now record which round they were, so a round no longer overwrites its predecessor — this was previously threaded through only one of the two reprompt paths. First actions also carry the run's `{{ workflow.name }}` and `{{ workflow.run_id }}`, which were unavailable to their prompts and left `run_id` empty on the traces they wrote. One known gap remains: an expansion's trace records the last child's output as its response, since children are written back individually."
time: 2026-08-31T08:00:00Z
