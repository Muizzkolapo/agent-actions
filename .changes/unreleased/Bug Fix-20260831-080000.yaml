kind: Bug Fix
body: "Prompt traces now carry the record's durable identity, so their responses and joins actually land. `prompt_trace` keyed everything on the prepare-time `target_id`, which is re-minted on every prepare — the disposition-to-trace join was always empty, batch expansion responses updated zero rows (every expansion trace kept NULL response_text), scan previews silently attached no `_trace` for expansion actions, and each reprompt round overwrote the attempt-0 prompt instead of accumulating. The table gains `source_guid` (the durable input identity, stamped when the prompt is written) and `run_id` (the workflow run that wrote the row); existing stores are migrated in place by the additive column pass on open. Response updates key on `source_guid` with newest-attempt-wins semantics — expansion children land on their parent's trace via `parent_source_guid` — and a response with no row to land on now logs a warning instead of passing silently. Scan previews join traces the same way, and reprompt rounds stamp their round number into `attempt`. `record_id` keeps holding the prepare-time `target_id` and is documented as such. Rows written before the migration keep NULL identity and no longer join anywhere, including the preview attachment that previously matched non-expansion legacy rows by `target_id`; new runs stamp identity on every row."
time: 2026-08-31T08:00:00Z
