kind: Bug Fix
body: "`agac dispositions`, `agac schema` and `agac retry` no longer destroy the state they were opened to read. `AgentWorkflow.__init__` ran its startup reset unconditionally, so each of these commands returned every failed action to PENDING and wiped its dispositions before doing any work. `agac retry` was the worst affected: it reads the disposition table after constructing the workflow, so against any fresh failure it reported \"No failed records ... Nothing to retry\" about rows its own constructor had just deleted — in both dry-run and real mode. The constructor now takes a read_only flag that suppresses both the fresh clear and the retryable reset, and the three commands request it; `agac run` is unchanged, where reset-before-execute is the intent. `agac inspect`, `agac status`, `agac preview`, `agac validate-udfs` and `agac list-udfs` were never affected — they do not construct an AgentWorkflow."
time: 2026-08-29T09:31:00Z
