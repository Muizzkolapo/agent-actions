kind: Bug Fix
body: "When every input file of an action fails to process, the error now names why. It previously read only \"Action 'X': Found N files but failed to process any. Check logs for details.\" — in the CLI summary, in the run status file, and in the node-level failed disposition that `agac dispositions` reports. The real causes were collected a few lines earlier and passed to the log summary, but never to the raised DependencyError, so a broken `impl:` reference or an undefined template variable was only discoverable by opening the log file. All three collectors (storage backend, merged upstreams, single directory) now return their per-file errors, and the raised error leads with them: the summary panel renders only the first 80 characters, so a cause appended after the counts would still not reach the reader. The full list is also attached to the exception context for the run tracker."
time: 2026-08-29T08:15:00Z
