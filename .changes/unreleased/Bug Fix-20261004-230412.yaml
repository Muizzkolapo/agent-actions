kind: Bug Fix
body: >-
  A batch action below another one now sends the retry its `retry:` block asks for. When a
  collect pass found records the provider had not returned, preparing their retry batch for
  an action with `dependencies` failed with "has dependencies [...] but agent_indices was
  not provided", logged as a failed retry submission. Nothing was sent, the lost records
  were stored `cascade_skipped` with the disposition `unprocessed` (`batch_not_returned`),
  and the action reported itself complete, so only actions with no dependencies were ever
  retried. A retry is now prepared with the workflow's actions, as the first submission
  is, and goes out with the prompt the record was first sent with, read from the same
  upstream answers; a retry of a retry goes out the same way.
time: 2026-10-04T23:04:12Z
