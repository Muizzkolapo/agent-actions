kind: Fixes
body: 'The MCP `traces` tool keeps the newest traces when it cuts a list, so an assistant reads the run it just made. A filtered rerun with `--wait` that pauses for a batch now says it waits for the batch, not to run another command, and the commands a paused retry or rerun names use `-w`.'
time: 2026-11-27T23:00:00.000000000+00:00
