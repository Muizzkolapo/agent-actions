kind: Under the Hood
body: >-
  JSON Schema validators are now checked and built once per distinct schema and reused, both for
  UDF output validation and for the per-field item and constraint checks on LLM output. Before,
  every record re-validated each schema against its meta-schema and built a fresh validator.
  Errors are chosen and worded exactly as before; a 15-field schema went from about 5 ms to
  0.1 ms per validated item.
time: 2026-11-22T10:00:11Z
