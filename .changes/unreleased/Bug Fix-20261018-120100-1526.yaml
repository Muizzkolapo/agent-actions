kind: Bug Fix
body: >-
  Pre-flight now reads an upstream action's namespace as the run stores it, for prompts and
  `context_scope` entries as it already did for guards. A prompt reading
  `produce.page_content`, where `produce` only observes or passes that field through, used to
  pass and then fail every record; an `observe` of it passed and sent the model a null for
  every record. Both are refused, and a field read where it is stored, such as `source.page_id`
  after a `passthrough: [source.page_id]`, still runs. A first-stage guard naming its own
  action, which filtered every record and exited 0, is refused as one further down already
  was. The guard literal-type, nullable-field, skip-observe and filter fan-in warnings now read
  the expanded guard's `clause` and `behavior`: the literal-type warning never fired, and the
  others took every guard for a filter. An action that does not exist is reported once, no
  longer also as an implicit dependency (1526).
time: 2026-10-18T12:01:00Z
