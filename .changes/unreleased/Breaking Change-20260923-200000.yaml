kind: Breaking Change
body: "The framework no longer writes `agent_io/source/`. A version-merge action used to leave a file there beside its output, holding four stub keys per row — `source_guid`, `id`, `lineage`, `node_id` — and nothing read it: an action's source records come from the store. It was not even well defined per action, because the path dropped the action directory and keyed only on the target's basename, so two merges onto same-named targets overwrote each other. If you have a script reading those files, read the store instead. An existing `agent_io/source/` directory is now orphaned; `agac clean --all` removes it. `agac clean` removed only that directory by default, so with nothing writing it the old default had nothing to remove and would have reported success over an empty list: a bare `agac clean -a <workflow>` now names the flags that do something and stops. `--target` removes generated output under `agent_io/target/` and `--all` is unchanged, still taking staging and the durable store with it. Scripts calling plain `clean` must pass `--target`. Three write paths that no caller reached go with it — `BatchSourceHandler` and the wiring that constructed it, `SourceDataLoader.save_source_data` with its interface declaration and async wrapper, and `FileWriter.write_source`; `SourceDataLoader.load_source_data` and the storage backend's own `write_source` are unaffected. Source items are saved to the store, so the two source-data events and the log line beside them now carry the relative path the items are stored under rather than a `.json` file that was never created. `agac clean --all` still removes an `agent_io/source/` left by an earlier release, so the orphan has a supported way out; `--target` leaves it alone."
time: 2026-09-23T20:00:00Z
