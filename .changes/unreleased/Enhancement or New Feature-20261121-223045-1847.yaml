kind: Enhancement or New Feature
body: 'A new `context_window` key (tokens, a whole number above 0) sets the window the prompt-size check measures a prompt against, on an action, in `defaults:` or in the project''s `default_agent_config:`. It has priority over the window agac knows for the model, applies online, in batch and to judge calls, and is not sent to the provider; a change to it keeps the answers an action holds. The table of known models now holds the current Claude models at the windows Anthropic documents: Claude Fable 5.2, Opus 5.5, Sonnet 5.5 and Haiku 5.5, and the other current Claude models, read 1,000,000 tokens, and Claude Haiku 4.5 reads 200,000. Before, `claude-haiku-5-5` and the other new models got the default of 128,000 tokens, and `claude-opus-4-6` and `claude-sonnet-4-6` got 200,000, so a prompt they read was refused before it was sent. A refused prompt now names the `context_window` setting.'
