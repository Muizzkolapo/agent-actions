kind: Enhancement or New Feature
body: 'A workflow can set any request parameter of its vendor with `vendor_params:`, in `defaults:` or on an action, for every provider: for example `thinking` (Anthropic), `reasoning_effort` (OpenAI), `thinking_config` (Gemini), or `think` and `options.num_ctx` (Ollama). Blocks merge key by key, an action''s over the defaults'' over the project''s. Preflight refuses a key the vendor''s request does not take, naming the valid keys, and a key agac sets itself. Batch requests carry the same parameters. In JSON mode an Anthropic request forces the schema tool unless thinking is on, and a request with a large `max_tokens` streams. A response that the output budget cut off before any answer now names its stop reason and is retried as a `ResponseTruncatedError`.'
