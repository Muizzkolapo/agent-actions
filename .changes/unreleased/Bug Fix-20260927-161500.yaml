kind: Bug Fix
body: "A source-pool row with no `content` envelope is refused rather than read, because reading one means guessing which of its keys belong to the user's document and which to the framework — and the two granularities guessed differently. Given the same row, a FILE-granularity action subtracted `_RECORD_METADATA_KEYS` and silently deleted a document field named `metadata`, `lineage`, `chunk_info`, `node_id` or `target_id`; a RECORD-granularity action subtracted nothing and offered `source_guid` to the model as a field of that document. Neither is recoverable from, and the boundary is information the row does not carry. #584 met the same question deriving record identity, where subtracting framework field names collapsed two rows whose user column was called `node_id`, and answered it by deleting the subtraction and putting the payload under `content.source`; the read path now follows, so a row without that envelope raises `DataValidationError` naming the row and the action. Nothing the framework writes produces such a row — every staging branch, batch and online, envelopes through one authority — so this surfaces a store written before that rule instead of losing data against it. Only the row actually read is checked, so an unreadable row elsewhere in the pool does not fail the records that resolve past it, and an enveloped row is unaffected whatever its fields are named."
