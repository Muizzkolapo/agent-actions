kind: Enhancement or New Feature
body: "A sandbox run follows a scenario: `sandbox.yml` at the project root, the `happy` or `chaos` preset, or the file that `--scenario` names on `agac run --sandbox` and `agac retry --sandbox`. `--scenario` without `--sandbox` is a usage error. The scenario is checked before any call, and each problem names the scenario file and the key; a `pin` field that the action's output schema does not declare, `pin` or `break_rules` on an action with no JSON output schema, and `judge` in a `records` entry are refused too. Per action, per record match and by default, a scenario makes the mock fail calls with a real provider's rate limit, timeout, server error, refusal, cut-off answer, empty answer or text that is not JSON (`errors`), break the action's expectation rules with the real check (`break_rules`), set fields (`pin`), set the judge pass rate (`judge.pass_rate`) and, online, wait (`latency_ms`); `heal_on_attempt` stops a fault from that attempt, so retry and repair pass. A `records` entry matches the record's whole input, a field the prompt prints included, and a version group's base name names each version under `actions`, `records` and `batch.fail`. Each decision is a hash of the seed, action, record input, attempt and decision, so a parallel run makes the decisions of a sequential run and two `--fresh` runs fault the same records, also below an expansion or a FILE tool. Each record's attempts at an action count on in the sandbox store, online and in a batch: a repair round, a retry, a later `--wait` pass and `agac retry --sandbox` are its next attempt; `--fresh` starts every count again and `--rerun` that action's. The mock batch provider makes the same decisions when it returns results, leaves out results (`batch.drop_rate`), fails the batches of the actions in `batch.fail`, and reports a batch in progress for its first `batch.polls_until_complete` status checks and until `batch.complete_after_seconds` passed; without such a scenario a mock batch completes at its first status check. A sandbox run and retry print one `SANDBOX scenario <name>: <n> errors, <m> rules broken, <k> batch results dropped` line after the result, counting every `--wait` pass. In a sandbox run a judge passes by default, and the mock batch provider answers a judge request with a verdict, as online. The mock batch provider reads no `AGAC_BATCH_*` variable and writes no `.agac/batch_attempts.json`, and the Ollama clients inject no failures."
