kind: Enhancement or New Feature
body: "A sandbox run follows a scenario: `sandbox.yml` at the project root, the `happy` or `chaos` preset, or the file that `--scenario` names on `agac run --sandbox` and `agac retry --sandbox`. `--scenario` without `--sandbox` is a usage error. The scenario is checked before any call, and each problem names the file and the key. Per action, per record match and by default, a scenario makes the mock fail calls with a real provider's rate limit, timeout, server error, refusal, cut-off answer, empty answer or text that is not JSON (`errors`), break the action's expectation rules with the real check (`break_rules`), set fields (`pin`), set the judge pass rate (`judge.pass_rate`) and wait (`latency_ms`); `heal_on_attempt` stops a fault from that attempt, so retry and repair pass. Each decision is a hash of the seed, action, record, attempt and decision, so a parallel run makes the decisions of a sequential run. The mock batch provider makes the same decisions when it returns results, leaves out results (`batch.drop_rate`), fails the batches of the actions in `batch.fail`, and waits `batch.polls_until_complete` status checks or `batch.complete_after_seconds`; without such a scenario a mock batch completes at its first status check. A sandbox run and retry print `SANDBOX scenario <name>: <n> errors, <m> rules broken, <k> batch results dropped` after the result. In a sandbox run a judge passes by default. The mock batch provider reads no `AGAC_BATCH_*` variable, and the Ollama clients inject no failures."
