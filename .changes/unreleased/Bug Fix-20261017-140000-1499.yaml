kind: Bug Fix
body: >-
  Under `run_mode: batch`, a prompt that fails on one record's data with no missing variable
  to blame, such as `{{ a // b }}` where `b` is 0, now stops the action wherever that record
  comes in the input, as online does, and nothing is sent. Batch stopped the action only when
  the record was among the first few its pre-flight renders; behind them it failed that record
  alone, sent the rest and reported the action complete with one failure. A configuration
  error raised while preparing a record behind the pre-flight's sample now stops the action
  too. A record lacking a field or variable it names still fails alone.
time: 2026-10-17T14:00:00Z
