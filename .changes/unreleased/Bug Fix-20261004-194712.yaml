kind: Bug Fix
body: >-
  A run in which the store fails to write one of an action's files, on a full disk or a
  database error, now fails the action instead of recording it complete. The failure was
  taken as that file's own, like an unreadable input: the run logged it, wrote the other
  files, recorded the action complete and exited 0, and a batch collect pass recorded it
  partly complete the same way. After an edit, that file still held the rows answered
  before it, so the action's readers ran on them and no later run asked for them again; on
  a first run the file was never stored, and never asked for again either. The run now
  fails the action with the store's error and exits 1, and the next run stores that file
  without asking again for the files it stored. An online run writes the other files
  first; a batch collect pass stops at that file, and a later run collects it and the
  files after it without sending any of them again. Anything else that keeps one file from
  being stored, such as a file name the store rejects, still costs only that file. An
  action an earlier version recorded complete this way keeps those rows until the
  workflow is run with `--fresh`.
