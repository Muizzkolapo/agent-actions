kind: Bug Fix
body: >-
  `agac retry` no longer completes an action that its last run left unfinished on the
  records it names alone. A retry answers the records it names at every action from its
  starting point and carries what each action already holds for the rest, so an action
  put back to pending by an edit to what it reads and then stopped while running again,
  stopped partway by an error, or added since the last run ended up complete holding old
  rows, or none, for every record that run had not reached, and the next `agac run` found
  nothing to do. A retry that names records now refuses, before it changes anything, while
  an action from its starting point is pending, running, interrupted, stopped while
  collecting a batch, or failed by anything but every record it was given failing, and
  says to run the workflow first; `--dry-run` reports the refusal instead. An action left
  unfinished by a retry that was itself interrupted is resumed by running `retry` again,
  as before, and an action halted by `on_exhausted: raise` is not refused. A failure
  recorded before this release cannot say whether every record failed, so a retry over
  one is refused until the workflow has run.
time: 2026-10-04T17:00:00Z
