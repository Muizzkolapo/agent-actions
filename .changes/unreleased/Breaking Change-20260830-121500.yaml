kind: Breaking Change
body: "Referencing a schema name that matches more than one file is now a hard error instead of a warning. Schema names must be globally unique (the loader's own contract), but a collision used to log a warning and silently pick the winner by alphabetical directory order — so an action could validate its output against an unrelated workflow's schema, the same class of risk as a duplicate action name, which already hard-fails. `SchemaLoader.load_schema` now raises `SchemaValidationError` naming every colliding path when the requested stem is ambiguous; `agac inspect` surfaces it as a preflight failure. Discovery itself stays lenient — the LSP indexer and docs scanner keep working, `agac docs` skips ambiguous names with a warning, and collisions among schemas nothing references warn without blocking. That warning now fires once per process instead of once per action. Projects with two same-named schema files that relied on the alphabetical pick must rename one of the files."
time: 2026-08-30T12:15:00Z
