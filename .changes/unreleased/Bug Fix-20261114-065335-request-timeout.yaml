kind: Bug Fix
body: An action without request_timeout now waits 600 seconds for each LLM request, with every vendor except a declared endpoint, which keeps its timeout_seconds. Before, Ollama and Gemini had no limit, Cohere waited 300 seconds, Groq 60 seconds, and OpenAI and Anthropic 600 seconds. The connect limit stays 5 seconds for OpenAI, Anthropic and Groq. An Anthropic request with no request_timeout and a very large max_tokens now goes out with a 600 second limit, because the SDK skips its "Streaming is required" check when a timeout is given; this already happened when request_timeout was set. In batch mode, Ollama now uses request_timeout for the first submission and for retry and repair rounds, with 600 seconds when unset. The Gemini batch client now waits 600 seconds. Both had no limit before.
