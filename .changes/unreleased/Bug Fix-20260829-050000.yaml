kind: Bug Fix
body: "An action whose records are all removed by a guard now reports the same way in batch as in online: SKIPPED, with skip_reason 'All records guard-filtered — no output produced', a skip line in the run summary, and downstream actions cascade-skipping. Batch previously reported it as a successful completion, indistinguishable from a run that produced real output. The cause was a missing signal rather than a mishandled one. The completion classifier derives SKIPPED from a node-level 'skipped' disposition whose only writer sits past the batch fork in workflow/pipeline.py, so a run_mode: batch LLM action never produced it; batch records a node-level 'passthrough' for its empty tombstone instead. The classifier now also reads that, gated on the action having written zero records, so a passthrough carrying real data is unaffected. That row is read and never rewritten, because the node-level disposition is single-valued and the row is the batch resume path's only marker. Alongside this, both batch completion paths now route a SKIPPED classification through the same handler online uses, where previously one returned COMPLETED before classifying at all and the other set the status without a skip reason, without an ActionSkipEvent and without recording the completion. The passthrough path also now reports the classified status rather than a hardcoded COMPLETED, so an action with some failed records is no longer flattened to a clean completion and one with all records failed is no longer reported as success."
time: 2026-08-29T05:00:00Z
