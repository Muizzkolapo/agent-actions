kind: Bug Fix
body: "An action whose records are all removed by a guard now resolves as SKIPPED with skip_reason=GUARD_FILTERED_ALL in batch mode, matching online. Two batch paths reached completion without ever classifying the action. The passthrough short-circuit in _handle_run_success returned COMPLETED before the classifier ran, so a node-level SKIPPED disposition was never consulted; classification now runs first and the passthrough branch handles only what the classifier calls complete. _resolve_batch_outcome, the path a finished batch actually takes, did classify but acted on the FAILED arm alone, so SKIPPED reached the caller with no skip_reason, no ActionSkipEvent and no completion tracking — the run summary counted the action as OK and downstream actions lost the cascade reason. It now routes SKIPPED through the same handler online uses. The passthrough path also no longer masks a total item-level failure, which it previously reported as a successful completion for the same reason."
time: 2026-08-29T05:00:00Z
