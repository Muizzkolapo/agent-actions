kind: Breaking Change
body: "AGAC_MAX_RECORDS is renamed AGAC_RECORD_LIMIT, so one record limit now has one name across the workflow config, the CLI and the environment. The retired name is rejected with an error naming its replacement rather than ignored: a run that believes it is capped and is not spends against a provider with no limit at all. A completed action now stores the limit that applied rather than the one its config asked for, which only new runs benefit from: an action completed by an earlier version under AGAC_MAX_RECORDS, or under --max-records with no configured limit, stored a value that cannot be told apart from a full run and is still skipped as complete. Re-run those once with --fresh."
time: 2026-09-19T09:00:00Z
