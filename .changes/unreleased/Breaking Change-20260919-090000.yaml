kind: Breaking Change
body: "AGAC_MAX_RECORDS is renamed AGAC_RECORD_LIMIT, so one record limit now has one name across the workflow config, the CLI and the environment. The retired name is rejected with an error naming its replacement rather than ignored: a run that believes it is capped and is not spends against a provider with no limit at all."
time: 2026-09-19T09:00:00Z
