kind: Breaking Change
body: "Retired config keys now fail as unknown keys. An action, a workflow's defaults, a versions block and default_agent_config give the same error for them that they give for any key they do not take, and the error no longer names a replacement. The keys are anthropic_version, constraints, enable_caching, ephemeral, idempotency_key, interceptors, max_execution_time, on_schema_mismatch, policy, reduce_key, reprompt, skip_condition, skip_if, version_mode, where_clause, mode in a versions block, depends_on (use dependencies) and the loose overlap key (use chunk_overlap). default_agent_config in agent_actions.yml now refuses a key that a workflow's defaults block does not take, and the error lists the valid keys. AGAC_MAX_RECORDS is not read: the record limit comes from AGAC_RECORD_LIMIT."
time: 2026-11-23T12:00:00+00:00
