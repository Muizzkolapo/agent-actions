kind: Under the Hood
body: >-
  A batch output that grows every run now says so. Below an expansion, an action that
  answers an input with a single row records no producer — `is_expansion` is
  `len(structured_items) > 1` — so its stored rows carry the previous run's upstream child
  identity, match nothing this run produced, and are kept beside their replacements: two
  extra rows per run with no signal. The accumulation is not stopped, deliberately.
  Inferring that an absent identity is a replaced generation is what #1151 forbids, because
  an input that is merely absent — unstaged, filtered upstream, dropped by a limit — looks
  identical, and deleting its rows would be data loss. So the row is still carried and the
  condition is named instead, with a count and the issue number, the same answer
  `carried_past_repair` already gives for its own unresolvable case. The ordinary carries
  stay silent: a row whose input is still present, a row with a producer to attribute it
  by, and a run that recorded no input at all report nothing.
