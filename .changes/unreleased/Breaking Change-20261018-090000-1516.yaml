kind: Breaking Change
body: >-
  Pre-flight now refuses a guard that names an action not in the workflow, or a field its
  upstream action's schema does not list. This includes a field the upstream only observes or
  passes through, and a version action's base name, such as
  `vote.vote` where the records carry `vote_1` and `vote_2`. Such a guard used to pass, filter
  every record (or keep every one under `IS NULL`), and report success. Correct the action or
  field name the refusal points to. Read an observed field from the action that produced it.
  For a version action, name the branch to read, such as
  `vote_1.vote` (#1516).
time: 2026-10-18T09:00:00Z
