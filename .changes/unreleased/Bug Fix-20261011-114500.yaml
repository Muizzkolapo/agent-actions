kind: Bug Fix
body: >-
  A batch action that holds answers no longer shows "passthrough: All records tombstoned"
  as its action-level state. When every record left in one input file was guard-skipped,
  filtered, blocked by the action above or failed to prepare, the run wrote that file
  itself and a node-level `passthrough` row for the whole action, whatever its other files
  held, and nothing cleared it while the action held rows, so `agac dispositions` printed
  it under "Action-level state" for an action that read `completed` with its other
  records answered. The row is now cleared when the action completes holding rows, as the
  node-level skip already was, and stays where the action holds nothing, which is the
  marker a resumed run reads.
time: 2026-10-11T11:45:00Z
