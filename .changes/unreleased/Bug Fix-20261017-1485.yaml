kind: Bug Fix
body: >-
  An online Ollama, Gemini or Cohere call whose connection is refused, reset, dropped
  mid-response or timed out is now retried as the action's `retry:` asks, and the record
  is marked exhausted once the attempts run out. The ollama SDK re-raises a refused
  connection as a builtin `ConnectionError`, and the gemini and cohere SDKs let httpx's
  transport errors through; none was wrapped as a `NetworkError`, so the retry service
  called it non-retriable and gave the record up on its first attempt. Every provider's
  error mapping now treats these transport failures as network errors (1485).
time: 2026-10-17T16:00:00Z
