kind: Bug Fix
body: "A batch registry written before the reprompt phase was removed no longer loses its recovery entries on load. `RecoveryType('reprompt')` raised a bare `ValueError`, which the registry loader caught and skipped with a warning — so the parent batch those entries accounted for looked unsubmitted, and the next run resubmitted a batch that had already completed. Both halves of the retired mechanism, the `RecoveryState` phase and the registry entry's `recovery_type`, now refuse by name with a message that says which action to re-run with `--fresh`. Separately, the events reference (`docs/reference/execution/artifacts.md`) named eight event classes that do not exist and showed a JSON shape that is not written — a flat object keyed on `type`, where a real line is an envelope with `event_type`, `code`, `meta` and `data`. The sample is now generated from the real classes, the prefix table covers all 21 prefixes, and a test keeps both honest."
time: 2026-09-07T18:15:00Z
