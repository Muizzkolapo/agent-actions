kind: Bug Fix
body: >-
  A store error while counting the rows an action wrote, once it has run (online, or when
  its batch is collected), no longer leaves the action `completed` with its readers never
  run. The run still fails with the error, but the action is now recorded `failed` with the
  error as its `error_message`, so `agac retry` re-runs it and every action after it, as for
  a store error before the action ran; it reported "Nothing to retry" and exited 0. The
  count is taken before the action is marked complete. A store error before or after an
  action runs is also added to the run history (`artefact/runs.json`) as a failed action
  with its error, as any other action failure is; it read `success`, `running`, or was
  missing. (#1519)
time: 2026-10-18T09:00:00Z
