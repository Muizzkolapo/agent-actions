kind: Breaking Change
body: "Records with identical content are processed once. source_guid is a hash of a record's content, and the source store has always kept one row per identity — but the list handed to processing was the staged list, so an action wrote one output row per staged record while every other table counted one per identity, and anything reading by identity afterwards disagreed with the output. A workflow staging the same record twice now produces one output record rather than two, and says at warning how many repeats it found and in which file. It also stops paying for a second provider call to produce a row that was discarded. Records an action produces by expanding its input are unaffected: several rows legitimately share a parent's identity there."
