kind: Breaking Change
body: "The anthropic_version setting is removed. No request sent it: the Anthropic SDK sets the API version. A config that sets it on an action, in a workflow's defaults or in default_agent_config is refused at load as an unknown key. Anthropic batch results no longer record an anthropic_version in their metadata."
time: 2026-11-14T19:45:00+00:00
