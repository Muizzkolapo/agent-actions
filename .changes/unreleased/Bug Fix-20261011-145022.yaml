kind: Bug Fix
body: 'A guard written `NOT x == 1` now negates the comparison, not the field. `NOT` was the tightest-binding level in the guard grammar, above every comparison operator, so an unparenthesized `NOT x == 1` read as `(NOT x) == 1`: the comparison was decided by `x`''s truthiness, never its value, and was false for every record whose field was truthy. Under `on_false: filter` this filtered every record and the run exited 0 with no error; only `NOT (x == 1)` gave the intended result. `NOT` now binds looser than every comparison operator (including `IS NULL`/`BETWEEN`) and tighter than `AND`/`OR`, matching the guards page.'
