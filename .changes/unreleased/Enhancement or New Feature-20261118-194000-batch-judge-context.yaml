kind: Enhancement or New Feature
body: 'An `llm_judge` rule with `context:` references now runs on a `run_mode: batch` action; preflight no longer refuses it. When a record is prepared for the batch, Agent Actions keeps the values those references read from the record''s LLM context, and only those, with the batch''s stored record context. Every step that reaches a verdict after the answers return reads them back: the judge batch, the repair loop and each round it sends, the result writer under `repair: none`, `judge_mode: online`, and a run that resumes any of them. The judge request carries the same "Grounding context" section an online judge prompt carries for the record. A reference the action does not observe fails the rule with the message an online run gives. As online, the judge cache key is the rule and the value, not the context: one value held by two records with different context is judged once, against the first record''s context.'
