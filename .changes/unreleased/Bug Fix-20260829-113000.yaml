kind: Bug Fix
body: "A completed action now re-runs when its guard, prompt or schema changed. The config-hash mechanism that detects this was correct but unreachable: `execute_action_sync` consults it before checking for output, yet no run loop reaches that function for a completed action — the sequential and parallel loops both call `verify_completion_status(action_name)` first, which takes only a name and can therefore only ask whether output still exists. For a completed action that still has its output the answer was always \"skip\", so the hash was never compared and `--fresh` was the only way to honour a config edit, with nothing telling the user so. The check now lives inside `verify_completion_status`, reading the config through the action runner rather than from its callers, because that function is the only thing a run loop calls for a completed action and a caller that checked output first would make it unreachable again. An action whose config is unknown falls back to the output check, and a status written before config hashing existed is left alone, so existing state does not invalidate en masse. Changing the model is still not detected — the hash reads a `model` key that no config writes — and that is filed separately because adding fields to the hash would invalidate every stored digest at once."
