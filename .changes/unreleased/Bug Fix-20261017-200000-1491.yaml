kind: Bug Fix
body: >-
  Pre-flight reads a tool's output dict the same way however it is first written. A RECORD
  tool that set a required output field only inside an `if` was refused when its dict started
  as `out = {...}`, but passed when it started as `out: dict = {...}` or `out = dict(...)`, and
  then failed every record that did not take the branch while the run exited successfully. Keys
  a tool sets on every path with `out |= {...}`, `out.update(key=...)`, `out.setdefault(...)`
  or inside a `with` block now count as set, so such a tool is no longer refused. The refusal
  names the tool, the line that sets the field and the block it sits in; it used to be shown as
  "Schema validation failed / The configuration format is invalid", without the field it was
  about, because its wording mentioned schema validation. (#1491)
