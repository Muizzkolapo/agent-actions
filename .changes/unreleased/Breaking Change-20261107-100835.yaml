kind: Breaking Change
body: 'A record a FILE tool or FILE HITL action cannot be handed, because it lacks a field the action observes or its source cannot be resolved, is now a failure of that action: it is counted, its disposition is failed with a reason naming every missing field, and agac retry can reach it. Before, the record was skipped outside the count, the action read as complete, and when every record was skipped the action was labelled guard-filtered with no guard set. RECORD mode also names every missing observed field instead of the first. A record the action''s guard skips is still a guard skip. Because a refused record is now failed rather than skipped, agac retry reaches it, and a FILE action whose every record was refused ends failed instead of skipped.'
