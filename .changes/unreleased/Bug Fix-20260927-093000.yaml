kind: Bug Fix
body: "The docs site's Drops panel renders again. It reads a catalog key that nothing had emitted since the bare `drops:` action key was removed, so every action shipped without it and the panel stayed empty whatever the workflow declared. It is now filled from `context_scope.drop`, reported as the runtime performs that directive rather than as it is written: each reference keeps the namespace it names, because the runtime removes `namespace.field` and an action may declare a field of its own by the same name; a reference the runtime cannot parse is left out, because such a reference is logged and not removed at all; and so is one whose field part is a nested path or an inner wildcard, because the removal matches an exact key and a nested path matches none. A reference repeated in the directive is reported once. The Observe panel is still empty: the Inputs row beside it already lists every observed reference unchanged, so filling it would print the same text twice, and removing the row instead is a frontend change. Separately noted, not fixed: the catalog reads each action's own `context_scope` from the workflow file, so a directive inherited from `defaults` or expanded from a version base is not reported; and the resolved output schema discards the namespace when marking a field dropped, which already leaves a produced field out of the Outputs panel."
time: 2026-09-27T09:30:00Z
