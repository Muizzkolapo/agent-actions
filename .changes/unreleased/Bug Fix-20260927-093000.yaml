kind: Bug Fix
body: "The docs site's Drops panel renders again. It reads a catalog key that nothing had emitted since the bare `drops:` action key was removed, so every action shipped without it and the panel stayed empty whatever the workflow declared. It is now filled from `context_scope.drop`, reported as the runtime reads that directive: each reference keeps the namespace it names, because the runtime removes `namespace.field` and an action may declare a field of its own by the same name, and a reference the runtime cannot parse is left out, because such a reference is logged and not removed at all. The Observe panel is deliberately left empty: the Inputs row beside it already carries every observed reference unchanged, so filling it would print the same text twice; removing that row is a frontend change and is deferred with the build artifact. Separately noted, not fixed: the resolved output schema discards the namespace when marking a field dropped, so an action that drops an upstream field and declares one of its own by that name has the wrong field missing from its Outputs panel."
time: 2026-09-27T09:30:00Z
