kind: Bug Fix
body: >-
  Online, a record an action above failed is no longer judged by the guard of an action
  below it. A guard reading the failed action's fields found them null and turned the
  record away as if it were live: under `on_false: skip` it was stored `guard_skipped`
  with a `passthrough` disposition, and every action below sent it to the model and
  stored the answer as a success, though the answer it was built on does not exist; under
  `on_false: filter` it was `filtered` and gone from every action below with nothing
  saying it failed. Either way the run read `completed`. It is now stored
  `cascade_skipped` with an `unprocessed` disposition at every action below, as batch
  stores it, for an LLM or tool action at either granularity whose input reaches its
  guard, and `agac retry` sends it on through them once the failed action answers it. An
  input such an action answered in an earlier run keeps its answer, as under batch. A run
  an earlier version made keeps what it stored until `agac retry`, or `agac run --fresh`,
  sends the record again.
