kind: Enhancement or New Feature
body: 'A workflow can route each record to one branch by the value of a field, and join the branches again. `- route: <name>` with `on: <action>.<field>`, `cases:` (each value maps to an include instance or to the list of actions that start its branch) and a required `default:` (a branch, or `filter`) becomes a router action that writes each record''s case; the first action of each branch takes only the records of its case. A record a branch does not take is recorded filtered with reason `sent_elsewhere` and is not reported as filtered anywhere: the run output counts the records per case on the router''s line, and `agac dispositions` shows them in a Sent elsewhere column. `- join: <name>` with `of:` becomes an action that writes, for each record, the output of the branch it went through, with every field of the joined actions in its schema. A branch that takes no record completes on no records and the join still runs, in both run modes. The load, and so `agac inspect`, refuses a router with no default, a case naming no branch, a case value outside the `enum` of the field, an enum value with no case under `default: filter`, an action starting two branches or carrying its own guard, and an action that reads two branches short of a join. It also refuses a router on a field whose schema type is not `string` or whose `enum` holds a value that is not a string (`null` is accepted beside them), a join of an action that runs as versions, and a route or join entry in a branch file. At run time the router fails a record whose value is set and is no string, naming its type, also under `default: filter`. A join can name another join, and a router can read a join or the case of another router. A join that covers some but not all branches of a router is warned about, unless it closes a router inside one of those branches. `agac inspect` shows each router with its field, cases and default, and each join with what it joins. The editor knows a route and a join by their names, and the VS Code extension draws each include (its branch actions under their final names), route and join entry in the workflow graph.'
