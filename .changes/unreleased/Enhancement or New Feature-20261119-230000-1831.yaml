kind: Enhancement or New Feature
body: 'A provider answer that the quota, credit or balance of the account is used up now stops the run instead of failing or exhausting every record left. It was handled as a rate limit (HTTP 429, retried with back-off) or as one record''s error. HTTP 402 from any provider, and an HTTP 429 or 403 whose text holds the provider''s words for it (OpenAI `insufficient_quota`, Anthropic `billing_error`, Ollama Cloud `usage limit` or `usage credits`), is a `QuotaExceededError`, which is never retried. On it the run sends no new record, lets the records already sent finish and keeps their answers, leaves every record without an answer with no disposition (not failed, not exhausted), starts no later action, and ends with one message naming the provider and its text ("Add credits, then run again to resume.") and exit code 5. The action reads `interrupted`, and a plain `agac run` finishes it once the quota is back, with no `agac retry`. A batch the provider refuses for quota stops the run the same way, and so does `agac retry`. Any other HTTP 429 is a rate limit and is retried as before.'
