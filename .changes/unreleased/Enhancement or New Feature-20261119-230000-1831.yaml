kind: Enhancement or New Feature
body: 'A provider answer that the quota, credit or balance of the account is at its limit now stops the run instead of failing or exhausting every record left. It was handled as a rate limit (HTTP 429, retried with back-off) or as one record''s error. HTTP 402 from any provider, an HTTP 429 or 403 whose text holds the provider''s words for it (OpenAI `insufficient_quota`, Ollama Cloud `usage limit` or `usage credits`), and the HTTP 400 `invalid_request_error` Anthropic sends when the credit balance is too low, is a `QuotaExceededError`, which agac never retries; the OpenAI SDK does not send such a 429 again either. On it the run sends no new record, lets the records already sent finish and keeps their answers, leaves every record without an answer with no disposition (not failed, not exhausted), starts no later action, and ends with one message that says the run stopped, names the provider and its text ("Add credits, then run again to resume.") and exit code 5. The action reads `interrupted`, and a plain `agac run` finishes it once the quota is back, with no `agac retry`. A batch the provider refuses for quota stops the run the same way, and so does `agac retry`. Any other HTTP 429 is a rate limit and is retried.'
