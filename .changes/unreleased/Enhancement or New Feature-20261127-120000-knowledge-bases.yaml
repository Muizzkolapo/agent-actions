kind: Enhancement or New Feature
body: 'Knowledge bases and retrieval: declare reference text under `knowledge:` in `agent_actions.yml` (files, JSON or CSV records, or database rows), and search it for each record with `context_scope.retrieve`. The search is local and makes no model call: `keyword`, `all_words`, `phrase`, `fuzzy` and `key` methods, merged with weights, with `where`, `top_k`, `max_context_tokens` and `max_per_origin`. Each entry runs as the step `<action>__<entry>`, so `agac records`, `--rerun`, guards and sandbox runs work with it, and a changed base warns. `agac knowledge list`, `build` and `search` manage the indexes in `.agac/knowledge/`. The sandbox starter template (`agac init --template sandbox`) now grounds `draft_reply` in three help articles, with citations. `chunk_config` takes the new `split_method: markdown` (headings, then paragraphs, then sentences); the load refuses its overlap at or above the chunk size, as for `tiktoken` and `chars`. See the Knowledge Bases and Retrieval guide.'
