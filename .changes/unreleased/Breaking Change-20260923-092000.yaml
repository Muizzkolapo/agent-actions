kind: Breaking Change
body: "`observe:` and `drops:` are no longer keys of a `defaults:` block or of an action. Both were declared on the schema and read by nothing: a workflow setting either passed validation, reached no agent, and ran as though the fields had never been named — one real workflow has been passing three field names to nothing. The mechanism that works is `context_scope:`, which is declared, inherited from `defaults:` to each action, and read. Writing any of `observe`, `passthrough`, `drop` or `drops` beside `context_scope:` instead of under it is now refused at load, on an action, in `defaults:`, in a legacy top-level `agents:` block, and in the `default_agent_config:` block of `agent_actions.yml` that every agent merges over, with a message naming the action and showing the nesting; the same slip previously reached a runtime error on one of those surfaces and nothing at all on the rest. Move the key under `context_scope:` — and note that entries there are `action.field` selectors, so a bare field name is not a reference the framework can resolve. `drops` is no longer a `context_scope` directive either: every reader takes `context_scope.drop`, so a value written under `drops` dropped nothing, and it is now refused with the valid directives named."
time: 2026-09-23T09:20:00Z
