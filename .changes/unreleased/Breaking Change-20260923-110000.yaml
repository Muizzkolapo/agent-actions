kind: Breaking Change
body: "The framework no longer writes `agent_io/source/`. The files there were written for version-merge actions and read by nothing: their rows are four framework keys — `source_guid`, `id`, `lineage`, `node_id` — carrying none of the record's payload, and every source read in the framework goes to the store instead. The artefact was not well defined either, because its path dropped the action directory: two version-merge actions whose target files share a name wrote to the same file, and the later one replaced the earlier. Lineage is unaffected — a consuming action chains from the merged records themselves, which carry the full merged lineage. `agac clean` is unchanged and still removes the directory, so a project carrying one from an earlier version can clear it; on a project that has never had one, a plain `agac clean` now reports nothing to clean. A project reading these files from a script outside the framework must read the store instead. Removed with them: `FileWriter.write_source`, `SourceDataLoader.save_source_data` (and the `ISourceDataLoader` methods declaring it), and `BatchSourceHandler`, none of which had a caller."
time: 2026-09-23T11:00:00Z
