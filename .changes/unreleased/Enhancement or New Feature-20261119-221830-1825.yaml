kind: Enhancement or New Feature
body: 'An `observe` entry can be optional: `review.rejected_text?`, or `{field: review.rejected_text, optional: true, default: ""}`. A record that lacks the field, holds it as null, or was skipped by a guard on the upstream action no longer fails: the field resolves to null or to the stated default in the LLM context, in the prompt (`{{ review.rejected_text }}`), and in the input of a record or file tool, in online and batch mode alike. Preflight gives no `may be null at runtime` warning, no fan-in null warning and no "does not guarantee" prompt warning for an optional field, and staging does not refuse an optional `source` field no staged row holds. The same field without the mark fails and is warned about as before, and an optional entry naming an action or field that does not exist is still refused. A wildcard cannot be optional (`source.*?`), the `?` goes only at the end, `passthrough` and `drop` have no optional form, an optional entry cannot sit beside a `drop` of the same field or of its namespace wildcard (in the action or in `defaults`), and a workflow cannot write a `context_scope.optional` block: each is refused when the workflow loads. A trailing `?` in an observe entry is now this mark, not part of the field name. Inside an inline `[ ]` list YAML needs the entry quoted (`"review.rejected_text?"`); the YAML error says so. `agac inspect action` and `agac inspect context` show the field with its `?`. A judge `context:` reference takes no `?`, and `agac docs` lists an optional field as a plain input.'
