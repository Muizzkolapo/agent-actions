kind: Bug Fix
body: "Staging now persists the records it staged. Whether a run's input was stored at all was previously decided by comparing the field count of the first staged record against the first record of a file staging does not write: the version correlator owns that file and its rows are four framework keys, so any input payload of four fields or fewer lost the comparison and was silently never stored, leaving a run that reported success with nothing in the store and nothing for a record limit, a named retry or carry-forward to match. Repeat writes are settled by the store's deduplication, which matches on identity rather than on how many fields a row carries. The same comparison ran the correlator against its own output, which always tied, so a version-merge correlation file was written once and never refreshed; that file is no longer written at all."
