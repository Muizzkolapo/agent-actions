kind: Bug Fix
body: >-
  A guard condition now reads the `source` namespace the resolver picked, not the copy the
  record carries. The guard's context already held the resolved answer, and the evaluator
  merged the record's own content over it, so a record whose guid resolves to a pool row was
  judged against a snapshot taken when the record was written. The visible symptom was a
  granularity split — the same clause kept a record at FILE granularity and filtered it at
  RECORD granularity — but the split was a side effect: a FILE-mode `context_scope` pass
  writes the resolved namespace onto the record before the guard runs, and a FILE action
  declaring no `context_scope` read the stale copy exactly like a RECORD one. A guard's
  answer no longer depends on which granularity reads the record or on whether an unrelated
  `context_scope` happened to materialise the namespace. `version`, `workflow` and `seed`
  are covered by the same rule because they share that merge; only `source` has a producer
  writing it into record content today, so for the other three this is future-proofing rather
  than a fault anyone could reach. These four are reserved action names, so a key under one
  of them in record content is never an action's output. An action's own namespace still
  comes from the record, which is where the in-flight value lives. Nothing is lost for a
  record the pool cannot place: the resolver already falls back to what such a record
  carries, so the resolved answer and the carried one are the same value in exactly those
  cases.

  One behaviour change follows. `context_scope.drop` no longer hides a `source` field from a
  guard clause, because the resolved namespace is the source document and `drop` never
  touched it. This closes a second divergence rather than opening one: FILE mode used to
  hide such a field, because the scope pass wrote its own stripped copy onto the record,
  and RECORD mode never did. The two now agree on RECORD's answer, which matches a guard
  gating the action before it receives anything. A dropped *dependency* field is still
  hidden from a FILE-mode guard and not from a RECORD-mode one; that asymmetry predates
  this change.
