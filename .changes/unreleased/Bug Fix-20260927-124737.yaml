kind: Bug Fix
body: >-
  A guard condition now reads the `source` namespace the resolver picked, not the copy the
  record carries. The guard's context already held the resolved answer, and the evaluator
  merged the record's own content over it, so a record whose guid resolves to a pool row was
  judged against a snapshot taken when the record was written. The visible symptom was a
  granularity split — the same clause kept a record at FILE granularity and filtered it at
  RECORD granularity — but the split was a side effect: a FILE-mode `context_scope` pass
  writes the resolved namespace onto the record before the guard runs, and a FILE action
  declaring no `context_scope` read the stale copy exactly like a RECORD one. A guard's
  answer no longer depends on which granularity reads the record or on whether an unrelated
  `context_scope` happened to materialise the namespace.

  The rule is one-directional: a resolved framework namespace outranks the record's copy,
  and a key the framework resolved no answer for is left alone. `source`, `version`,
  `workflow` and `seed` are reserved *action* names, which does not make every key spelled
  that way the framework's — a first-stage record's content is the user's own staging row, a
  version-merge tool spreads its output flat rather than under its action name so an output
  field named `version` is content's own key, and the guard context never carries `seed` at
  all. Taking such a key away would leave the clause reading a missing field, which counts as
  *not matched* and would silently filter the record. Nothing a guard could read before is
  removed; only which of two values a clause reads can change.

  One behaviour change follows. `context_scope.drop` no longer hides a `source` field from a
  guard clause, because the resolved namespace is the source document and `drop` never
  touched it. This closes a second divergence rather than opening one: FILE mode used to
  hide such a field, because the scope pass wrote its own stripped copy onto the record, and
  RECORD mode never did. The two now agree on RECORD's answer, which matches a guard gating
  the action before it receives anything. A dropped *dependency* field is still hidden from a
  FILE-mode guard and not from a RECORD-mode one; that asymmetry predates this change.
