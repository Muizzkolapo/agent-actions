kind: Bug Fix
body: "With `enable_prompt_caching` on an Anthropic action, a repair call or a batch repair round now keeps the prompt's cache mark, so it can read the cache entry the first call wrote. Before, the repair feedback was joined to the prompt and the whole request went unmarked. The feedback now follows the marked prompt as its own unmarked block: online, the user message is the opening tag and prompt (marked), then the feedback, closing tag and record; in batch, the system prompt is the prompt (marked), then the feedback. The text the model receives is unchanged. A batch repair round with no feedback, as `repair: retry`, a `repair: {prompt: ...}` template or a record with no verdict gives, now sends the prompt untouched with its one mark, not the prompt followed by a blank line. No request carries an empty or whitespace-only text block, which the API refuses. The first call's online mark now ends at the end of the prompt, before the closing tag, so the first call and its repair send the same marked block. A prompt that reads record data still gets no mark, and so does a repair template that does not begin with `{original_prompt}`. Nothing changes with caching off or for other providers."
