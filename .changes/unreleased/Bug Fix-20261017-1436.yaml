kind: Bug Fix
body: >-
  The dag-fit pre-flight warning no longer reports a tool's required output fields as having
  no upstream guarantee, and as rejected at runtime, when it cannot read what the tool
  returns. A tool whose output is built by a helper, appended in a loop, spread from another
  dict, returned as a list, or whose UDF cannot be found is no longer checked, and the
  fields inside a key the tool writes are the tool's own. An annotated initialiser such as
  `out: dict[str, Any] = {...}` is now read like `out = {...}`. A tool whose output the check
  can read and which leaves out a required field, such as a FILE tool with a literal
  `FileUDFResult`, is still reported. Four shipped examples lose a warning they printed on
  every `inspect` and `run` (1436).
time: 2026-10-17T18:00:00Z
