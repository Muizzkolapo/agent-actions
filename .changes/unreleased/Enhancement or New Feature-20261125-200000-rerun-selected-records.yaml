kind: Enhancement or New Feature
body: '`agac run --rerun ACTION` takes a record filter, so a finished workflow can answer one group of its records again and keep the rest (#1912). `--where EXPRESSION` is a guard condition read on the records ACTION stored (`--where ''classify.category == "billing"''`), `--records FILE` lists source_guids, and both together must both hold. Only the matching records are answered again, at ACTION and at what reads it; every other record keeps its row and its disposition, and an action in another branch does not run. `--dry-run` prints the count and the ids and calls no model. A record ACTION made from another (a File tool''s slots) is traced to the record ACTION reads, and an id or a field that names nothing stops the command before anything changes. `--wait` and batch mode work as in a run.'
