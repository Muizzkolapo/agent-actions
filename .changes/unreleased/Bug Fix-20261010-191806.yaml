kind: Bug Fix
body: >-
  An online action whose guard skipped a record (`on_false: skip`) now puts that record to
  the guard again when a run resumes the action, and sends it to the model once the guard
  passes it, as a batch action does. Online recorded a guard skip as `passthrough`, which
  reads as done, so after a run that stopped partway (a provider error, a kill) the next
  `agac run` or `agac retry` carried the record's `guard_skipped` row forward without asking
  the guard, even after a change to the guard's code passed it, and the action read
  `completed` with exit 0. A guard skip is now `unprocessed` with reason `guard_skip` in
  both run modes, and `agac dispositions` counts it under Unprocessed instead of
  Passthrough. A store an earlier version wrote still holds such skips as `passthrough`;
  they are put to the guard again too. Because the skip is recorded at once rather than
  with the file, an online run in which nothing is answered and something fails, and whose
  guard now skips a record it answered before, writes that record's tombstone as batch
  does, instead of leaving the answer stored and calling it answered.
