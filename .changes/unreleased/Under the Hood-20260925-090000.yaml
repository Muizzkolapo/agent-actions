kind: Under the Hood
body: "The lint gate now covers the whole tracked tree. `task lint` ran `ruff check agent_actions`, so CI never inspected `examples/` or `tests/`, while AGENTS.md, RELEASING.md and pyproject.toml's per-file-ignores (which carry `examples/*` and `tests/*` entries) all described a wider gate. Five findings had settled on main behind the gap, plus two unformatted files: four in example tool scripts a user is invited to copy, including an unused `urllib.parse.quote` import, and one in `tests/manual/doc_audit/helpers.py`. That helper turned out to import `agent_actions.processing.recovery.validation`, deleted when `reprompt:` was retired, so it raised ModuleNotFoundError on import and had no callers; it is removed. `task lint`, `task format` and `task format:check` now all run over `.`, and a regression test plants a real violation in every tree holding tracked Python and requires each task's own ruff command to report it — so a narrowing fails the test whether it comes from the task's scope, an `--exclude` flag, any of ruff's `exclude` keys, a `per-file-ignores` entry silencing every rule, or a trimmed `select`."
time: 2026-09-25T09:00:00Z
