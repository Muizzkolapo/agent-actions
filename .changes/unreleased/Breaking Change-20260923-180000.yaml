kind: Breaking Change
body: "`chunk_config` now takes exactly four keys — `chunk_size`, `chunk_overlap`, `tokenizer_model` and `split_method` — and refuses the rest at load, naming the field a stray one resembles. The key it refuses in practice is `overlap`, which is what the chunker's own parameter is called and what the shipped examples and the reference docs all used: the block was a free-form dict, so `overlap` was read and `chunk_overlap` ignored, while the expander wrote `chunk_overlap` and nothing read it. An action or `defaults:` asking for a chunk overlap therefore got the hardcoded 10, whatever it configured, and `chunk_size` alongside it worked — which is what kept it hidden. Rename `overlap:` to `chunk_overlap:` inside any `chunk_config` block; every example in this repo has been migrated. `tokenizer_model` and `split_method` were declared on `defaults:` and inherited onto the action, but only ever read out of `chunk_config`, which they never entered, so those two never reached a split either; each of the four can now be written as a key of its own and fills a name the block leaves out."
time: 2026-09-23T18:00:00Z
