kind: Breaking Change
body: "`chunk_config` now takes exactly four keys — `chunk_size`, `chunk_overlap`, `tokenizer_model` and `split_method` — and refuses the rest at load, naming the field a stray one resembles. The key it refuses in practice is `overlap`, which is what the chunker's own parameter is called and what the shipped examples and the reference docs all used: the block was a free-form dict, so `overlap` was read and `chunk_overlap` ignored, while the expander wrote `chunk_overlap` and nothing read it. An action or `defaults:` asking for a chunk overlap therefore got the hardcoded 10, whatever it configured, and `chunk_size` alongside it worked — which is what kept it hidden. Rename `overlap:` to `chunk_overlap:` inside any `chunk_config` block; every example in this repo has been migrated. `tokenizer_model` and `split_method` were declared on `defaults:` and inherited onto the action, but only ever read out of `chunk_config`, which they never entered, so those two never reached a split either; each of the four can now be written as a key of its own on an action or in `defaults:`. Chunk settings merge by name rather than by block, so a narrower block no longer drops the names it omits and a block written further out no longer overrules the action: the order, outermost first, is the project file's block, then the workflow's key, the workflow's block, the action's key and the action's block. A `chunk_overlap: 0` written as a loose key used to be read as unset and became 10; it now reaches the split as the no-overlap it asks for. A loose `chunk_size: 0` was read as unset the same way and is now refused at load, as is any size at or below the overlap it would be split with — a pair that merging by name newly makes reachable across levels, and that the splitter used to reject partway into a run. Note that a completed action is not re-chunked on upgrade: its stored output was written under the old boundaries, and the resume check does not hash chunk settings, so re-run with `--fresh` where the new overlap matters."
