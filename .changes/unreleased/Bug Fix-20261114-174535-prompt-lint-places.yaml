kind: Bug Fix
body: The prompt file check in `agac run` now checks the prompt files that the run's load reads, and no others. This includes a file in a workflow's `agent_workflow/<workflow>/prompt_store/`, a file in a subfolder of a prompt folder, and a file that another prompt loads with `{{ load_prompt("...") }}`. Before, it checked only the files directly in `prompt_store/`, or only `<workflow>.md` when that file was there, so an empty prompt block in a prompt file that the run loaded from another place was not reported. A prompt file that the run does not load is no longer checked, and a workflow that loads no prompt file gets no prompt warnings or errors. The check now runs after the workflow loads; when the load fails, it still checks the files the load read before the failure, and the load's error and exit code stay the same. A file that the run loads under two names (a link) is checked once. A prompt ID in two prompt files is no longer reported, because a `$file.ID` reference names its file; an ID used twice in one file is still an error. When a reference names a prompt file that is in two prompt folders, the load still stops with the error that lists both paths, as before.
