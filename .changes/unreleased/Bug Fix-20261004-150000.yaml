kind: Bug Fix
body: >-
  What a run finished before it stopped partway through an action is now kept only while
  the action's config is unchanged. The next run resets such an action, and what the reset
  kept depended on how the run stopped. Killed, interrupted or stopped while collecting a
  batch, the action kept the records it had finished even when its prompt, schema, guard
  or model had been edited since: the next run asked only for the rest, a batch collected
  the jobs the old model had answered instead of sending anything under the new one, and
  the action was then recorded as complete under the new config, so nothing re-ran it.
  Stopped by an error, it kept nothing even when nothing had changed, so every record it
  had finished was asked again and paid for twice, as was a batch file already collected
  once a resumed collect failed before it was collecting again. An action now records the
  config and model it works under when it starts, and the reset compares them with the
  config in force. Unchanged, it keeps what was finished however the run stopped. Edited,
  the action and every action that reads it answer everything again, and a batch still
  out under the old config is given up with a warning. A record the stopped run answered
  in a file it had not written yet is asked again when an earlier run had stored that
  file: the next run used to carry the stored row, which held what was answered before an
  edit to the action or to what it reads. A stopped `agac retry` of an edited action
  leaves the edit to the next run, which applies it to every record. Records the
  reset keeps now keep their prompt traces as well. An action stopped before this release
  has nothing recorded and is reset as before: kept if it was interrupted or killed, wiped
  if it failed.
