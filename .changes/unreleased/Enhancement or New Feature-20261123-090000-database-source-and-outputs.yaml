kind: Enhancement or New Feature
body: 'A workflow can read its input from a database and write its results back to one. `agent_actions.yml` takes a `connections:` block of named connections (`sqlite`, `duckdb`, `postgres`, `mysql`, `redshift`, `snowflake`, `bigquery`, `databricks`; each but `sqlite` needs the extra of the same name, `pip install ''agent-actions[postgres]''`), with credentials written as `${NAME}`. `data_source: {type: database, connection: <name>, sql: <query>}` reads the query once, through a read-only connection, into a snapshot the first action stages; a query that is not a read is refused, and `agac run --refresh-input` reads it again, answering only the rows added or changed. A workflow-level `outputs:` block names an action, a connection and a table (`mode: append | replace | merge`, `key`, `carry`); the tables are written when `agac run` or `agac retry` finishes, a column an answer brings later is added, and `agac export` writes them again without calling a model. The `ticket_triage_warehouse` example runs it offline.'
