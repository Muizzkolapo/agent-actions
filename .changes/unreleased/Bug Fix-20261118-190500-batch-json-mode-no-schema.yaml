kind: Bug Fix
body: 'An action with `run_mode: batch`, `json_mode: true` and no schema runs, as it does online. Preflight and batch submission refused it with "Schema is required for batch processing when json_mode is enabled". An OpenAI or Groq batch request asks for `response_format: {type: json_object}`, as the online request does; a Gemini or Ollama one already asked for JSON, and an Anthropic one is sent no tool and its text reply is read as JSON.'
time: 2026-11-18T19:05:00Z
