kind: Bug Fix
body: >-
  A record a batch provider leaves out of a file's results, or answers on a line that
  cannot be read, is now that action's failure when nothing will send it again: with no
  `retry:` block, with `retry: false` or `enabled: false`, or when the retry batch that
  would resend it was refused by the provider or could not be prepared because its prompt
  could not be rendered. It was stored as a cascade casualty, `unprocessed` with the
  reason `batch_not_returned`, so the action read `completed` and the run reported success,
  `agac retry` found nothing to retry, and every later run skipped the action; only
  `agac run --fresh` brought the record back, by sending every record of the workflow
  again. A version merge run as the batch action lost its record the same way. The record
  is now `failed` with the reason `batch_not_returned`: the action completes with failures,
  the actions that read it skip it as before, and `agac retry` sends it again, after which
  they answer it. When the provider answered none of the action's records, the action
  fails, and the next run sends them again. The retry reference said retry is on, with 3
  attempts, when the `retry:` block is left out. It never was, online or batch: without a
  block a transport error fails its record at once, and a record a batch leaves out is
  now failed as above. The page now says retry is off until a `retry:` block, on the
  action or under `defaults:`, turns it on.
