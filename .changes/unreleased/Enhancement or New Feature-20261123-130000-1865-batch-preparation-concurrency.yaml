kind: Enhancement or New Feature
body: 'A workflow can set `batch_preparation_concurrency` at its top level: the most batch actions of one step that prepare their requests at the same time (1-50). Each batch action holds the records of one input file while it prepares, so two batch actions of a step hold two files. `--concurrency-limit 1` and `--execution-mode sequential` already run them one at a time, but they make an online action of the step wait too, or make the batch requests wait for the online action. This key limits only the batch actions that prepare; an online action runs beside them, and a batch action that collects is not limited. On a synthetic step of two batch actions and one online action over 30 earlier actions, the key at 1 lowered the peak memory from 1.1 GB to 0.9 GB, and the first batch requests went out 12 s after the step began, where with `--concurrency-limit 1` they waited 25 s for the online action.'
