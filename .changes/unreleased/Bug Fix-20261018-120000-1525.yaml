kind: Bug Fix
body: >-
  A guard now reads the seed data its action declares under `context_scope.seed`, the same
  data the action's prompt reads, so `seed.conf.mode == 'on'` compares each record against
  the seed. The guard context never carried `seed`, so such a guard found no field, filtered
  every record, and the run exited 0, in either run mode and for a FILE-granularity tool's
  guard too. A guard sees every declared seed key, including one the action drops, as it sees
  every namespace on the record. Pre-flight refuses a prompt or guard that reads a seed key
  its action does not declare; it now does so when the workflow has no seed directory at all,
  where it used to let the read through (1525).
time: 2026-10-18T12:00:00Z
