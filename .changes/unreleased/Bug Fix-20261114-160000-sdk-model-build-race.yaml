kind: Bug Fix
body: An online action with record_concurrency above 1 no longer fails a record with "Pydantic models should inherit from BaseModel, BaseModel cannot be instantiated directly". The OpenAI, Anthropic and Groq SDKs built their response models on first use, and several records parsed their first answers at once. agent_actions now sets DEFER_PYDANTIC_BUILD=false, unless it is set already, so the SDKs build their models when they are imported. A record that failed this way while Ctrl-C waited was also sent again by the resumed run; that no longer happens for this cause.
time: 2026-11-14T16:00:00Z
