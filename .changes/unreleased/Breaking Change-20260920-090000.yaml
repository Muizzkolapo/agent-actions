kind: Breaking Change
body: "A `defaults:` block now declares every key it accepts and refuses the rest, where it used to drop an unrecognised key and log a warning. A typo such as `temperture:` silently did nothing where anyone would read it; the refusal now names the declared key a stray one resembles and lists the keys the block takes. `reprompt:` and `on_schema_mismatch:` are refused there by that same rule rather than by a table naming them, so every other mistake is covered too, and the refusal names the valid keys rather than the replacement; on an action both are refused as unknown keys, as any undeclared key already was. The migration is in the expectations reference. `frequency_penalty` and `presence_penalty` are now declared and inherited, so writing either under `defaults:` reaches the OpenAI client and Groq's JSON path; previously both were discarded before any client saw them. `temperature` and `top_p` now carry the ranges the configuration reference already documented for them (0.0-2.0 and 0.0-1.0), matching the vendor config models, so a value outside them is refused at load instead of travelling to the API. Individual providers differ inside those ranges, and a local Ollama model that accepted a temperature above 2.0 no longer can. Any workflow whose `defaults:` block carries a key the framework does not read now fails at load and must drop the key."
time: 2026-09-20T09:00:00Z
