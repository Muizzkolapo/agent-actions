kind: Breaking Change
body: "A `defaults:` block now declares every key it accepts and refuses the rest, where it used to drop an unrecognised key and log a warning. A typo such as `temperture:` silently did nothing where anyone would read it; the refusal now names the declared key a stray one resembles, or lists the keys the block takes. `reprompt:` and `on_schema_mismatch:` are refused by that same rule rather than by a table naming them, so every other mistake is covered too, and the refusal names the valid keys instead of the replacement — the migration is in the expectations reference. `frequency_penalty` and `presence_penalty` are now declared and inherited, so writing either under `defaults:` reaches the OpenAI and Groq clients; previously both were discarded before a client saw them. `top_p` is bounded to 0.0-1.0 at the config surface rather than at the provider. Any workflow whose `defaults:` block carries a key the framework does not read now fails at load and must drop the key."
time: 2026-09-20T09:00:00Z
