kind: Bug Fix
body: >-
  A staged `.csv` or `.tsv` is stored cell for cell. A quoted cell holding a line
  break, such as `"line one` / `line two"`, kept its line break (`\n` or `\r\n`, as
  written) instead of being stored as `line oneline two` while the run reported
  success, and a file saved with a UTF-8 byte order mark no longer carries the mark
  in its first column's name, so `source.<first column>` is accepted. The check that
  renders the first record before any is sent reads the file the same way. Rows of
  such files now store their true text, so their `source_guid` differs from the one
  a previous run stored and the records run again. (#1521)
time: 2026-10-18T11:00:00Z
