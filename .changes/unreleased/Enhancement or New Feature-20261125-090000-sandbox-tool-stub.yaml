kind: Enhancement or New Feature
body: "A sandbox scenario stubs a tool action: with `actions.<tool action>.stub: true` in `sandbox.yml` (or the file that `--scenario` names), `agac run --sandbox` and `agac retry --sandbox` do not call the function of that tool for any record, and the mock builds its output. The default does not change: a tool action runs its own code. The mock builds one output record for each input record from the output schema of the tool, as it builds the answer of an LLM action: the schema keywords, the expectation rules of the action, an output field that copies the observed input field of the same name, then `pin`, which a `records` entry sets for the records that its `match` selects. The record is made from the action name and the input of the record, so two `--fresh` runs store the same stubbed output, and a parallel run stores the output of a sequential run. Only the call of the function is replaced: the module of the tool is still imported and checked at load, the output schema checks the stubbed record as it checks the output of the tool, and the guard, context scope, expectation verdict, dispositions, store and lineage are those of a tool action, so the actions downstream read the stubbed output. A name under `actions` and `records[].actions` is an LLM action, a tool action or the base name of a version group. The scenario check refuses, with the scenario file and the key named: `stub` on an action that is not a tool action, under `defaults` or in a `records` entry; `stub: true` on a tool with `granularity: File` (a FILE tool decides how many records it returns), on a built-in tool (a router, a join, the result of a loop) and on a tool whose output schema is not known before the run; `errors`, `break_rules`, `judge`, `latency_ms` and `error` on a tool action, which describe a model call; `pin` on a tool action without `stub: true`; a `pin` field that the output schema of the stubbed tool does not declare; and a tool action in `batch.fail`. A real run does not read the scenario. The run prints `SANDBOX: the scenario stubs these tool actions, so their code does not run: <names>` on stderr, and the line of a stubbed tool shows `(stubbed)` after its time (`ActionCompleteEvent.stubbed`). `agac inspect --sandbox` takes `--scenario`, reads `sandbox.yml` by default, and marks a stubbed tool `stubbed by the sandbox scenario: its code does not run` in `inspect action`. The `book_catalog_enrichment` example has a `sandbox.yml` that stubs `retrieve_candidates`, the tool that calls a web API, so its sandbox run sends no HTTP request."
