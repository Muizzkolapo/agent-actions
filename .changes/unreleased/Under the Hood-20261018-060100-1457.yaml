kind: Under the Hood
body: >-
  `result_collector.write_record_dispositions` is gone. Nothing in a run called it:
  batch dispositions are written by the shared collector through `collect_batch_rows`,
  which clears each record's `deferred` mark after. The tests that pinned the
  write-before-clear order, the warning for a record with no `source_guid`, and batch's
  parity with online (disposition, reason, input snapshot, detail) on that function now
  drive `collect_batch_rows` against a real store, and the minting-action re-run tests
  set up their dispositions through the collector. (#1457)
time: 2026-10-18T06:01:00Z
