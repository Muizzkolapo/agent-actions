kind: Enhancement or New Feature
body: "A sandbox scenario can be kept per workflow: with no `--scenario`, a sandbox run of workflow `<wf>` (`agac run --sandbox`, `agac retry --sandbox`, `agac inspect --sandbox`) reads `sandbox.<wf>.yml` at the project root when it exists, else `sandbox.yml`, else the `happy` preset; `--scenario` still wins. A `sandbox.yml` that names the actions of one workflow no longer has to block the sandbox runs of the others. The names are still checked strictly against the workflow that runs, and when the refused file is `sandbox.yml` in a project of more than one workflow, the refusal adds one line: put a scenario for one workflow in `sandbox.<workflow>.yml`. The scenario files are user configuration: `agac clean`, `--fresh` and `reset_workflow.py` do not delete them."
time: 2026-11-25T15:00:00Z
