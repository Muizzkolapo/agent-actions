kind: Enhancement or New Feature
body: "A sandbox scenario can be kept per workflow: with no `--scenario`, a sandbox run of workflow `<wf>` (`agac run --sandbox`, `agac retry --sandbox`, `agac inspect --sandbox`) reads `sandbox.<wf>.yml` at the project root when it exists, else `sandbox.yml`, else the `happy` preset; `--scenario` still wins. A `sandbox.yml` that names the actions of one workflow no longer has to block the sandbox runs of the others. The names are still checked strictly against the workflow that runs, and when the refused file is `sandbox.yml` in a project of more than one workflow, the refusal adds one line: put a scenario for one workflow in `sandbox.<workflow>.yml`. The scenario files are user configuration: `agac clean`, `--fresh` and `reset_workflow.py` do not delete them. A preset keeps the tool stubs of the project: `--scenario happy` and `--scenario chaos` keep each `actions` entry of the project file (`sandbox.<wf>.yml`, else `sandbox.yml`) that sets `stub`, with its `pin`, and take everything else from the preset, so `agac run --sandbox --scenario chaos` of the `book_catalog_enrichment` example does not call its web API. The stub notice then ends `(the stubs come from <file>, the rest from preset <name>)`, and a refusal of a kept entry names `preset <name> with the stubs of <file>`. `--scenario <path>` uses only that file. The stub notice prints once per command, after the scenario passed every check: `agac run --sandbox --wait` and `agac retry --sandbox --all` no longer repeat it for each pass, and a scenario that the output check refuses prints none."
