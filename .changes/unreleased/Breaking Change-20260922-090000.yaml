kind: Breaking Change
body: "A workflow file now declares every top-level key it accepts and refuses the rest, the same rule `defaults:` already follows applied to the surface holding it. A misspelled `defaults:` used to be dropped in silence, taking every setting in the block with it: each action fell back to hardcoded defaults, the run completed, and nothing said a configuration section had been discarded. The refusal names the declared key a stray one resembles and lists the keys a workflow takes. Any workflow carrying a top-level key the framework does not read now fails at load and must drop the key. Two keys the framework does read are now declared rather than tolerated by accident: `tool_path`, which takes precedence over the default config and over `tool_path` in `agent_actions.yml`, and `storage`, whose `prompt_trace_retention_runs` and `source_data_ttl_days` are validated for the first time. That block is strict about its values because the code that consumes it reads the raw file rather than the validated model: `prompt_trace_retention_runs: \"10\"` used to validate as a number and hand the backend the string, failing the run after every action had succeeded, and `true` became a one-day retention without saying so. Both are refused now, as is a `storage:` block written with no value under it. `0` remains accepted and still means never prune. The retired top-level `plan:` key, which nothing has read for some time, is refused along with everything else undeclared."
time: 2026-09-22T09:00:00Z
