kind: Bug Fix
body: 'A change to the staged input between the commands of a paused run now reaches every action. A file added reached the first action but not the actions after an open batch, and a file deleted was written back when its batch was collected. Now the added file is sent in a new batch, and the deleted file is stored empty. A plain `agac run --fresh` while a batch is open stops before it clears anything (exit 2), because the batch is paid for; `--fresh --abandon-in-flight` drops the batch on purpose (#1921).'
time: 2026-11-28T11:30:00Z
