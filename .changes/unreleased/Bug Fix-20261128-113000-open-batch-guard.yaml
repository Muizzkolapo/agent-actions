kind: Bug Fix
body: 'A change to the staged input between the commands of a paused run now reaches every action. A record added, changed or removed reached the first action but not the batch action that was waiting, nor the actions after it, and a deleted file was written back when its batch was collected. Now the run that collects the batch runs the batch action again, keeping its answers: it sends the added and changed records in a new batch and forgets the records no longer staged. A plain `agac run --fresh` while a batch is open stops before it clears anything (exit 2), because the batch is paid for; `--fresh --abandon-in-flight` drops the batch on purpose (#1921).'
time: 2026-11-28T11:30:00Z
