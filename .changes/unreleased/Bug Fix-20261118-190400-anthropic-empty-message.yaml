kind: Bug Fix
body: "An Anthropic message with no content blocks now ends its record the same way online and in batch. In text mode, batch gave it to the action's `on_empty` and online raised `Empty response content from Anthropic API`. Both now give a message the model ended itself (`end_turn` or `stop_sequence`) with no blocks, or with an empty text block, to `on_empty`: `warn` fails the record, `error` fails the action and `skip` keeps the record as a tombstone. A message that was stopped (`max_tokens`, `refusal`) or that holds only a thinking block still fails with the error that names its stop reason. In JSON mode, batch applied `on_empty` where online stores a parse error; batch now stores the same parse error, `No tool_use block in response (stop_reason=end_turn)`, which `expect: {repair: auto}` can regenerate."
time: 2026-11-18T19:04:00Z
