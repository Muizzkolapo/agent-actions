kind: Bug Fix
body: "A stored record's `metadata` no longer takes values from the model's answer, and it holds the same keys online and in batch. Online read it from the parsed answer, so on an action with an `expect:` block a schema field named `id`, `model`, `finish_reason`, `status_code` or `usage` was copied into `metadata`: an answer with `id: \"42\"` gave `metadata.request_id: \"42\"`, and a field named `model` replaced the model name. Batch wrote the vendor's own dict, which differed by vendor (`model_version` and `response_id` for Gemini, `stop_reason` and `result_type` for Anthropic, `created` and `system_fingerprint` for OpenAI) and had no `provider`. Both now write `model` and `provider` from the action's config. A batch record also holds `finish_reason`, the reason the provider gave for the end of the answer, under that one name for every vendor; an online record does not hold it. A failed batch row keeps `finish_reason` alone of the vendor's metadata, beside its `reason`. The output of a tool or HITL action is not read for these keys either."
time: 2026-11-18T19:07:00Z
