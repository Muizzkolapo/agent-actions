kind: Enhancement or New Feature
body: 'Two tools now run inside agac, with no UDF of the project: an action carrying the internal key `_builtin` runs `route` or `pick` (its `impl` is `agac.route` or `agac.pick`, which no project function can be named, so a project tool called `route` is never run in its place). `route` writes the case of each record, the value of a field when it is one of its cases, else `default`; `pick` writes the output of the one action of a list the record holds an output of. The checks that read a tool''s source before a run, `agac validate-udfs` and the preflight UDF lookups, leave both alone. A router''s line in the run output counts its records per case, as `router 6 records in 0.1s — a 2, b 3, default 1`.'
