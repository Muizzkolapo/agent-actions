kind: Enhancement or New Feature
body: 'Two tools now run inside agac, with no UDF of the project: an action carrying the internal key `_builtin` runs `route` or `pick` (its `impl` is `agac.route` or `agac.pick`, which no project function can be named, so a project tool called `route` is never run in its place). `route` writes the case of each record, the value of a field when it is one of its cases, else `default`; `pick` writes the output of the one action of a list the record holds an output of. The checks that read a tool''s source before a run, `agac validate-udfs` and the preflight UDF lookups, leave both alone. A router''s line in the run output counts its records per case, as `router 6 records in 0.1s — a 2, b 3, default 1`. The `_builtin` spec is checked at load: `route` needs `field` (text), `cases` (a list of text, not `default`) and `default` (true or false); `pick` needs `of`, a list of actions the action depends on; an unknown key or tool, and an `impl` other than `agac.<tool>`, are refused. Pre-flight refuses a built-in tool per file and a router whose observe does not give it its field (the top field by name, or `*`). At run time, `route` refuses a record that holds no value at its field, and `pick` refuses a record that holds an output of two of its actions. An edit of the spec is an edit of the action, named as an edit of its routing, and a built-in tool hashes no project function of the same name. The editor does not report `impl: agac.route` or `agac.pick` as unresolved.'
