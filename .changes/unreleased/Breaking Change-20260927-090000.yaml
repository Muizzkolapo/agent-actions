kind: Breaking Change
body: "A removed field spelling is now refused in the `default_agent_config:` block of `agent_actions.yml`, not only on an agent. The check already ran on each legacy `agents:` entry, so `depends_on:` or `skip_if:` written there failed at load naming its replacement — but the same key one level up, in the block merged into every agent, was accepted. That made the block an escape hatch from the refusal rather than a gap in it: the natural move after hitting the per-agent error is to hoist the key so it applies everywhere, which made the error disappear and the setting stop working across every agent at once. `depends_on` was the worse of the two. The canonical `dependencies` stayed empty, so the action read as having no upstream and DAG ordering changed silently instead of merely losing a setting; `skip_if` left `skip_condition` unset, so nothing was ever skipped. Both keys reached the runtime agent config and were visible to anything that dumped it, read by nothing. Migrate as on an agent: `depends_on` becomes `dependencies`, `skip_if` becomes `skip_condition`. No project config in this repository, its examples, or its test corpus carried either spelling in that block, so the refusal should reach no existing workflow."
time: 2026-09-27T09:00:00Z
