kind: Bug Fix
body: >-
  `agac inspect` now refuses `granularity: file` on an LLM action, as `agac run` already did,
  and both print the reason on the Problem line. A `granularity: file` under `defaults:` no
  longer marks an LLM action as File: the action runs at Record, as it always did. An action is a
  tool or HITL action by `kind` (including one set under `defaults:`) or by `model_vendor`, as
  the runtime routes it, so a `kind: tool` set under `defaults:` and a HITL action named only by
  `model_vendor: hitl` are now handled as those kinds throughout loading. An inherited
  `granularity: file` on an LLM action is reported.
time: 2026-11-06T21:00:00Z
