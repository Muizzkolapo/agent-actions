kind: Enhancement or New Feature
body: 'A workflow file can read an environment variable as it loads with `env(name, default)`, such as `run_mode: {{ env(''AGAC_RUN_MODE'', ''online'') }}` or `model_name: {{ env(''AGAC_MODEL'', ''claude-haiku-5-5'') }}`. The value comes from the environment of the `agac` command, which holds the project''s `.env`; a variable the shell sets keeps the shell''s value. An unset variable gives the default, and a variable set to an empty string counts as set. An unset variable with no default fails the load with an error naming the variable and the workflow file. `env` works in the workflow file and in `templates/` files, in the same places as `load_prompt`; a prompt that renders for each record can use it only in its own `{{ }}` tag, where it renders at load. The value is written into the rendered workflow, so a changed value is named as the same edit written in the file would be. `api_key` is unchanged. Branch files and agent_actions.yml are not rendered and do not have it.'
time: 2026-11-16T12:00:00Z
