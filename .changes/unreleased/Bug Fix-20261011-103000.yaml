kind: Bug Fix
body: >-
  A block prompt that ends the workflow file keeps its final newline. The file is rendered
  through Jinja before it is parsed, and Jinja drops one final newline from what it
  renders, which for a block scalar at the end of the file is the value's own line break.
  The last action's prompt was therefore sent without the newline the same prompt has
  anywhere else, online and under batch, and adding an action below it gave the newline
  back. The prompt is part of the action's config hash, so that read as an edit: agac
  reset an action nobody had touched and sent every record to the model again. The prompt
  is now what it is wherever it sits in the file. A completed action whose block prompt
  ends its workflow file is re-run once on the first run after upgrading, because its
  stored hash was taken over the prompt without the newline. An include of a `templates/`
  file joins what follows it as before.
