kind: Bug Fix
body: 'A version merge and a batch action run again with carried records no longer hold every file they read. A version merge read every file of every version whole before its walk began, and kept the merged input of every file, with each version file in the store''s cache, until the walk ended. Correlation pairs rows within one file, so each file is now read and correlated once to check it before the walk, then again when the walk processes it, and let go after; which rows correlate, and which files the merge takes, are unchanged, and a record that cannot be aligned still stops the merge before it processes any file. A batch action that carries records read its own stored output for each file to decide which carried records to send again, and that output stayed in the store''s cache until the walk ended; it is now let go once the carried records of the file are decided. On a synthetic run of 8 files of 400 records and 4 versions, the merge''s peak memory fell from 534-558 MB to 334-335 MB; a batch re-run over 8 files with 200 carried records each fell from 220 MB to 187-188 MB.'
