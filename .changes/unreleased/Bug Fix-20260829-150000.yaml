kind: Bug Fix
body: "Structured fields passed to a logger via `extra=` now reach the persisted event. The logging bridge copied exactly three of them — `operation`, `action_name`, `workflow_name` — and dropped everything else, so a failure named the action but never the record. Call sites that pass `custom_id`, `record_id` or `batch_id` this way produced entries reading `\"data\": {\"operation\": \"process_batch_item\"}` with the identifier missing, which is precisely the field needed to trace the failure. On a real project, an identical failing run went from 9 distinct persisted data keys to 18. Naming the three missing keys would have left the same gap for the next call site, so the bridge now copies whatever the caller supplied, excluding attributes derived from a real LogRecord rather than a hand-kept list — the redaction filter's own list shows why that matters, since it names `batch_id` and `item_id` as reserved even though they are caller fields. Widening the copy does not widen exposure: the redaction filter already covered `extra` fields, and a secret passed that way is still written as `[REDACTED]`."
time: 2026-08-29T15:00:00Z
