kind: Bug Fix
body: "Every `on_exhausted: raise` site now tags its exception with the policy, so a deliberate halt is recognisable wherever it came from. Previously only the online retry-exhaustion site did; batch retry exhaustion, both reprompt exhaustion sites and batch reprompt exhaustion raised a bare RuntimeError that the next run read as an ordinary, resettable failure — including `reprompt.on_exhausted`, a first-class config field with the same semantics as `retry.on_exhausted`. The exception type is deliberately unchanged: batch's own handler re-raises RuntimeError ahead of a generic except that would otherwise swallow the halt. The online per-record loop, which re-raises a fixed list of action-fatal types and flattens the rest, now also lets a policy halt through — without that the reprompt tagging had no end-to-end effect. Separately, the halt now survives file processing: that layer collects each per-file failure and raises its own error afterwards, outside any except block, so nothing linked the two; it chained the first error, which lost the halt whenever another file failed first, and dropped it entirely past the tracked-error cap. It now chains the halting cause and captures it outside the cap. Batch mode remains unfixed and is filed separately: a batch action's deferred retries never reach exhaustion, so the policy never fires there at all."
