kind: Bug Fix
body: 'A prompt-store prompt (`prompt: $file.Prompt`) that reads a macro or a variable of the project `templates/` folder no longer fails every record with "references undefined variables". The per-record render has no `templates/`, and a store prompt was put in after the load had rendered the workflow, so its `templates/` names reached the record undefined. It now goes through the load as a prompt written in the workflow file does: a tag reading only `templates/` names renders at load, and a macro used beside a per-record name fails the load naming the store prompt. A store prompt that reads no `templates/` name is unchanged.'
time: 2026-11-16T13:00:00Z
