kind: Bug Fix
body: 'A retry of one record no longer answers again every record of its file below two FILE tools. A FILE tool''s row written again with only new `lineage_sources` (the node ids of the rows it was made from) is now put back as stored. A FILE tool below another one now decides what is below it when it writes its file again, so the actions between and below the two keep their answers for the records whose row did not change. An online guard skip that holds what its stored row holds keeps that row. Before, every LLM action below the second FILE tool answered each record of the file again.'
time: 2026-11-22T20:00:00Z
