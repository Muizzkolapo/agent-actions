kind: Bug Fix
body: "A pre-flight refusal from `agac inspect` or `agac expect list` names the workflow. It printed `Invalid configuration in agent 'unknown'` or `Operation Failed: command`, because the refusal did not carry the workflow name. `agac inspect action`, `inspect context`, `schema`, `dispositions`, `retry` and `run` named it only because their `--agent` option is passed to the error output under the same key."
time: 2026-11-14T21:30:00Z
