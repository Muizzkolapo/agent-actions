kind: Bug Fix
body: "A batch action's retries now reach exhaustion, so retry: {on_exhausted: raise} halts instead of resubmitting forever. When a batch comes back with records missing, the framework submits a recovery batch and leaves the parent job at COMPLETED. Nothing skipped that parent afterwards, so every subsequent agac run re-read it and started a second recovery from attempt 1: retry_attempt never climbed to max_attempts, the exhaustion policy had nothing to fire on, and the action cycled batch_submitted -> failed -> reset -> batch_submitted indefinitely, submitting a new batch job — and paying for it — on each pass. A parent that a recovery batch has taken over is now skipped, and the recovery entry it spawned is processed in its own right, which is where the attempt counter advances. The same re-read also overwrote the recovery registry entry; because replacing an entry evicts the old batch id from the registry's id index, the processing loop then asked for a client for an id the registry no longer knew and the whole run died with 'Cannot determine client for batch_id'. The loop now re-reads each entry from the registry as it reaches it rather than trusting the snapshot it took up front, since processing one entry registers the next attempt and removes finished siblings while the loop is still running."
time: 2026-08-30T10:00:00Z
