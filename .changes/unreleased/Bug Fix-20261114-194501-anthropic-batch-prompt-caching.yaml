kind: Bug Fix
body: "enable_prompt_caching now applies in batch mode. An Anthropic batch action that enables it sends each request with its system prompt and message marked cache_control ephemeral, as online does, on the first submission and on each retry and repair round. Before, the setting did not reach the batch client. Two actions that differ only in this setting no longer share a batch client."
