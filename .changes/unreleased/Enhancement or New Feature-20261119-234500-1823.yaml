kind: Enhancement or New Feature
body: 'Inside a branch included with `as:`, prompts, tools and schema files read a sibling by its short name, so one prompt, one tool function and one schema file serve every instance. The load puts before each prompt of an instance a header of one `{% set write = c2__write %}` tag per short name the prompt reads; the prompt text, its rendered output and its line numbers are unchanged, and a macro the prompt defines sees the short names too. The static checks of `agac inspect` and `agac run` read a short name as the action it means, so a missing observe or a missing field is reported against `c2__write`, and a prompt that reads a short name the branch does not define and no input binds is refused; text in single braces (`{item.name}`), which renders as written, reads nothing there. A tool action of an instance gets its record keyed by the short names: `data["write"]` holds the output of the same instance''s `write`, and the final name is not a key; a FILE-granularity tool still gets final names. The preflight bus-namespace warning accepts a short name. The `context` of each `llm_judge` rule in an instance action''s schema file, on a field or in the file''s `expectations:` block, is renamed in that action''s own copy of the compiled schema; a named `suite:` is not. `agac inspect` marks each action of an instance `from branch <name> as <instance>`, and `agac inspect action` shows the instance''s name map in a `Names` row and under `branch` in `--json`.'
