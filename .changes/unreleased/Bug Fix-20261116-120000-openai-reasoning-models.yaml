kind: Bug Fix
body: "OpenAI reasoning models (the o-series and gpt-5) now run with max_tokens. An openai action sends its max_tokens as max_completion_tokens, online and in batch, because OpenAI refuses max_tokens on these models and rejected every record. An openai action with base_url, a llamafile action and a declared endpoint still send max_tokens. A batch request no longer sends temperature: null when the action sets none. Preflight refuses a temperature other than 1 on a reasoning model, which OpenAI refuses, where the batch client dropped it for three model names and sent it for the rest. A refusal from the model is quoted in the error, online and in batch, where it showed as an empty response. The endpoint probe of --verify-keys reports an HTTP 400 that does not name response_format with the server's text, and a reply with no text with its reason, where both read as a server that does not honour json_schema."
time: 2026-11-16T12:00:00+00:00
