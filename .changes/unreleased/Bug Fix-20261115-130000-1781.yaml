kind: Bug Fix
body: 'Requests on the newest SDK versions the pins allow work again (#1781). An online Anthropic JSON request offers the schema tool without forcing it, because a forced tool made claude-haiku-5-5 return nested arrays as a JSON string, and a finished text answer is read as JSON (fenced or bare) like the other vendors'' answers. On anthropic 1.x and later, whose `create` takes no `temperature` or `top_p`, agac sends them in `extra_body` instead of failing in the SDK. A declared endpoint that authenticates through another header works on openai 3.x. A new CI job runs the provider tests on the newest allowed SDKs.'
time: 2026-11-15T13:00:00Z
