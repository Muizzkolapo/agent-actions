kind: Enhancement or New Feature
body: "The `agac-provider` mock now meets the expectation rules of the action as well as its schema, online and in a batch. It reads the same rules as the run (the inline `expectations:` list, the rules of the schema file and a named `suite:`). It makes strings from a schema `pattern` or a `matches_regex` rule, picks from `enum` and `accepted_values`, and keeps word counts, item counts and non-null values in range. The real check tests `expression` rules and custom checks. Thus a `repair: auto` loop ends on the first generation. An output field that a `context_scope.observe` reference names exactly gets the input value, so ids stay the same between actions. If no value meets the constraints of a field, the mock logs one warning that names the action, the field and the constraints, and the run continues."
time: 2026-11-23T21:00:00Z
