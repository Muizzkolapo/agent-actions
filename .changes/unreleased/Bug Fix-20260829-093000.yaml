kind: Bug Fix
body: "An action that halted on `on_exhausted: raise` now stays halted. `raise` means \"stop, a human needs to look at this\", but every subsequent `agac run` reset the action to PENDING and re-ran it — the failure is deterministic, so it burned the same model calls and reached the identical halt, indefinitely. Leaving the status FAILED was not enough on its own: the executor has no FAILED branch, so the action ran again whatever the status said. The failure now carries a marker on its node-level disposition — set from the `on_exhausted` policy the raising code already attaches to the exception — the startup reset skips those actions and preserves their dispositions, and the executor refuses to re-run one, naming `agac dispositions`, `agac retry` and `agac run --fresh` as the ways forward. An ordinary failure is still reset and still retried on the next run, so nothing changes for a provider hiccup."
time: 2026-08-29T09:30:00Z
