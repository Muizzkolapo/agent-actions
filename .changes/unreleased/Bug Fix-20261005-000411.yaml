kind: Bug Fix
body: >-
  A batch action now stores a file that took no input empty on its first run, as online
  stores it: one the action above holds nothing for, one whose every record a guard
  upstream filtered, or a staged file that is empty. With nothing stored for that file
  yet, the run stored nothing for it, so the actions reading it found no such file where
  online hands them an empty one, and the readers of an action whose every staged file
  was empty were skipped for finding no input file; they now complete over the empty
  files, as they do online. A file the action stored before was already written empty in
  that case, and a repair still writes nothing over it.
time: 2026-10-05T00:04:11Z
