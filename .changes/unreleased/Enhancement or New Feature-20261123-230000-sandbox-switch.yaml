kind: Enhancement or New Feature
body: "`agac run --sandbox` runs a workflow with no model call and no API key. The `agac-provider` mock answers each LLM action, tool actions run their own code and HITL actions approve each record. The workflow file does not change. A sandbox run writes its store to `agent_io/store/<workflow>.sandbox.db` and its status, logs, run history and batch input files to `agent_io/sandbox/`. It does not read or change the output of real runs, and it does not write the declared `outputs:`. `--sandbox` on `status`, `records`, `traces`, `usage`, `preview`, `dispositions` and `expect report` reads the sandbox output. `retry --sandbox` retries a sandbox run, and `inspect --sandbox` shows the workflow as a sandbox run runs it. `agac clean --all` also removes the sandbox output and reclaims the batch records that the sandbox store names, and the `reset_workflow.py --full` script of the skills also removes the sandbox output. The mock now counts the attempts of each record separately, and each run counts again from the first attempt, so the first answer of each record in a run is its first attempt. A batch action on the mock no longer looks up an `api_key` that the defaults name."
