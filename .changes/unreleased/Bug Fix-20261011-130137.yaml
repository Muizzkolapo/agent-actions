kind: Bug Fix
body: Pre-flight no longer refuses a valid guard clause as invalid field names. A raw-text pre-check split the clause on operator words, ignoring quotes and parentheses, and rejected a string literal containing one of those words, a parenthesised clause ending in a field, or a function call, even though the grammar that runs afterward already accepts each one correctly.
