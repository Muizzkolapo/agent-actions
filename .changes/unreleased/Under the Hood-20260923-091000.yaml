kind: Under the Hood
body: "An API data source caches its response as a staging document, because the cache file is what the walk reads. A response that is already a list is cached unchanged; anything else is cached as the single record it has always staged as, so every response shape stages exactly what it staged before. Cache entries written by an earlier version are rewritten once, in place, the next time the data source is resolved — every entry in the directory, since the walk reads all of them and a renamed action or a sibling start node leaves entries beside the one being fetched. The payload is unchanged and no request is made, so an upgrade needs neither a manual step nor a reachable endpoint. An entry that cannot be read, or a directory that cannot be written, now fails naming the file and the remedy."
