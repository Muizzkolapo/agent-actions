kind: Under the Hood
body: "An API data source caches its response as a staging document, because the cache file is what the walk reads. A response that is already a list is cached unchanged; anything else is cached as the single record it has always staged as, so every response shape stages exactly what it staged before. A cache entry written by an earlier version is rewritten once, in place, the next time it is reused — the payload is unchanged and no request is made, so nothing needs deleting and the endpoint need not be reachable. An entry that cannot be read now fails naming the file and the remedy rather than surfacing later as a parse error with no cache in sight."
