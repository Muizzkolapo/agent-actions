kind: Bug Fix
body: "An action-fatal error raised while processing one input file is no longer discarded because another file succeeded. Previously the file collector escalated only when *every* file failed, so an `on_exhausted: raise` halt, a `ConfigurationError`, an `EmptyOutputError` or a `SchemaValidationError` hit on one file of many was demoted to a log line: the action resolved COMPLETED, no node-level failure disposition was written, the halt marker never survived, and both resume paths were dead — a plain re-run skipped the action and `agac retry` had nothing to clear. The processing strategies already re-raise this set out of their per-record loops; `is_action_fatal` now states it once so the collector and the strategies cannot drift apart. Each collector branch finishes its walk, then raises — successful records are checkpointed as they complete, so they survive and a resume keeps them — and the executor records status FAILED, the node-level failure disposition and the halt marker as it does for a total failure. File-scoped accidents (an unreadable file, a per-record context error) remain per-file failures as before."
