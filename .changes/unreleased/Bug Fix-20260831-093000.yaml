kind: Bug Fix
body: "An action-fatal error raised while processing one input file is no longer discarded because another file succeeded. Previously the file collector escalated only when *every* file failed, so an `on_exhausted: raise` halt, a broken configuration, or an empty output under `on_empty: error` hit on one file of many was demoted to a log line: the action resolved COMPLETED, no node-level failure disposition was written, the halt marker never survived, and both resume paths were dead — a plain re-run skipped the action and `agac retry` had nothing to clear. Which errors are fatal is now declared by the layer that knows — the record, file-tool and HITL processing loops, and the template renderer, which alone can tell a malformed template from a render that one record's data provoked — and read back through the exception chain, so a wrapper added on the way up cannot hide it. An error nobody declared stays a per-file failure whatever its type, which keeps a per-item schema violation, an unreadable file, an incomplete record context, and staging data that must be corrected scoped to the input that caused them. Each collector branch finishes its walk before raising, and the executor then records status FAILED, the node-level failure disposition and the halt marker as it does for a total failure. A halt keeps everything: its dispositions are preserved, the action refuses to re-run, and `agac retry` resumes without re-billing the records that succeeded. Any other action-fatal error is an ordinary failure the next run resets, so its files keep the output they wrote but are processed again."
