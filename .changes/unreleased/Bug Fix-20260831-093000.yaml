kind: Bug Fix
body: "An action-fatal error raised while processing one input file is no longer discarded because another file succeeded. Previously the file collector escalated only when *every* file failed, so an `on_exhausted: raise` halt, a `ConfigurationError`, an `EmptyOutputError` or a `SchemaValidationError` hit on one file of many was demoted to a log line: the action resolved COMPLETED, no node-level failure disposition was written, the halt marker never survived, and both resume paths were dead — a plain re-run skipped the action and `agac retry` had nothing to clear. The same swallow is fixed in the batch result loop, where a halt raised while one batch file had already processed was logged, its records overwritten as abandoned, and the batch resubmitted on the next run at the provider's price. Which errors are fatal is now declared by the layer that knows — the processing loops that deliberately re-raise instead of tombstoning, for both record and file granularity — and read back through the exception chain, so a wrapper added on the way up cannot hide it and an error nobody declared stays a per-file failure whatever its type. Each collector branch finishes its walk before raising, and the executor then records status FAILED, the node-level failure disposition and the halt marker as it does for a total failure. A halt keeps everything: its dispositions are preserved, the action refuses to re-run, and `agac retry` resumes without re-billing the records that succeeded. Any other action-fatal error is an ordinary failure the next run resets, so its files keep the output they wrote but are processed again. File-scoped accidents — an unreadable file, a record whose context is incomplete, staging data that must be corrected — remain per-file failures as before."
