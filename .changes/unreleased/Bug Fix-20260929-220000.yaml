kind: Bug Fix
body: >-
  The documentation catalog now reports the `context_scope` the runtime applies, and expands a
  version range the way the runtime does. `WorkflowParser` copied each action's own
  `context_scope` block and nothing else, so two directives a run honours were invisible: a
  `defaults.context_scope`, which `deep_merge_context_scope` union-merges into every action —
  an action declaring no scope of its own reported no drop while the runtime dropped a field
  on it — and a reference naming a version base, which `normalize_context_scope` rewrites into
  one ref per variant before the runtime sees it, so the panel named a namespace no action
  answers to. Both now go through the same two functions the runtime uses. Separately, the
  parser's own version expansion read a two-element `range` literally where the runtime reads
  it as an inclusive start and end: `range: [2, 5]` documented two actions for a run of four.
  All three sites that derive a variant name now share one definition, pinned against each
  other by test.
time: 2026-09-29T22:00:00Z
