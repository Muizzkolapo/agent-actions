kind: Breaking Change
body: '`versions.mode` and `version_mode` are no longer config keys, and a `versions:` block is now validated. Version fan-out turns each version into its own action in the dependency graph, so the graph decides what order they run in and nothing ever read either key: `mode` was dropped at the render step that expands the block, and `version_mode` reached every expanded agent carrying the literal string `parallel` whatever the workflow asked for. A workflow writing `mode: sequential` validated, loaded, showed `version_mode: parallel` on every agent, and ran in parallel. The order that key claimed already works and is what the reference doc''s own Sequential Refinement example uses — chain the versions with `dependencies: ["<action>_${i-1}"]`, and each iteration lands in its own execution level; `--execution-mode sequential` serialises a whole run, `--concurrency-limit` caps how many actions run at once. Both spellings are now refused with that guidance rather than accepted and ignored, on every surface that carries agent settings. `mode: parallel` is refused too: it agreed with the behaviour but configured nothing, and deleting the line is the whole migration — the 14 blocks in this repo''s examples, fixtures and sample project have had it removed. The block is validated at the render step because that is the last point anything holds it: it is stripped from the action before the workflow model validates, so until now a misspelt `param` was silently replaced by the default `i` and a malformed `range` failed somewhere downstream instead of at load. `version_number`, written onto every expanded agent and read by nothing, is removed as well; the same value is in `_version_context` under `i`, which is what consumers read. `versions.items_from`, a reference the static analyser looked for in a key the block never declared and no workflow writes, is removed with them.'
time: 2026-09-26T19:00:00Z
