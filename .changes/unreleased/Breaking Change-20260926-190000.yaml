kind: Breaking Change
body: '`versions.mode` and `version_mode` are no longer config keys, and a `versions:` block is now validated. Version fan-out turns each version into its own action in the dependency graph, so the graph decides what order they run in and nothing ever read either key: `mode` was dropped at the render step that expands the block, and `version_mode` reached every expanded agent carrying the literal string `parallel` whatever the workflow asked for — including the versions of a dependency chain, which do run one at a time. A workflow writing `mode: sequential` validated, loaded, showed `parallel` on every agent, and ran in parallel. Both spellings are refused now, on every surface that carries agent settings, with the ordering that works named in the message: chain the versions with `dependencies: ["<action>_${i-1}"]` and each iteration lands in its own execution level; `--execution-mode sequential` serialises a whole run and `--concurrency-limit` caps how many actions run at once. `mode: parallel` is refused too — it agreed with the behaviour but configured nothing, and deleting the line is the whole migration, done here for the 14 blocks in this repo''s examples, fixtures and sample project. `version_number`, written onto every expanded agent and read by nothing, is removed as well; the same value is in `_version_context` under `i`, which is what consumers read. `versions.items_from`, a reference the static analyser looked for in a key the block never declared and no workflow writes, is removed with them, and the editor integration no longer offers `mode`, `source` or `pattern` as keys of the block — it completes what the block actually declares.


  A chained-version workflow now loads. The reference guide''s own Sequential Refinement example is `dependencies: ["<action>_${i-1}"]`, and for the first version `${i-1}` resolves to nothing, leaving a bare `<action>_` that the workflow''s dangling-dependency check refused — so the documented pattern, and the migration this change asks for, failed at load. The first version now drops a dependency that names a predecessor it does not have, which is what the guide always claimed happened.


  The block is validated at the render step because that is the last point anything holds it: it is stripped from the action before the workflow model validates, so `mode: banana` and a misspelt `param` both reached the runtime accepted, the misspelling silently replaced by the default `i`. Validation names the action and the key at fault. Three shapes that used to pass are now refused: a `range` of two non-integers, which is read as an inclusive `[start, end]` and failed arithmetic at expansion; an empty `range`; and a descending pair — the last two expand to no versions, which removes the action from the workflow and surfaced only as a dangling-dependency error against whatever depended on it. A `range` of three or more values still expands over those values, names included (`range: ["literal", "idiomatic"]` as a pair is the one form that must now be spelled out in full), and a block with no `range` still expands to one version.'
