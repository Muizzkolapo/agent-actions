kind: Under the Hood
body: 'CI runs the tests as six shards, balanced by the times CI''s own runners take: each shard''s log ends with a `shard durations:` line (`pytest --report-shard-durations`), and tests/shard_durations.json holds those times. `--store-shard-durations` now updates the file, so a partial run keeps the times of the files it did not reach.'
time: 2026-11-28T16:00:00.000000000+00:00
