kind: Bug Fix
body: >-
  Batch carry-forward no longer guesses whether a stored row's input still exists. Matching
  stored rows to a run by identity alone could not tell an upstream action minting its
  children again from a record that left the input. Below an expansion, an action that answers
  one row per input kept every previous run's rows beside the new ones, growing by its input
  size each run; and where a file received a new batch of records, the earlier batch's rows
  from an expanding action were dropped without being asked. A batch run now records the
  upstream records that exist for each file, including those a guard filtered, and the staged
  record each one descends from. A stored row is dropped only when its input no longer exists
  upstream, new inputs were made from the same staged record, and the run settled every input
  made from it. A row whose input was filtered, skipped, failed or left out by a limit is
  kept, and so is every row of a record that is no longer staged. Where a record has an input
  the run did not settle, its previous rows stay until a run that does. Batches submitted
  before this change carry no such record and finalize exactly as before.
time: 2026-10-03T01:00:00Z
