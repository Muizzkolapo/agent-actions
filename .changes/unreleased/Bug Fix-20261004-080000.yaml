kind: Bug Fix
body: "A skipped action whose input holds nothing now holds nothing either. A skip never rewrites stored output, so an action skipped because an upstream filtered every record, or a version merge skipped because every version came back empty, kept the rows it stored before, made from output that no longer exists, and `agac preview` showed them. Those rows are now deleted along with the dispositions and checkpoints that called them done. Rows stand while everything the action reads still holds rows, so a reader of an upstream that failed but kept its answers keeps its own, and a retry never deletes rows."
time: 2026-10-04T08:00:00Z
