kind: Enhancement or New Feature
body: '`agac usage -a <workflow> [--run <id>] [--json]` shows the model calls and tokens of each action: one row per action, kind of call (`main`, `repair`, `judge`), pricing (`online` or `batch`) and model, with the calls, the input, cache-read, cache-write and output tokens, and a total. It reads the sums each run keeps in the workflow''s store, so it answers while a run is going on, and it adds up the runs that submit and collect one batch; a judge batch of a batch action is `judge` at the `batch` price. `--run` shows one run by its id in `artefact/runs.json`. `agac run --fresh` clears the stored sums with the results; `runs.json` keeps each run''s. A new `prices:` block in `agent_actions.yml` gives the price of one million tokens per model (`input`, `output`, and optionally `cache_read`, `cache_write` and `batch_discount`, the share from 0 to 1 taken off a batch call), and with it the command adds an estimated cost column. Agent Actions ships no prices. Without the block the command shows tokens only and says a price table can be added; a model with no entry, or an entry lacking a price a row needs, shows no cost and is named, never 0.'
