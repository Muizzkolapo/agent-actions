kind: Breaking Change
body: >-
  Prompt traces are stored compressed. `compiled_prompt`, `llm_context` and
  `response_text` in `prompt_trace` are zlib blobs, each compressed against a
  dictionary made from the first value its action wrote, so `sqlite3` shows them as
  blobs. Read them with the new `agac traces -w <workflow> -a <action>`
  (`--record <target_id>`, `--json`). Rows written before this stay as text and read
  back as before; the other columns are unchanged, so metadata queries still work.
  (#1544)
time: 2026-10-21T12:00:00Z
