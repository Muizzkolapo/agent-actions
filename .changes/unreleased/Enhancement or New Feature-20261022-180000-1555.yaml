kind: Enhancement or New Feature
body: >-
  `model_vendor: llamafile` reaches a local llamafile server at
  `http://localhost:8080/v1` with no API key, through the OpenAI client. A runtime is
  one measured row in a profile table (`llm/config/runtime_profiles.py`), so the next
  OpenAI-compatible runtime costs a row, not a client. Preflight refuses batch mode on
  a runtime that has none and warns on a JSON action with no schema on a runtime that
  does not enforce `json_object`. The batch refusal for every vendor without batch now
  reads "Action 'X': vendor 'V' does not support run_mode: batch." with the hint
  "Set run_mode: online." (#1555)
time: 2026-10-22T18:00:00Z
