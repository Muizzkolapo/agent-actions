kind: Bug Fix
body: "`agac validate-udfs` now runs the structural preflight as well as the UDF checks, so it is a complete gate rather than half of one. It is the only preflight surface with \"validate\" in its name, and therefore the one a CI job tends to reach for, but it and `agac inspect`/`schema`/`run` checked disjoint things: a broken `impl:` reference failed `validate-udfs` and passed `inspect`, while a missing `context_scope:` passed `validate-udfs` and failed `inspect`. Either command alone let a real breakage reach runtime. The structural pass runs through the same WorkflowInspector façade `inspect` uses rather than assembling the config locally, because those checks read the fully expanded action shape while this command otherwise runs only two of the config pipeline's seven stages. A structural failure is now also reported: previously an added check would have exited non-zero while printing nothing, which is no more usable than not checking at all — the command names the failing fields and points at `agac inspect` for the full report."
time: 2026-08-29T14:00:00Z
