kind: Bug Fix
body: 'A batch action with a `retry:` block resends only a record whose failure online would retry: a rate limit (429), a server error (5xx), a transient 400, or an answer cut off at the output limit before any content. A record answered with any other HTTP error, such as a 400 for a bad request, or with no content, such as a refusal or a safety block, is failed at once with what the provider said, as online fails it. Batch resent every unanswered record until `max_attempts` was spent and ended them EXHAUSTED. Each failed line now carries the HTTP status its request was answered with (OpenAI, Groq and Ollama lines their status, Anthropic the status of its error type, Gemini its error code), and an OpenAI-shaped line''s error reads `HTTP <status>: <message>`. A failure whose line gives no status, such as an expired or canceled request, is resent as before.'
time: 2026-11-16T10:40:00Z
