kind: Enhancement or New Feature
body: 'New `agac retry --all [--max-passes N]` repeats the retry until no failure is left. One `agac retry` starts at the earliest action that holds a failed or exhausted record, so a failure of another record in a sibling action stayed and each project looped the command itself. With `--all`, each pass is that retry; after it the command reads the failures again, prints `Pass N: M open failure(s) left`, and stops when none is left (exit 0), when a pass did not lower the count, after `--max-passes`, when a pass submitted a batch (exit 4) or on a provider quota stop (exit 5). It exits 3 while failures remain, and 1 when an action failed as a whole. `--all` refuses `--from`, `--record` and `--filter`; with `--dry-run` it shows the first pass and the count and changes nothing. A single retry that leaves failures in other actions now names `--all` in its note.'
