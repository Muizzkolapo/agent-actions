kind: Bug Fix
body: A run with record_concurrency above 1 that is stopped with Ctrl-C no longer sends a record again on resume when the interrupt came while that record's answer was being saved. The answer had already left the set of records in flight, so it was neither saved nor kept for the resume. It now stays in that set until it is saved, and the interrupted run saves it.
