kind: Under the Hood
body: 'Four rules a batch run kept as its own copy of the online rule are now one function each, called by both modes: reading an Ollama JSON-mode reply (`read_json_reply`), ending an OpenAI or Groq answer that holds no content (`chat_no_answer`), putting an `add_dispatch` result on each object of an answer (`with_dispatch_results`), and reading an answered batch result into the items the result writer validates (`written_answer`, which the writer itself now calls). No run reads or stores an answer differently.'
