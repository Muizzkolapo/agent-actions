kind: Bug Fix
body: 'A judge batch now holds no more requests than the provider takes in one batch (100,000 for Anthropic, 50,000 for OpenAI, Groq and a provider that states no limit; `AGENT_ACTIONS_BATCH_MAX_REQUESTS` replaces it), and the values past the limit go out in the next judge batch, so a large file with many `votes` no longer stops the action at submission. A run stopped after a judge batch was sent and before its state was saved no longer writes the file with no records: the next run processes the file again from its main batch. A record that a retry batch recovered is no longer written as retry-exhausted when a judge batch or a repair round follows the retry, and a record the retry gave up on keeps the number of failures it counted.'
time: 2026-11-21T09:00:00Z
