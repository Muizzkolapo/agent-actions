kind: Bug Fix
body: >-
  A record an online action answered before its run stopped, or before the store failed to
  write its file, is now stored by the next run as the records that run answers are. With
  nothing of the file stored, the next run carries the record from its checkpoint without
  asking for it again, and it stored the row as the action had returned it: without
  lineage, metadata, a parent or a root, and with no entry of the action's in its state
  history, so every action reading it built its rows on a lineage cut short. An answer
  that failed to parse was stored as processed and the action recorded complete, where a
  run not stopped marks it failed. And a resumed run whose one answered record failed
  failed the action, saying every record had, and skipped its readers; it now completes
  with that failure, as a run not stopped does. A record carried from its checkpoint is
  still stored without `_recovery`, the retry details an answered record keeps, since the
  checkpoint does not save them. Rows an earlier version stored this way keep what they
  lack until the workflow is run with `--fresh`.
