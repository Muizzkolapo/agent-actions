kind: Under the Hood
body: 'A batch run now handles an action config that sets `add_dispatch` beside `schema: dispatch_task(...)` as an online run does: each object of a record''s answer holds the schema its dispatch chose, under the function''s name. It is put on the answer when the batch is read, so the rules of an `expect:` block, a repair prompt and the stored record read the answer an online run reads; a text answer (`json_mode: false`) gets it where it is stored. Preflight no longer refuses the pair under `run_mode: batch`. No workflow file reaches this yet: the workflow schema does not accept `add_dispatch` on an action or in `defaults:`, in either run mode, so the schemas reference no longer mentions the key. Each stored record still names its chosen schema in `metadata.output_schema`.'
time: 2026-11-18T19:20:00Z
