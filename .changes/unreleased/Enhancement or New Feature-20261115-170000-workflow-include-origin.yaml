kind: Enhancement or New Feature
body: '`agac inspect` shows where an included action comes from: the workflow view marks it `from branch <name>`, and `agac inspect action` and `agac inspect context` show its branch and branch file, also under `branch` in `--json`. The action count stays the count of actions; an include entry is not counted. A preflight refusal or warning about an included action adds an `Origin:` line with the branch and the branch file, on `agac run` and on `agac inspect`: the static analyzer issues (the action and the action it refers to), a missing tool, a read of an action that is not upstream, a tool that does not set a required field, an expect block defect, resolution checks, dag-fit and tool passthrough. The line comes from the action a message is about, never from a word in its text, and a warning group puts it last. `agac inspect` shows nothing new for a host action, and a workflow with no include prints as before.'
time: 2026-11-15T17:00:00Z
