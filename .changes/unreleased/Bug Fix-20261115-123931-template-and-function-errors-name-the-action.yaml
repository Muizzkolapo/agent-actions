kind: Bug Fix
body: "A template rendering error, a function-not-found error and a missing required configuration error now name the workflow on an `Agent:` line, when it is known, and the action on an `Action:` line. Their formatters built a context of their own. The template error printed the action as `Agent:`; with a workflow given on the command line, its problem text named the workflow and the action was not printed. The function-not-found error printed no `Agent:` or `Action:` line. The missing required configuration error printed no `Action:` line, and when the error named no action its problem text named the action `unknown`, or the workflow given on the command line. The template title now reads `Template rendering failed in agent '<workflow>'` when the workflow is known. The problem text no longer repeats the action that the `Action:` line shows. A missing `model_vendor` found by the configuration manager or at batch submission now names its action and the field; a missing required configuration error that lists no field shows its own message. A YAML syntax error and a tool file discovery or import error now keep the workflow too. A blank value on the `Agent:`, `Action:`, `File:`, `Field:`, `Model:`, `Provider:` or `Mode:` line now prints no line. A problem of several lines is followed by a blank line before the context lines."
time: 2026-11-15T12:39:31Z
