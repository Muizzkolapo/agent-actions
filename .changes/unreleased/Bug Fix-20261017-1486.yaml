kind: Bug Fix
body: >-
  Under `run_mode: batch`, a record whose own prompt cannot be rendered now fails alone, as
  under online, wherever it comes in the input. Batch's pre-flight renders the first prompts of
  an action before anything is sent, and stopped the whole action when the first record it
  tried lacked a field it observes, held a value nested too deep to print, or lacked a
  variable the template names; `agac retry` of such a record, which hands the action that
  record alone, could never finish. Pre-flight now passes over such a record to the next, and
  the run fails it with its reason and answers the rest. A malformed template, or an action
  every record of which fails, still stops the action.
