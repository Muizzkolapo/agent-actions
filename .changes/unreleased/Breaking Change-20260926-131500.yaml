kind: Breaking Change
body: "An action that reads at FILE granularity must now declare `dependencies`, and preflight refuses one that does not — where before the config validated and the run failed on `Object of type FileUDFResult is not JSON serializable`, pointing at the output writer rather than at the configuration. FILE granularity means an action receives a whole file of an upstream action's records at once, and the first action of a workflow has no upstream: it reads the staged input, and that is driven by a different pipeline, which selects its strategy by neither granularity nor kind. So a first action declaring FILE granularity was processed one record at a time regardless — silently, when its tool happened to return plain records, and with an unserializable-object error when the tool returned `FileUDFResult` as FILE tools are meant to. The refusal names the action, says a first action is always processed per record, and points at the fix: put a RECORD action in front and depend on it, which is what every FILE tool in the shipped examples already does. It applies to `hitl` actions as well as `tool` ones, because HITL reaches FILE mode without declaring it and hits the same missing dispatch, and it resolves granularity through the workflow's `defaults` block the way the config expander does, so an action that inherits FILE granularity is refused on the same terms. Nothing that ran correctly stops running: the shape this refuses either crashed or ignored the granularity it declared. One test fixture did rely on the silent form and now adds its FILE action downstream instead."
time: 2026-09-26T13:15:00Z
