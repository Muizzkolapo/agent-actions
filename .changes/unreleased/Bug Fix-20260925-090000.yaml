kind: Bug Fix
body: "Source data is saved to the store, and the framework no longer reports it as a file. Four surfaces named `agent_io/source/<relative_path>.json` — a debug log, the line that says a save completed, the error raised when no storage backend is configured, and both source-data events — for a path no version of the framework ever wrote, and whose directory was removed outright when the correlation artefact went. Anyone following it found nothing. All four now carry the relative path the store keys those items by. The two events rename their payload field from `file_path` to `relative_path` and say \"under\" rather than \"to\", so a reader of `events.json` is not handed a filename that never existed; nothing in the framework consumed that field as a path. The error also offered `tinydb` as a backend to configure, which does not exist — the backend is `sqlite`."
time: 2026-09-25T09:00:00Z
