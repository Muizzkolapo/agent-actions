kind: Bug Fix
body: 'A run now names an edit to what an action''s answer is, as it names an edit to its prompt or model. An edit to `json_mode`, `output_field`, `run_mode`, `granularity`, `on_empty`, the `expect:` block or the provider endpoint (`base_url`, or the URL of the declared endpoint the action uses) kept the stored answers with no warning, so a run looked current under a config it never ran. These are now stamped (`output_settings_hash`, `endpoint_hash`) and named as "output settings" and "provider endpoint"; a stamp written before them names no edit, and `request_timeout`, `retry`, `api_key` and `enable_prompt_caching` still are not edits. The warning also names every action that reads the edited action''s output, directly or through others, since their input is the output from before the edit.'
time: 2026-11-16T12:00:00Z
