kind: Bug Fix
body: "Batch carry-forward no longer deletes a minting action's stored answers when a run does not settle. The rule that stops an expansion's stale rows being merged back beside their replacements resolves each stored row to the inputs behind it, and read the run's whole output as evidence of what it answered for. A row the provider failed is keyed on its input and holds no answer, and a row can be stamped failed or exhausted after enrichment has already named its producers - so a refused run counted as having answered for those inputs, and every stored row behind them was dropped. Measured against a real store: two stored answers gone, replaced by an error row holding no content. The same for exhaustion, for a cascade skip, and for a guard skip, whose state is terminal and whose disposition is a passthrough. Only a row settled as `processed` now answers for an input. Two further gaps closed. How many rows an input yields is decided per run from what the provider returned, so the same input mints several rows one run and keeps its own identity the next; each direction is a replacement, and reading one side alone left four rows where one and three were right. And a row the run rewrote under a stored row's own identity now replaces it before anything else is asked, since carried rows are appended to the run's own output and an identity in both lists is written twice. The `submitted_guids` parameter is gone, the shape it guarded - a stored row that names inputs while carrying another's identity - now being kept by the rule itself: a stored row naming one input is inferred away, naming several never. That reads one producer as a mint, which holds where this runs, because a batch row naming producers has been re-keyed. It is not true of every writer, and the limit is recorded in the code: a FILE-mode merge of two inputs keeps one identity and names one producer, and `build_carry_forward` holds the stricter reading such rows need. Reachability is narrower than the issue describes. A batch record-mode expansion writes one disposition under the *input's* identity, so a cleanly completed action is narrowed away and never reaches the merge; and `--fresh` deletes the stored output before anything re-runs, so the merge finds nothing to carry. What reaches it is a clearing that leaves rows behind: `agac retry`, which clears the records it names, or a reset of a failed, interrupted or config-changed action, which clears failed, exhausted and deferred records while `success` stands. Two limits remain. An input that is itself an expansion child carries a minted identity, so if its producer re-runs and re-mints, the rows behind it stop matching and the accumulation can recur - the nested-expansion gap #1022 tracks. And a run that mints rows and then stamps them unsettled leaves them for a later `processed` run to clear, since nothing names a mint but the run that made it; no path in the batch code produces that shape today."
