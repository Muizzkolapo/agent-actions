kind: Bug Fix
body: "Batch carry-forward no longer deletes a minting action's stored answers when a run does not settle. The rule that stops an expansion's stale rows being merged back beside their replacements resolves each stored row to the inputs behind it, and read the run's whole output as evidence of what it answered for. A row the provider failed is keyed on its input and holds no answer, and a row can be stamped failed or exhausted after enrichment has already named its producers - so a refused run counted as having answered for those inputs and every stored row behind them was dropped. Measured against a real store: two stored answers replaced by an error row holding no content, where the rule this corrects kept them. The same held for exhaustion, for a cascade skip, and for a guard skip, whose state is terminal and whose disposition is a passthrough. Only a row settled as `processed` now answers for an input. Two further gaps closed. How many rows an input yields is decided per run from what the provider returned, so the same input mints several rows one run and keeps its own identity the next; each direction is a replacement, and reading one side alone left four rows where one and three were right. And a row the run rewrote under a stored row's own identity now replaces it before anything else is asked, since carried rows are appended to the run's own output and an identity in both lists is written twice. The `submitted_guids` parameter is gone: the set it received was the post-gate inputs rather than the ones the batch carried, and the shape it guarded - a stored row naming several inputs while carrying another's identity - is now handled without an input set, by never inferring such a row away at all. A row naming exactly one input is the shape a mint makes and the only one an answer removes; naming several means the row also holds what its other inputs gave it, so it is handed back, a duplicate being visible where a dropped row is not. Reachability is unchanged: a batch expansion writes one disposition under the input's identity, so a cleanly completed action is narrowed away and never reaches the merge - it is `agac retry`, a coordinator reset of a failed or config-changed action, or `--fresh` that puts the whole input set back through it. One limit remains: an input that is itself an expansion child carries a minted identity, and if its own producer re-runs and re-mints, the rows behind it stop matching and the accumulation can recur - the nested-expansion gap #1022 tracks."
