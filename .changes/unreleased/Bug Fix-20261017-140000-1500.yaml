kind: Bug Fix
body: >-
  A prompt that reads a field its upstream namespace does not have (for example
  `{{ note_direct.summary }}` on a record whose `note_direct` output holds only `note`)
  still fails that record, but the error now names the namespace and the field:
  "'note_direct' has no field 'summary' (it has: note)", with `note_direct.summary` as
  the missing variable. It was logged as "Namespace 'summary' not found in context ...
  nothing supplies 'summary'" and stored as "references undefined variables: summary".
  A field missing from a mapping inside a namespace, or from a list member, is named by
  its place (`note_direct.inner`, `note_direct.items[1]`) (1500).
time: 2026-10-17T14:00:00Z
