kind: Breaking Change
body: "`interceptors:` is no longer accepted anywhere. The interceptor system it configured — the response-processing factory, the validation interceptor and the realtime interceptor service — was deleted some time ago, but its config surface was not: the key stayed declared on the action schema and the expander kept copying it onto the runtime agent, where no stage ever read it. A workflow writing an `interceptors:` block therefore passed validation, carried the value all the way onto the agent config, and ran as though the block were not there. That the value *reached* the agent is what kept it hidden — anything dumping or inspecting the agent config showed the interceptors present and apparently applied. It is refused at load on all four surfaces that could carry it: an action, a `defaults:` block, a legacy top-level `agents:` entry, and the `default_agent_config:` block of `agent_actions.yml` that every agent merges over. The last two validate against models that allow extra keys, so removing the declaration refuses nothing there and they are refused by an explicit check instead — without it, moving the block up a level to escape the new error would have put it back on every agent at once, unread, which is the original bug rather than a migration. There is no replacement key, because there is no longer anything to configure: delete the block. The same deletion's other half, `reprompt:`, was retired earlier. Nothing in this repo's examples, fixtures or sample project used the key."
time: 2026-09-26T09:00:00Z
