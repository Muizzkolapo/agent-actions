kind: Breaking Change
body: "An input a FILE tool consumed without producing a row of its own is recorded as `reason=consumed_into_output`, replacing `collapsed_into_output`, and is no longer reprocessed on every run. The reason names neither direction because the write site cannot tell one: the flag there compares batch lengths, so a result where one input split and the rest mapped 1:1 reports an expansion for all of them, and a 3-in/3-out result where one input really split reports none. An input that was split is not collapsed, so the old name was wrong for half its uses. If you query or filter disposition rows on `collapsed_into_output`, update the string; nothing in the framework branches on it. Two shapes were reprocessed. A tool returning more rows than it received is an expansion, and lineage enrichment mints a fresh identity for every output row of one, so no row carried the input's identity and the input got no disposition row at all — `agac dispositions` showed rows only for identities the run had just invented. A tool returning as many rows as it received while splitting one of them got its row, from the contributor sweep, but no row carried its identity either. In both cases carry-forward reads prior output by `source_guid` and found nothing, so the input was re-queued at the end of the work list and split again into a fresh set of identities on every run, leaving the previous set's disposition rows behind and reordering an input that FILE mode maps by position. Rows minted for an input now name it as `producer_source_guid` and carry-forward resolves an input through the rows it produced, so the work is done once and the identities hold. This is the immediate producer, not `parent_source_guid`, which is deliberately the original pool-resolvable ancestor and names the grandparent once an input has itself been expanded; it is a per-stage field, so it does not reach the next action, where it would name a record that action never received. The record-mode expansion paths (online and batch) mint in the same enricher and were reprocessed the same way; they are fixed by the same change. An input an expanding tool consumed but did not name is still claimed neither way, and an input a tool genuinely dropped still gets its `tool_missing_record` tombstone."
time: 2026-09-26T09:00:00Z
