kind: Breaking Change
body: "`interceptors:` is no longer a key of an action. The interceptor system it configured — the response-processing factory, the validation interceptor and the realtime interceptor service — was deleted some time ago, but its config surface was not: the key stayed declared on the action schema and the expander kept copying it onto the runtime agent, where no stage ever read it. A workflow writing an `interceptors:` block therefore passed validation, carried the value all the way onto the agent config, and ran as though the block were not there. That the value *reached* the agent is what kept it hidden — anything dumping or inspecting the agent config showed the interceptors present and apparently applied. It is now refused at load. There is no replacement key, because there is no longer anything to configure: delete the block. The same deletion's other half, `reprompt:`, was retired earlier; a `defaults:` block already refused `interceptors` by never declaring it, so the action surface was the only one accepting it. Nothing in this repo's examples, fixtures or sample project used the key."
time: 2026-09-26T09:00:00Z
