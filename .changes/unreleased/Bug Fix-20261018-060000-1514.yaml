kind: Bug Fix
body: >-
  `agac retry` repairs an action that a store error failed before any of its records ran,
  such as the store failing while the action was set running or while its rows were counted.
  Retry refused it ("No failed record is recorded … Run 'agac run …'"), or, when the action
  had not been set running, reported "Nothing to retry" with exit 0 while the workflow was
  unfinished. Such an action is now recorded `failed` whether or not it was set running, with
  the error as its `error_message` in `.agent_status.json`, and once the store answers,
  `agac retry` re-runs it and every action after it in full, as it already does for any
  failure of the action's own; its plan names the error. Any action a run's error sweeps from
  running to failed records that error too, and an action that runs again no longer carries
  the error of an earlier failure. (#1514)
