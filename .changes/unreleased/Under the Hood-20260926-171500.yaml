kind: Under the Hood
body: "Pins the container case for a FILE tool's `source_index` and documents the rule where a tool author reads it. A position must be a non-negative built-in `int`, and #1087 refuses anything else at the boundary that declares it — but nothing named the shape a tool actually produces by mistake: `[[0, 1]]`, an index list wrapped once too often, which reads as one contributor that is itself a list. Four container types are now asserted alongside the string and float cases. Separately, the rule was documented only in the agent skill file; the published tools reference now states it too, including that a numpy or pandas index is not an `int` and needs `int(idx)`, and that an index past the end is accepted because a tool cannot always know how many records the guard left it. No behaviour change."
