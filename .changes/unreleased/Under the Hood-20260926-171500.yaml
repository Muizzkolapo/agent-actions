kind: Under the Hood
body: "Pins the container case for a FILE tool's `source_index` and documents the rule where a tool author reads it. A position must be a non-negative built-in `int`, and #1087 refuses anything else at the boundary that declares it — but nothing named the shape a tool actually produces by mistake: `[[0, 1]]`, an index list wrapped once too often, which reads as one contributor that is itself a list. Four container types are now asserted alongside the string and float cases. Separately, the published tools reference said nothing about the rule; it now states it, including that a numpy or pandas index is not an `int` and needs `int(idx)`, and that an index past the end is accepted at the boundary but only ever dropped as a contributor — a parent naming no input fails the action instead. No behaviour change."
