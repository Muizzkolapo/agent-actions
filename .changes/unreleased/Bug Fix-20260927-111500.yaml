kind: Bug Fix
body: "A first action no longer offers the framework's own record-keeping keys to the model as fields of the user's document. The source namespace for such an action was taken from the whole record: correct for a record that carries its payload under `content.source`, wrong for one whose user fields sit at the top level beside `source_guid`, `node_id` and `lineage`, because the namespace builder then published the record itself as the document. An `observe` list that names fields hid this, since such a list never names a framework key; a wildcard `observe: [source.*]` sent all three to the model. The first-stage path now resolves through the same normalizer the rest of the framework uses, so `RECORD_FRAMEWORK_FIELDS` draws the boundary that a record without an envelope does not carry, and a user field that happens to share a framework name still reaches the prompt when it sits inside the document, where the envelope distinguishes the two. The guard path is aligned the same way: it had resolved a first-stage record from the inner content dict rather than the record envelope and so produced a source namespace one level too deep. No guard outcome changes as a result — the guard evaluator merges the record after the context, so the record's own namespaces already won — and no behaviour changes for the enveloped records the staging pipeline writes, which are the only shape it produces. Separately noted, not fixed: on the file-granularity path a flat row's user field named `metadata` or `lineage` is still discarded by the prompt exclusion list, which overlaps names a document may legitimately use, and narrowing that list is a decision rather than a fix; the same un-normalized derivation exists in the file-mode enrichment pass, where the first-stage case does not arise; and `agent_io/store` holds no flat source rows in the first place, so none of this is reachable from a workflow today."
time: 2026-09-27T11:15:00Z
