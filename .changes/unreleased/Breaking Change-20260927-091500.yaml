kind: Breaking Change
body: "`reprompt:` and `on_schema_mismatch:` are now refused on every block that carries agent settings, and each refusal names the `expect:` block that replaces it. Both keys were retired with the runtime that read them, and the two strict surfaces — an action and `defaults:` — already refused them, but as keys the schema does not declare: on an action the message was `Extra inputs are not permitted`, which does not even name the key, and on `defaults:` it listed the valid keys, which invites moving the block somewhere else. The other two surfaces are validated by models that allow extra keys, where leaving a field undeclared refuses nothing, so that relocation succeeded: a `reprompt:` block written in a top-level `agents:` entry, or in the `default_agent_config:` of `agent_actions.yml`, loaded clean and rode onto every agent at once, where no stage read it. Anything dumping or inspecting an agent config showed the setting present and apparently applied, which is what kept it hidden — a project asking for schema repair got none and had no signal saying so.\n\nThe refusal carries the migration rather than telling the reader to delete the block, because unlike a key whose feature was deleted, the behaviour these two asked for is still available. A `reprompt:` block that only checked the schema becomes `expect: {repair: auto}`, and one naming a `validation:` function becomes a rule list. For `on_schema_mismatch:`, `reprompt` mode becomes `expect: {repair: auto}` and `reject` — halt rather than regenerate — becomes `expect: {max_iterations: 1, on_exhausted: raise}`; a refusal offering only the first would turn a deliberate halt into a retry loop. No source config in this repo, its examples or the sample project writes either key, so nothing the loader reads is affected. Generated workflow artefacts under `artefact/rendered_workflows/` do still carry pre-retirement `reprompt:` blocks; those are build output that the config loader never reads, and the surfaces the blocks sit in refused the key before this change too."
time: 2026-09-27T09:15:00Z
