kind: Bug Fix
body: 'A status file whose action entry is not a JSON object (for example `"summarize": "completed"`) now stops `agac status` with exit code 1 and `Status file is corrupted`, naming the file and the action. `agac run`, `agac dispositions`, `agac schema` and `agac retry --dry-run` stop with the same error, where `agac run` crashed with an `AttributeError` before. These four commands also refuse a status file that is not a JSON object (for example `[1]` or `null`), with the `unexpected format` error `agac status` gives, where some of them crashed or read it as no status. Their error tells you to edit the file or to start over with `agac run --fresh`. `agac run --fresh` clears such a file and starts again. `agac run --fresh` also no longer fails at an action that reads another action: the run read the statuses from before the reset there, and failed with an `AttributeError` when the status file held such an entry. (#1830)'
time: 2026-11-21T12:00:00Z
