kind: Enhancement or New Feature
body: "agac run --file-limit walks at most N input files per action regardless of the workflow config, taking precedence over AGAC_FILE_LIMIT. The file axis now has the same run-level doors the record axis has, so a project can be shrunk from outside along both rather than only by staging fewer files. A value that cannot bound anything fails the run before any action starts, the limit in force is stored with a completed action so lifting it re-runs what it held back, and the walk names the flag or variable that stopped it. Neither the flag nor the variable holds back agac retry: a repair walks every file holding a record it named, which also fixes a configured file_limit stranding a named record at actions reading their input from the store."
