kind: Bug Fix
body: 'An action''s token count is now the sum over every model call it made, and `artefact/runs.json` holds it. A run that made model calls showed `total_tokens: 0` and no tokens on the action: the executor read the usage of the last call from a context variable that a record''s thread never shared, and a run that collected a batch wrote none of the batch''s usage. Each call''s usage is now added to a sum for its action, by kind (`main` for the action''s own call and a retry of it, `repair` for a call an `expect:` repair makes, `judge` for an `llm_judge` vote, or the name of any other side call), by pricing (online or batch) and by model. In `runs.json`, `actions[<name>].usage` holds `calls`, `input_tokens`, `output_tokens`, `cache_read_input_tokens`, `cache_creation_input_tokens` and the same five per kind under `by_kind`; the run has a `usage` total; `actions[<name>].tokens` and `total_tokens` keep their names and are now sums. `input_tokens` in `usage` leaves out the cached tokens, so the three input fields add up to the prompt; a vendor that reports no cached tokens gives 0, and OpenAI-style `prompt_tokens_details.cached_tokens` and Gemini''s cached content count are read as cache reads. A batch''s results are counted when they are read, in the run that reads them: the first batch, a retry, a repair round and a judge batch alike, each once, however often a resume or `agac retry` reads the batch again. A failed or interrupted action still reports the calls it made, and the run line''s `(N tokens)` is the same sum. A call that reports no tokens is still counted as a call. A run that checks a batch now lists the action in `runs.json` with its start, and its end when the check completes or fails; before, such a run listed nothing for the action.'
