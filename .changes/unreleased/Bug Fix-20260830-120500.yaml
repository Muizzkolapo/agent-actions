kind: Bug Fix
body: "Every contributor to a many-to-one collapse now gets a disposition row. A FILE tool folding N inputs into one output wrote a single `success` row keyed on the carrier (the first contributor's guid), so `agac dispositions` showed one row for an action that consumed nine records and the other contributors were unaccounted at the consuming action. Contributors whose guid is not carried on any output now get `success` with `reason=collapsed_into_output`, distinguishing \"produced a record\" from \"was folded into one\". The carrier keeps its bare success row, a record no output accounts for is still tombstoned `tool_missing_record`, and 1:1 tools are unaffected."
time: 2026-08-30T12:05:00Z
