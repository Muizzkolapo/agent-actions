kind: Bug Fix
body: >-
  A batch collect pass no longer fails, and the action no longer never finishes, when a
  lost record's first retry admits no task. When a batch result lacks a record and retry is
  on, the collect pass rebuilds that record's task; if preparation admits none (a guard
  decides differently when the record is prepared again), `RetrySubmissionImpossible` was
  raised. Later retry rounds treat it as exhaustion and finalize the file, but the first
  round let it out of the pass, which failed the action. The next run reset it, found the
  same finished batch still owed, and paused, and the run after that failed again, so none
  of the file's records were stored. The first round now gives those records up as later
  rounds do, under the action's `on_exhausted`, and finalizes the file. A repair round had
  the same gap from the other side: `submit_repair_batch` sent whatever preparation
  admitted, even nothing, so an empty batch went to the provider and the next pass failed
  every record of the round. It now submits nothing when no task is admitted, and the
  records are given up under `on_exhausted`.
time: 2026-10-16T16:00:00Z
