kind: Bug Fix
body: >-
  A `granularity: File` tool output that gathers every record an action above split
  from one source back into one row now takes that source's `source_guid`, so a
  fan-in pairs it with other branches' records of the source as it pairs a record
  that was never split. It kept the first split record's identity, so beside a
  branch that split the same source the fan-in failed, and a retry could not get
  past it. An output that gathers records of several sources, or only part of a
  split, keeps its first input's identity as before. (#1509)
time: 2026-10-18T06:00:00Z
