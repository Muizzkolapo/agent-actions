kind: Bug Fix
body: 'A batch collect pass no longer stops on an error because of its type. It stopped the action on any RuntimeError, so a RuntimeError that a provider''s SDK raised while one file was read left the files after it uncollected and the records of that file `deferred`. Such an error now fails the records of that file only, with the error as the reason, and the pass collects the other files; `agac retry` sends those records again. The pass stops the action on a policy halt and on an error declared fatal to the action where it is raised: an `expect:` block that cannot be resolved, a store that fails to write the file, a recovery phase this version does not run, a batch registry that cannot be loaded and a store that is not open. When the records of a failed file cannot be marked failed, because its context map cannot be read, the pass collects the other files and then fails the action with an error that names the file, so the records do not stay `deferred` under an action that reads complete.'
