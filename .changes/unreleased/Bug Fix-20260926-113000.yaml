kind: Bug Fix
body: "A row a FILE tool invented — declared with `source_index: None`, because no single input produced it — no longer ends up naming its own previous identity as its producer. Such a row is minted a `source_guid` where it is built, and carries no `parent_source_guid` on purpose. When the same tool call also returned more rows than it received, the whole result is treated as a 1→N expansion, and lineage enrichment then re-minted every row and recorded the guid it had replaced as that row's `parent_source_guid`. For the invented row the guid it replaced was the one just minted for it, so the row was stored claiming a producer that exists in no source pool and matches no record anywhere — against the contract stated in `agent_actions/record/envelope.py`, where `parent_source_guid` is the original source-pool identity and a row with no single producer adds none of its own. Such a row now keeps the identity it was minted and goes on claiming no producer. Nothing else about an expansion changes: a row that did name an input is still re-minted and still attributed to the input's pool identity, which is what keeps two children of one input off a single identity, and a row arriving with no identity at all is still minted here. No consumer behaved differently before this fix — every reader of `parent_source_guid` treats a guid that resolves nowhere the same as an absent one — so the correction is to what the store records about where a row came from, not to how a run behaves."
