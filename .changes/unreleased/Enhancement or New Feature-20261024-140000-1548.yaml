kind: Enhancement or New Feature
body: >-
  `agac retry --filter <action>:<record_id> --reason "..."` keeps a record that fails the
  same way on every attempt out of the workflow without retrying it. It marks the record
  `filtered` at that action with the reason given, as a guard's `on_false: filter` does,
  so no retry selects it again, and removes what its failure cascaded into the actions
  below, which then hold nothing for it. It runs nothing and calls no LLM, validates every
  target before writing any (an unknown action or record, or one not failed or exhausted
  there, is refused with where to find the right id), and changes a live
  `_retry_manifest.json` to match, so resuming an interrupted retry keeps the filter
  instead of putting the failure back. Repeatable; `--dry-run` lists what it would
  filter. (#1548)
