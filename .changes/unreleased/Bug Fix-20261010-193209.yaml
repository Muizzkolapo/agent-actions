kind: Bug Fix
body: >-
  A prompt written inline in a workflow file now renders per record and per version, as a
  prompt in the prompt store does, online, in batch and under `agac retry`. Loading a
  workflow rendered the whole file through Jinja with no variables before parsing it, so an
  inline prompt was rendered once, at load: `{{ i }}`, `{{ idx }}` and a custom version
  `param` rendered as nothing and every version was sent the same prompt while the run
  reported success, and `{{ extract_facts.facts }}`, `{{ source.page_content }}` or
  `{{ version.length }}` stopped the load with "'extract_facts' is undefined". The load now
  renders only the tags whose names the file defines (`{% set %}`, loops, imports, macro
  parameters, the macros and variables of `templates/`, `load_prompt`) and leaves every other
  tag in place, together with any `{% set %}` block or macro the prompt defines around such a
  tag and then tests: an action's prompt keeps it for the per-record render, and a versioned
  action's other values render once per version, so the documented "Parallel Model
  Comparison" that switches `model_vendor` on `i` takes each version's branch instead of the
  `else` branch for all of them. Below that, `context_scope` withheld the names a version
  promotes to the top level, so `{{ i }}`, `{{ idx }}` and a custom param were undefined per
  record even in a prompt store prompt; they now reach the prompt with `version.*`.
