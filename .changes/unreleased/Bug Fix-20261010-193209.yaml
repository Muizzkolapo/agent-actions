kind: Bug Fix
body: >-
  A prompt written inline in a workflow file now renders per record and per version, as the
  same prompt in the prompt store does, online, in batch and under `agac retry`. Loading a
  workflow rendered the whole file through Jinja with no variables before parsing it, so an
  inline prompt was rendered once, at load: `{{ i }}`, `{{ idx }}` and a custom version
  `param` rendered as nothing and every version was sent the same prompt while the run
  reported success, an `{% if %}` or `is defined` test on a record's names took one branch
  for every record, and `{{ extract_facts.facts }}` or `{{ source.page_content }}` stopped
  the load with "'extract_facts' is undefined". The load now decides each `prompt:` value
  where it reaches it, with exactly the names Jinja has bound there: a prompt whose names
  are all bound renders at load as before, and one that reads a name only a record supplies
  is kept whole for the per-record render, with the load-time names it reads rendered into
  its own `{{ }}` tags or set at its top. This holds however the YAML writes the prompt,
  below its key or in a flow mapping, and when it reads an action the file names by a tag,
  such as `name: {{ n }}` in a loop or a macro. A versioned action's other values that read a
  version variable render once per version, so the documented "Parallel Model Comparison"
  that switches `model_vendor` on `i` takes each version's branch instead of the `else`
  branch for all of them. Below that, `context_scope` withheld the names a version promotes
  to the top level, so `{{ i }}`, `{{ idx }}` and a custom param were undefined per record
  even in a prompt store prompt; they now reach the prompt with `version.*`.
