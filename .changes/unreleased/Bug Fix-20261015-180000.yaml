kind: Bug Fix
body: >-
  `agac inspect action` now lists every dependency of a fan-in as an input, e.g.
  `left, right  (merge of 2)`, instead of naming the first one the input and the rest
  context. A run has always read every dependency and merged their records by source
  record whatever the order; the docs that said the first dependency drives the
  execution count now describe that. `agac inspect action --json` reports the same: a fan-in's
  `input_sources` hold every dependency, its `context_sources` only actions named in
  `context_scope` or the prompt, and its `type` is `Merge` rather than `Transform + Context`.
time: 2026-10-15T18:00:00Z
