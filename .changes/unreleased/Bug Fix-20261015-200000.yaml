kind: Bug Fix
body: >-
  A fan-in over a branch that returns several records per input now pairs each of
  them with the other branches' record for the same source, so the action runs once
  per split record with every branch's fields. It ran once per record of each branch
  instead, each run holding one branch with the others' fields empty, and the run
  reported success. A source a guard filters out of one branch drops the other
  branch's records split from it too. Two branches that both split the same source
  record now fail the fan-in with a message naming them, rather than run on records
  that hold one branch alone.
time: 2026-10-15T20:00:00Z
