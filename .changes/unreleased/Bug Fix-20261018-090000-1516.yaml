kind: Bug Fix
body: >-
  Pre-flight now checks each `action_name.field` a guard reads, the way it checks a prompt's
  references. It refuses a guard naming an action that is not in the workflow, such as
  `nosuch.severity == 'high'`, and suggests the closest action name when one is near. It
  refuses a field that the upstream action's schema does not list, such as
  `merge_alternatives.sevrity == 'high'`, and names the likely field. A field the upstream
  only observes or passes through is refused too: it is not on that action's namespace. The
  `expect` verdict that an action's expectations attach still passes. Pre-flight used to read
  a guard's references only from the legacy `field` key, while a guard's clause is held under
  `clause`. Such a guard passed pre-flight, filtered every record (or, under `IS NULL`, kept
  every one), and the run exited 0 in either run mode. A version action's base name, such as
  `vote.vote` below a merge of `vote_1` and `vote_2`, is on no record and is refused with the
  branch names. `source.*`, `workflow.*`, version params, and a dependency's `output_field`
  still pass. So do the fields of an action with no schema, and fields that a schema's
  `additionalProperties` admits without listing: pre-flight warns about these instead of
  refusing (1516).
