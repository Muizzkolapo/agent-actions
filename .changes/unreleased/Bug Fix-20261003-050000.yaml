kind: Bug Fix
body: >-
  A record that fails prompt preparation in a batch run with nothing else to send is now
  stored as a failure. When the guard turned every other record away and the one it passed
  could not be prepared, for example because the prompt names a field the record does not
  have, nothing was submitted and the record was written to the output as `guard_skipped`,
  with no failed disposition. The output said the guard had turned away a record it had
  passed, `agac retry` had nothing to name, and the action was reported complete. Online
  marks the same record failed. Batch now writes it in the failed state and records the
  failed disposition, so the action ends failed, as it does online.
time: 2026-10-03T05:00:00Z
