kind: Enhancement or New Feature
body: One short flag now means one thing in every command. Every command that takes a workflow takes it as `-w`, `--workflow` or `-a`. Every command that takes an action takes it as `-A` or `--action`. A usage error now names the option by its flags, as in `Missing option '-w' / '--workflow' / '-a'.`, where it said `Missing parameter` and the internal name. (#1829)
time: 2026-11-19T22:00:00Z
