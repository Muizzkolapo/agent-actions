kind: Enhancement or New Feature
body: One short flag now means one thing in every command. Every command that takes a workflow takes it as `-w` or `--workflow`; `-a` and `--agent` still name the same option. Every command that takes an action takes it as `-A` or `--action`. `traces`, `records` and `preview` read `-a` as the action, while the other commands read it as the workflow. They still do, and now print a warning on stderr that says to type `-A` for the action and `-w` for the workflow; `-a` will name the workflow there in a later release. So `agac records -a <workflow>` no longer ends with only a missing-option error, or with an empty list under `--snapshots`. A usage error now names the option by its flags, as in `Missing option '-w' / '--workflow' / '-a' / '--agent'.`, where it said `Missing parameter` and the internal name. (#1829)
