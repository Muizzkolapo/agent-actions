kind: Enhancement or New Feature
body: 'A prompt template can hold `{% cache_point %}` after a long part that many records share, such as the text of one source page. An Anthropic action with `enable_prompt_caching: true` sends the text before the tag as a content block of its own with a cache mark, online and in a batch file, so the records that share it are sent that block byte for byte and can read the cache entry the first of them writes. The tag renders to no text: a tag on a line of its own takes the line with it, and a tag after text on a line keeps the line break after it, so the model reads the prompt it reads without the tag, and `prompt_debug` and the prompt trace show that text. A prompt every record shares is still marked at its end as well. A template may hold at most 3 tags, outside every loop and macro; pre-flight refuses more, because Anthropic takes 4 cache breakpoints in a request. With `enable_prompt_caching` off or unset, or for any other vendor, the tag is removed, the request is byte for byte the one sent without it, and pre-flight says so; the tag alone does not turn caching on. Pre-flight also names what the text before the last tag reads that changes on every request, or that is a field of an upstream action or a per-record seed, which records of one source may not share; a prompt with a tag is no longer told it is sent unmarked. A batch file of such a prompt holds the records of one source next to each other. A template without the tag sends the requests it sent before, and record text is sent as it is: cache points are looked for only in a prompt whose template holds the tag, and the mark a tag renders to is drawn for each process, so no record can hold it. Adding or removing a tag is not an edit of a completed action, as `enable_prompt_caching` is not. Anthropic caches a marked prefix only from a minimum length (512 to 4,096 tokens, by model) and for 5 minutes; the new Prompt Caching page lists these limits.'
