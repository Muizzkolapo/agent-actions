kind: Bug Fix
body: >-
  `agac retry` no longer loses a batch that finished but was not collected. When a batch
  collect pass was stopped part-way (an error, a kill), a file whose batch had finished at
  the provider but had not been collected yet was still waiting. Retry treated only a
  batch still running as owed, so it went ahead, cleared the record of that batch, and
  nothing could collect it afterwards: its records were never answered and the action was
  reported complete. Retry now refuses in that case, as it does for a batch still in
  flight, and says to run the workflow again to collect it first (where the action already
  reads completed that run does not collect it, see #1234, and `--abandon-in-flight` is the
  way through). `--abandon-in-flight`
  still lets the retry through, and now marks as failed every record the abandoned batch was
  still holding, including records whose waiting mark an earlier run had cleared, so a later
  retry can reach them. Whether a finished batch is
  still owed is decided from its records, so a batch collected before this release whose records
  hold their dispositions, or one whose records all failed, does not hold a retry up.
