kind: Bug Fix
body: "A FILE tool whose many-to-one output has no surviving contributors no longer crashes the action. `source_index` accepts a list of input indices, and a tool that filters, dedupes or drops its way to an empty list for one output was saying \"no input produced this row\" — the same thing `source_index: None` says. The framework accepted the value and then indexed the list without checking, so the run failed with `IndexError: list index out of range` from framework internals rather than returning a result or naming the problem. An empty list is now read as no input wherever the mapping is stored, so every reader agrees with the one that already did: the row is minted its own identity, gets fresh lineage, names no parent and no producer, and none of the action's inputs is recorded as consumed by it. That last part matters beyond the crash — the check for \"this result holds a row no input produced\" tests for `None`, so an empty list left in place was invisible to it, the inputs were marked done, and on the next run the row was dropped from the rewritten output with nothing to rebuild it. `source_index: 0` still means the first input; only an empty list is affected."
time: 2026-09-26T15:00:00Z
