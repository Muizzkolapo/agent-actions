kind: Bug Fix
body: "A FILE tool's `source_index` is now checked, element by element, where the tool declares it. `source_index` says which input produced an output row: a position in the input list, a list of positions for a many-to-one output, or `None` when no single input produced it. Only the type of the whole value was checked, never the elements, and six parts of the framework then read them under three different rules — reconciliation took the first element as the row's parent, disposition accounting bounded both ends of every element, lineage bounded only the upper end. So one index could be a contributor to lineage and absent from the accounting that decides whether a record was dropped, for the same row. A bool passed every one of those checks, because `True` is an integer to each of them, and resolved to input 1: a real row, the wrong one, with no error. A `None` inside the list or a string reached lineage's comparison and raised `TypeError`; a float passed the comparison and raised on the indexing a line later. Either way it is caught further out, leaving the row with no provenance at all and its upstream namespaces gone. Each of those is now refused with a message naming the output, the element and what a position may be. A position must be a non-negative built-in `int`, so an integral value from numpy or pandas needs `int()` around it — previously such a value was counted by lineage and not by the accounting, producing exactly the split provenance this change removes. An index past the end of the input list is still accepted at the boundary, because a tool cannot always know how many records the guard left it, but what happens next depends on where it sits: a later element is a contributor and is dropped with a diagnostic, while the first element selects the row's parent, and a parent that does not resolve fails the action rather than being invented. What counts as a position now lives in one predicate all six readers share, so that much cannot drift apart again; what each does with an index past the end still differs by role, deliberately, as above."
