kind: Bug Fix
body: "A FILE tool's `source_index` is now checked, element by element, where the tool declares it. `source_index` says which input produced an output row: a position in the input list, a list of positions for a many-to-one output, or `None` when no single input produced it. Only the type of the whole value was checked, never the elements, and four parts of the framework then read them under three different rules — reconciliation took the first element as the row's parent, disposition accounting bounded both ends of every element, lineage bounded only the upper end. So one index could be a contributor to lineage and absent from the accounting that decides whether a record was dropped, for the same row. A bool passed every one of those checks, because `True` is an integer to each of them, and resolved to input 1: a real row, the wrong one, with no error. A `None` inside the list, a string or a float reached lineage's comparison and raised `TypeError`, which is caught further out, leaving the row with no provenance at all and its upstream namespaces gone. Each of those is now refused with a message naming the output, the element and what a position may be. An index past the end of the input list stays accepted, which is the one tolerance every reader already implemented the same way: a tool cannot always know how many records the guard left it, and the row still resolves against the inputs that do exist. The rule now lives in one place that all six readers share, so they cannot drift apart again."
