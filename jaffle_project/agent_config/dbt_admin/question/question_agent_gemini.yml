question_agent_gemini:
  - agent_type: question_generator
    dependencies: []
    api_key: GEMINI_API_KEY
    model_name: "gemini-1.5-flash"
    model_vendor: "Gemini"
    schema_name: gemini_question
    select_list: []
    prompt:
      - YOU ARE A DBT ANALYTICS ENGINEER EXAM QUIZ CREATOR USING THE SYALLABUS PROVIDED BELOW
      - Question must always be in the context of dbt(data build tool) and the input text provided
      - using the provided input, generate a list of practice exam questions based on the key ideas in this text, a question for each key idea
      - your question tone needs to be as diversed as possible
      - The scenario is meant to create a work or case for the user and not just state the answer
      - The question asks the question based on the scenario
      - The options is a list of options
      - The answer is a letter stating the right option
      - The explanation is stating why the answer is correct and why others are wrong 
      - excerpt The part of the input text used to generate the question
      - The Syllabus includes the following and ensure your question aligns with them using the provided text
      - Identifying and verifying raw object dependencies
      - Understanding core dbt materializations
      - Conceptualizing modularity and how to incorporate DRY principles
      - Converting business logic into performant SQL queries
      - Using commands such as run, test, docs, and seed
      - Creating a logical flow of models and building clean DAGs
      - Defining configurations in dbt_project.yml
      - Configuring sources in dbt
      - Using dbt Packages
      - Utilizing git functionality within the development lifecycle
      - Creating Python models
      - Providing access to users to models with the "grants" configuration
      - Adding contracts to models to ensure the shape of models
      - Creating different versions of our models and deprecating the old ones
      - Configuring model access
      - Understanding logged error messages
      - Troubleshooting using compiled code
      - Troubleshooting .yml compilation errors
      - Distinguishing between a pure SQL and a dbt issue that presents itself as a SQL issue
      - Developing and implementing a fix and testing it prior to merging
      - Troubleshooting and managing failure points in the DAG
      - Using dbt clone
      - Troubleshooting errors from integrated tools
      - Using generic, singular, custom, and custom generic tests on a wide variety of models and sources
      - Testing assumptions for dbt models and sources
      - Implementing various testing steps in the workflow
      - Updating dbt docs
      - Implementing source, table, and column descriptions in .yml files
      - Using macros to show model and data lineage on the DAG
      - Implementing dbt exposures
      - Implementing source freshness
      - Understanding state
      - Using dbt retry
      - Combining state and result selectors

  - agent_type: question_generator_review
    dependencies: ['question_generator']
    api_key: GEMINI_API_KEY
    model_name: "gemini-1.5-flash"
    model_vendor: "Gemini"
    schema_name: gemini_question
    select_list: []
    prompt:
      - This is the source text used to generate the practice dbt exam question source_text = get_from_src[guid]
      - Verify that the question contains the right context based on key ideas from the source_text.
      - Ensure that the scenario presented in the question fits the question context and is relevant.
      - Check that the question is coherent and free from ambiguity and matches content of source_txt
      - Make sure that the overall question promotes critical thinking and understanding.
      - Quiz must always be in the context of source_text



  - agent_type: question_options_explainer_review
    dependencies: ['question_generator_review']
    api_key: GEMINI_API_KEY
    model_name: "gemini-1.5-flash"
    model_vendor: "Gemini"
    schema_name: gemini_question
    select_list: []
    prompt:
      - Remove any references to specific option letters (e.g., "Option A") in the explanation and option list.
      - Ensure the explanation focuses solely on the content and logic behind the correct answer without mentioning its position in the list of options.
      - refer to the actual option text and not just the option letter
