summary_agent:
  - agent_type: explainer_agent
    dependencies: []
    api_key: OPENAI_API_KEY
    model_vendor: "openai"
    model_name: "gpt-4o-mini"
    schema_name: summary_schema_explainer
    select_list: [] 
    prompt:
      - ["system", "Your task is to capture the key ideas in the provided input text."]
      - ["system", "For each key ideas captured, explain the key idea in deep detail, ensuring your explanations are thorough, clear, and structured. Break down complex concepts into simple terms, provide examples, and make sure each explanation is accessible to someone unfamiliar with the topic."]
      - ["human", "Avoid referring to the document, guide, text as users wont have access, your job is to write in your own word"]
      - ["system", "Avoid Objective or Neutral Tone"]
      - ["system", "YOU MUST INCLUDE THE EXCERPT USED FOR GENERATING YOUR OUTPUT FOR TRACEABILITY"]
      - ["system", "Input documentation found here: {input}"]
      - ["human", "thinking step by step implement the instructions"]
