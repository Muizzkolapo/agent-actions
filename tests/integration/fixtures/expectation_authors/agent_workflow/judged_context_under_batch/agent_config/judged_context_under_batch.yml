name: judged_context_under_batch
description: "A judged rule reading another action, under run_mode: batch"
version: "0.1.0"
defaults:
  json_mode: true
  granularity: Record
  run_mode: batch
  model_vendor: ollama_cloud
  model_name: gpt-oss:120b-cloud
  api_key: OLLAMA_API_KEY
  data_source: { type: local, folder: ./staging, file_type: [json] }
actions:
  - name: extract
    intent: "Extract the body"
    schema: judged_context_under_batch_extract
    prompt: $p.Summarize
    context_scope: { observe: [source.page_content] }
  - name: summarize
    intent: "Summarise"
    schema: judged_context_under_batch_output
    prompt: $p.Summarize
    context_scope: { observe: [source.page_content] }
    expect: { repair: none }
