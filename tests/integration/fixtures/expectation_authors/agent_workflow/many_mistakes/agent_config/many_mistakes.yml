name: many_mistakes
description: "Five different mistakes in one block"
version: "0.1.0"
defaults:
  json_mode: true
  granularity: Record
  run_mode: online
  model_vendor: ollama_cloud
  model_name: gpt-oss:120b-cloud
  api_key: OLLAMA_API_KEY
  data_source: { type: local, folder: ./staging, file_type: [json] }
actions:
  - name: summarize
    intent: "Summarise"
    schema: many_mistakes_output
    prompt: $p.Summarize
    context_scope: { observe: [source.page_content] }
    expect:
      repair: none
      expectations:
        - id: flat_args
          type: word_count_between
          field: summary
          min: 5
          max: 60
        - id: old_severity
          type: not_null
          field: summary
          severity: fail
        - id: mistyped_key
          type: not_null
          field: summary
          sevrity: warn
        - id: unknown_type
          type: vibe_check
          field: summary
        - id: absent_field
          type: not_null
          field: no_such_field
