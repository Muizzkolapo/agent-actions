name: shared_suite
description: "One rules-only file, two actions bound to it by name"
version: "0.1.0"
defaults:
  json_mode: true
  granularity: Record
  run_mode: online
  model_vendor: ollama_cloud
  model_name: gpt-oss:120b-cloud
  api_key: OLLAMA_API_KEY
  data_source: { type: local, folder: ./staging, file_type: [json] }
actions:
  - name: summarize
    intent: "Summarise"
    schema: shared_suite_output
    prompt: $p.Summarize
    context_scope: { observe: [source.page_content] }
    expect: { repair: none, suite: shared_quality }
  - name: resummarize
    intent: "Summarise again"
    schema: shared_suite_output
    prompt: $p.Summarize
    context_scope: { observe: [source.page_content] }
    expect: { repair: none, suite: shared_quality }
